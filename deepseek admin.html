    /**
     * Resolve each document's Blob from the order snapshot or the
     * "documents" object store, then wire up Open / Download buttons.
     * Page counts are compared with the stored record and mismatches
     * are flagged so the admin can spot inconsistent data.
     */
    async function hydrateDrawerDocs(order) {
      const token = ++state.drawerToken;
      state.drawerBlobs = {};

      const body = $('#drawer-body');
      if (!body) return;

      const docs = orderDocs(order);

      for (let i = 0; i < docs.length; i++) {
        if (token !== state.drawerToken) return;

        const doc = docs[i] || {};
        const item = body.querySelector(`.dw-doc[data-doc-idx="${i}"]`);
        if (!item) continue;

        const metaEl = item.querySelector('.dw-doc-meta');
        const actionsEl = item.querySelector('.dw-doc-actions');
        if (!actionsEl) continue;

        const snapshotPages = Number(doc.pages) || 0;
        const cacheKey = `${order.id}:${i}`;
        const cached = state.blobCache.get(cacheKey);

        let blob = extractBlob(doc) || (cached ? cached.blob : null);
        let recordPages = cached ? cached.recordPages : null;

        if (!cached) {
          if (!blob) {
            const record = await findDocumentRecord(doc);
            if (token !== state.drawerToken) return;
            if (record) {
              blob = extractBlob(record);
              const rp = record.pages;
              if (rp !== undefined && rp !== null && rp !== '') {
                recordPages = Number(rp) || 0;
              }
            }
          }
          state.blobCache.set(cacheKey, { blob: blob || null, recordPages });
        }

        if (token !== state.drawerToken) return;

        /* ----- meta line: pages + size + mismatch warning ----- */
        const pagesToShow = snapshotPages || recordPages || 0;
        if (metaEl) {
          let html = `${pagesToShow} page${pagesToShow === 1 ? '' : 's'}`;
          if (blob) html += ` · ${fmtBytes(blob.size)}`;
          if (
            recordPages !== null &&
            recordPages > 0 &&
            snapshotPages > 0 &&
            recordPages !== snapshotPages
          ) {
            html += ` <span class="doc-mismatch" title="The stored document has a different page count">stored: ${recordPages}</span>`;
          }
          metaEl.innerHTML = html;
        }

        /* ----- actions ----- */
        if (blob) {
          state.drawerBlobs[i] = blob;
          actionsEl.innerHTML = `
            <button class="mini" data-act="doc-open" data-idx="${i}">${icon('eye', 13)} Open</button>
            <button class="mini solid" data-act="doc-download" data-idx="${i}">${icon('download', 13)} Download</button>`;
        } else {
          actionsEl.innerHTML = `<span class="doc-missing">File not stored on this device</span>`;
        }
        hydrateIcons(actionsEl);
      }
    }

    function openDetail(id) {
      if (!findOrder(id)) return;
      state.detailId = id;

      /* Viewing an order marks it as reviewed. */
      if (!state.seen.has(id)) {
        state.seen.add(id);
        saveSeen(state.seen);
      }
      state.newIds.delete(id);

      render();
    }

    function closeDrawer() {
      state.detailId = null;
      state.drawerToken++;
      state.drawerBlobs = {};
      state.blobCache.clear();
      renderDrawer();
    }

    function markAllSeen() {
      state.orders.forEach((o) => state.seen.add(o.id));
      saveSeen(state.seen);
      state.newIds.clear();
      render();
      toast('All orders marked as reviewed.');
    }

    /* ------------------------------------------------------------
     * 14. Confirm dialog
     * ---------------------------------------------------------- */
    function openConfirm({ title, message, confirmLabel = 'Confirm', danger = false, onConfirm }) {
      pendingConfirm = onConfirm || null;
      const card = $('#confirm-card');
      card.innerHTML = `
        <div class="confirm-icon ${danger ? 'danger' : ''}">${icon(danger ? 'alert' : 'checkCircle', 25)}</div>
        <h3>${esc(title)}</h3>
        <p>${esc(message)}</p>
        <div class="confirm-actions">
          <button class="btn ghost" data-act="confirm-no">Cancel</button>
          <button class="btn ${danger ? 'danger' : ''}" data-act="confirm-yes">${esc(confirmLabel)}</button>
        </div>`;
      $('#confirm-overlay').classList.add('open');
    }

        /* Shown when the admin tries to advance an unpaid order. */
    function openPaymentGate(order, targetStatus) {
      const card = $('#confirm-card');
      if (!card) return;

      /* "Mark as paid & continue" does both actions in one tap. */
      pendingConfirm = async () => {
        await markPaidAndAdvance(order.id, targetStatus);
      };

      card.innerHTML = `
        <div class="confirm-icon warn">${icon('banknote', 25)}</div>
        <h3>Payment not collected</h3>
        <p>
          Please mark <strong>${esc(queueLabel(order))}</strong> as paid
          before moving it to <strong>${esc(STATUS_META[targetStatus].label)}</strong>.
        </p>
        <div class="confirm-actions">
          <button class="btn ghost" data-act="confirm-no">Cancel</button>
          <button class="btn" data-act="confirm-yes">Mark as paid &amp; continue</button>
        </div>`;
      $('#confirm-overlay').classList.add('open');
    }

    /* Mark the order paid (mirrors togglePaid's nested-payment fix),
       then move it to the requested status in a single flow. */
    async function markPaidAndAdvance(id, targetStatus) {
      const order = findOrder(id);
      if (!order) return;

      const patch = { paymentStatus: 'Paid' };
      if (order.payment && typeof order.payment === 'object') {
        patch.payment = Object.assign({}, order.payment, { status: 'Paid' });
      }
      await updateOrder(id, patch);
      /* updateOrder already broadcast the new state (paymentStatus: 'Paid').
         Broadcasting the stale `order` here would overwrite that with the
         old value on the other tab. Do NOT broadcast again. */

      await updateOrder(id, { status: targetStatus });
      toast(`${queueLabel(order)} marked paid · ${STATUS_META[targetStatus].label}`);
      await loadAll({ notify: false });
      render();
    }

    function closeConfirm() {
      pendingConfirm = null;
      $('#confirm-overlay').classList.remove('open');
      $('#confirm-card').innerHTML = '';
    }

    /* ------------------------------------------------------------
     * 15. Mutations
     * ---------------------------------------------------------- */
    async function updateOrder(id, patch) {
      const order = await getOrder(id);
      if (!order) throw new Error('This order no longer exists.');
      Object.assign(order, patch);
      await putOrder(order);
      broadcastOrder(order);
      return order;
    }

    /* Statuses that must not be reached until the order has been paid. */
    const PAYMENT_GATE = new Set(['Printing', 'Ready', 'Completed']);

    async function setOrderStatus(id, status) {
      const order = findOrder(id);
      if (!order) return;
      if (statusOf(order) === status) {
        toast(`${queueLabel(order)} is already ${STATUS_META[status].label.toLowerCase()}.`);
        return;
      }

      /* Block unpaid orders from moving past "Pending". */
      if (PAYMENT_GATE.has(status) && paymentStatusOf(order) !== 'Paid') {
        openPaymentGate(order, status);
        return;
      }

      await updateOrder(id, { status });
      toast(`${queueLabel(order)} → ${STATUS_META[status].label}`);
      await loadAll({ notify: false });
      render(); /* refresh drawer + badges */
    }

    async function advanceOrder(id) {
      const order = findOrder(id);
      if (!order) return;
      const next = nextStatus(order.status);
      if (!next) {
        toast('This order is already finished.');
        return;
      }
      await setOrderStatus(id, next);
    }

    async function togglePaid(id) {
      const order = findOrder(id);
      if (!order) return;
      const current = paymentStatusOf(order);
      const next = current === 'Paid' ? 'Pending' : 'Paid';

      const patch = { paymentStatus: next };
      /* Keep a nested payment object consistent when the customer app uses one. */
      if (order.payment && typeof order.payment === 'object') {
        patch.payment = Object.assign({}, order.payment, { status: next });
      }

      await updateOrder(id, patch);
      toast(`${queueLabel(order)} marked as ${next === 'Paid' ? 'paid' : 'unpaid'}.`);
      await loadAll({ notify: false });
      render();
    }

    function askCancel(id) {
      const order = findOrder(id);
      if (!order) return;
      openConfirm({
        title: 'Cancel this order?',
        message: `${queueLabel(order)} will be marked as cancelled. The customer will see the updated status immediately.`,
        confirmLabel: 'Cancel order',
        danger: true,
        onConfirm: async () => {
          await updateOrder(id, { status: 'Cancelled' });
          toast(`${queueLabel(order)} cancelled.`);
          await loadAll({ notify: false });
          render();
        }
      });
    }

    function askDelete(id) {
      const order = findOrder(id);
      if (!order) return;
      openConfirm({
        title: 'Delete this order?',
        message: `${queueLabel(order)} will be permanently removed from this device. This cannot be undone.`,
        confirmLabel: 'Delete',
        danger: true,
        onConfirm: async () => {
          await deleteOrder(id);
          /* Drop every cached blob for this order (it may have several docs). */
          for (const key of Array.from(state.blobCache.keys())) {
            if (key.startsWith(id + ':')) state.blobCache.delete(key);
          }
          if (state.detailId === id) {
            state.detailId = null;
            state.drawerToken++;
            state.drawerBlobs = {};
          }
          toast(`${queueLabel(order)} deleted.`);
          await loadAll({ notify: false });
          render();
        }
      });
    }

    function askClearFinished() {
      const finished = state.orders.filter(isFinished);
      if (!finished.length) {
        toast('There are no finished orders to clear.');
        return;
      }
      openConfirm({
        title: `Clear ${finished.length} finished order${finished.length === 1 ? '' : 's'}?`,
        message: 'Completed and cancelled orders will be permanently removed from this device.',
        confirmLabel: 'Clear orders',
        danger: true,
        onConfirm: async () => {
          const db = await getDB();
          const transaction = db.transaction('orders', 'readwrite');
          const store = transaction.objectStore('orders');
          const requests = finished.map((o) => store.delete(o.id));
          await Promise.all(requests.map((req) => new Promise((resolve, reject) => {
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error || new Error('Delete failed'));
          })));
          toast('Finished orders cleared.');
          await loadAll({ notify: false });
          render();
        }
      });
    }

    function askResetAll() {
      openConfirm({
        title: 'Reset all local data?',
        message: 'Every order and stored document will be erased from this browser. Close other tabs of the app first. This cannot be undone.',
        confirmLabel: 'Erase everything',
        danger: true,
        onConfirm: async () => {
          if (dbPromise) {
            try {
              const db = await dbPromise;
              db.close();
            } catch (_) { /* ignore */ }
          }
          dbPromise = null;

          await new Promise((resolve, reject) => {
            const req = indexedDB.deleteDatabase(DB_NAME);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error || new Error('Delete failed'));
            req.onblocked = () => reject(new Error('Another tab is using the database. Close it and try again.'));
          });

          state.orders = [];
          state.sig = '';
          state.loaded = false;
          state.detailId = null;
          state.docCount = 0;
          state.newIds.clear();
          state.seen = new Set();
          state.seenInit = false;
          state.blobCache.clear();
          state.drawerToken++;
          state.drawerBlobs = {};

          toast('All local data erased.');
          await loadAll({ notify: false });
          render();
        }
      });
    }

    /* ------------------------------------------------------------
     * 16. CSV export
     * ---------------------------------------------------------- */
    function exportCSV() {
      if (!state.orders.length) {
        toast('There are no orders to export yet.');
        return;
      }
      const rows = [[
        'Queue', 'Order ID', 'Placed', 'Customer', 'Phone', 'Email',
        'Status', 'Payment method', 'Payment status', 'Amount (INR)',
        'Documents', 'Pages', 'File names'
      ]];

      state.orders.forEach((o) => {
        const docs = orderDocs(o);
        const c = customerOf(o);
        rows.push([
          o.queue ?? '',
          o.id ?? '',
          fmt(o.created),
          c.name,
          c.phone,
          c.email,
          statusOf(o),
          paymentMethodOf(o),
          paymentStatusOf(o),
          amountOf(o).toFixed(2),
          docs.length,
          orderPages(o),
          docs.map((d) => (d && (d.name || d.fileName)) || '').join('; ')
        ]);
      });

      const csv = rows
        .map((row) => row.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(','))
        .join('\r\n');

      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `smartxerox-orders-${stamp()}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);

      toast(`Exported ${state.orders.length} order${state.orders.length === 1 ? '' : 's'}.`);
    }

    /* ------------------------------------------------------------
     * 16b. CSV import
     * ---------------------------------------------------------- */
    let importFileInput = null;

    function ensureFileInput() {
      if (importFileInput) return importFileInput;
      importFileInput = document.createElement('input');
      importFileInput.type = 'file';
      importFileInput.accept = '.csv,text/csv';
      importFileInput.style.display = 'none';
      importFileInput.addEventListener('change', onImportFileChosen);
      document.body.appendChild(importFileInput);
      return importFileInput;
    }

    function triggerImport() {
      const input = ensureFileInput();
      input.value = '';
      input.click();
    }

    async function onImportFileChosen(event) {
      const input = event.target;
      const file = input.files && input.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        await processImport(text, file.name);
      } catch (err) {
        console.error('[admin] import failed:', err);
        toast(err && err.message ? err.message : 'Could not read the CSV file.');
      } finally {
        input.value = '';
      }
    }

    /* RFC-4180-ish parser: handles quoted fields, escaped quotes (""),
       BOM, CRLF/LF/CR line endings. */
    function parseCSV(text) {
      if (typeof text !== 'string' || !text) return [];
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;
      let i = 0;
      const len = text.length;

      const endField = () => { row.push(field); field = ''; };
      const endRow = () => { endField(); rows.push(row); row = []; };

      while (i < len) {
        const ch = text[i];
        if (inQuotes) {
          if (ch === '"') {
            if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
            inQuotes = false; i++; continue;
          }
          field += ch; i++; continue;
        }
        if (ch === '"') { inQuotes = true; i++; continue; }
        if (ch === ',') { endField(); i++; continue; }
        if (ch === '\n') { endRow(); i++; continue; }
        if (ch === '\r') { endRow(); i++; if (text[i] === '\n') i++; continue; }
        field += ch; i++;
      }
      if (field.length || row.length) endRow();
      return rows;
    }

    const normHeader = (s) =>
      String(s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

    function buildColumnMap(header) {
      const map = {};
      header.forEach((h, i) => {
        if (!h) return;
        if (h === 'queue' || h === 'queue number' || h === 'q' || h === 'token') map.queue = i;
        else if (h === 'order id' || h === 'id' || h === 'orderid') map.id = i;
        else if (h === 'placed' || h === 'created' || h === 'date' || h === 'placed at' || h === 'created at') map.placed = i;
        else if (h === 'customer' || h === 'name' || h === 'customer name') map.customer = i;
        else if (h === 'phone' || h === 'mobile' || h === 'contact') map.phone = i;
        else if (h === 'email' || h === 'mail') map.email = i;
        else if (h === 'status') map.status = i;
        else if (h === 'payment method' || h === 'method' || h === 'pay method') map.paymentMethod = i;
        else if (h === 'payment status' || h === 'paid') map.paymentStatus = i;
        else if (h === 'amount' || h === 'amount inr' || h === 'total' || h === 'price') map.amount = i;
        else if (h === 'documents' || h === 'docs' || h === 'document count') map.docs = i;
        else if (h === 'pages' || h === 'total pages') map.pages = i;
        else if (h === 'file names' || h === 'files' || h === 'filenames' || h === 'document names') map.fileNames = i;
      });
      return map;
    }

    /* The old export wrote e.g. "26 Nov 2026, 3:45 pm" — try a few variants. */
    function parsePlacedDate(raw) {
      const s = String(raw || '').trim();
      if (!s) return new Date().toISOString();
      let d = new Date(s);
      if (isNaN(d.getTime())) d = new Date(s.replace(/,/g, ''));
      if (isNaN(d.getTime())) d = new Date(s.replace(/[,\u00A0]/g, ' ').replace(/\s+/g, ' ').trim());
      return isNaN(d.getTime()) ? new Date().toISOString() : d.toISOString();
    }

    function buildOrderFromRow(map, row, fallbackQueue) {
      const get = (key) => {
        const idx = map[key];
        return idx === undefined ? '' : String(row[idx] ?? '').trim();
      };

      const rawStatus = get('status');
      const statusHint = rawStatus.toLowerCase() === 'ready for pickup' ? 'Ready' : rawStatus;

      const amountRaw = get('amount').replace(/[^\d.\-]/g, '');
      const amountNum = Number(amountRaw);

      const pages = Number(get('pages')) || 0;
      const docCount = Number(get('docs')) || 0;
      const fileNames = get('fileNames').split(/;\s*/).map((s) => s.trim()).filter(Boolean);

      const docs = [];
      const total = Math.max(docCount, fileNames.length);
      for (let i = 0; i < total; i++) {
        docs.push({ name: fileNames[i] || `Document ${i + 1}`, pages: i === 0 ? pages : 0 });
      }

      const id = get('id') || ('import-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8));

      return {
        id,
        queue: get('queue') || fallbackQueue,
        created: parsePlacedDate(get('placed')),
        status: normStatus(statusHint || 'Pending'),
        paymentStatus: normPay(get('paymentStatus')),
        paymentMethod: get('paymentMethod') || 'Cash',
        amount: Number.isFinite(amountNum) ? amountNum : 0,
        customer: {
          name: get('customer') || '—',
          phone: get('phone') || '',
          email: get('email') || ''
        },
        docs,
        pages
      };
    }

    function validateImportedOrder(order) {
      const errors = [];
      if (!order.id) errors.push('missing order ID');
      const validStatuses = FLOW.concat(['Cancelled']);
      if (!validStatuses.includes(order.status)) errors.push('unknown status "' + order.status + '"');
      return errors;
    }

    async function bulkImportOrders(orders) {
      const db = await getDB();
      await new Promise((resolve, reject) => {
        const tx = db.transaction('orders', 'readwrite');
        const store = tx.objectStore('orders');
        orders.forEach((o) => store.put(o));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error || new Error('Could not save imported orders.'));
        tx.onabort = () => reject(tx.error || new Error('Import was aborted.'));
      });
      orders.forEach((o) => broadcastOrder(o));
    }

    async function processImport(text, fileName) {
      const rows = parseCSV(text);
      if (rows.length < 2) throw new Error('The CSV file has no data rows.');

      const headerIdx = rows.findIndex((r) => r.some((c) => String(c).trim() !== ''));
      if (headerIdx < 0) throw new Error('The CSV file is empty.');

      const header = rows[headerIdx].map(normHeader);
      const map = buildColumnMap(header);

      if (map.id === undefined && map.customer === undefined && map.queue === undefined) {
        throw new Error('Could not recognise the CSV columns. Use a Smart Xerox order export.');
      }

      const dbOrders = await getAllOrders();
      const existing = new Set(dbOrders.map((o) => o.id));

      let maxQueue = 0;
      dbOrders.forEach((o) => {
        const n = Number(o.queue);
        if (Number.isFinite(n) && n > maxQueue) maxQueue = n;
      });

      const imported = [];
      const duplicates = [];
      const invalid = [];

      for (let r = headerIdx + 1; r < rows.length; r++) {
        const row = rows[r];
        if (!row.some((c) => String(c).trim() !== '')) continue;

        let order;
        try {
          order = buildOrderFromRow(map, row, String(maxQueue + 1));
        } catch (err) {
          invalid.push({ row: r + 1, reason: err.message });
          continue;
        }

        /* Bump the sequence whenever the CSV itself supplies a higher number. */
        const nq = Number(order.queue);
        if (Number.isFinite(nq) && nq > maxQueue) maxQueue = nq;

        const errs = validateImportedOrder(order);
        if (errs.length) {
          invalid.push({ row: r + 1, reason: errs.join(', ') });
          continue;
        }
        if (existing.has(order.id)) {
          duplicates.push(order.id);
          continue;
        }
        existing.add(order.id);
        imported.push(order);
      }

      if (!imported.length) {
        toast(`Nothing to import — ${duplicates.length} duplicate${duplicates.length === 1 ? '' : 's'}, ${invalid.length} invalid row${invalid.length === 1 ? '' : 's'}.`);
        return;
      }

      const summaryBits = [
        `${imported.length} order${imported.length === 1 ? '' : 's'} ready to import from ${fileName}.`,
        duplicates.length ? `${duplicates.length} duplicate${duplicates.length === 1 ? '' : 's'} will be skipped.` : '',
        invalid.length ? `${invalid.length} invalid row${invalid.length === 1 ? '' : 's'} will be skipped.` : ''
      ].filter(Boolean);

      openConfirm({
        title: `Import ${imported.length} order${imported.length === 1 ? '' : 's'}?`,
        message: summaryBits.join(' '),
        confirmLabel: 'Import',
        danger: false,
        onConfirm: async () => {
          await bulkImportOrders(imported);
          /* The admin just imported them — don't flag them as "new". */
          imported.forEach((o) => state.seen.add(o.id));
          saveSeen(state.seen);
          toast(`Imported ${imported.length} order${imported.length === 1 ? '' : 's'}.`);
          await loadAll({ notify: false });
          render();
        }
      });
    }

    /* ------------------------------------------------------------
     * 17. Navigation & actions
     * ---------------------------------------------------------- */
    async function navigate(view) {
      if (!['dashboard', 'orders', 'all-orders', 'settings'].includes(view)) return;
      state.view = view;
      if (view === 'settings') {
        await loadDocumentCount();
      }
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function handleAction(act, data) {
      switch (act) {
        case 'refresh': {
          await loadAll({ notify: false });
          if (state.view === 'settings') await loadDocumentCount();
          render();
          toast('Refreshed.');
          break;
        }
        case 'goto-new':
          state.filter = 'new';
          await navigate('orders');
          break;
        case 'mark-all-seen':
          markAllSeen();
          break;
        case 'view-all-orders':
          state.filter = 'all';
          state.search = '';
          await navigate('all-orders');
          break;
        case 'back-to-dashboard':
          await navigate('dashboard');
          break;
        case 'scroll-top':
          window.scrollTo({ top: 0, behavior: 'smooth' });
          break;
        case 'detail':
          openDetail(data.id);
          break;
        case 'close-drawer':
          closeDrawer();
          break;
        case 'advance':
          await advanceOrder(data.id);
          break;
        case 'set-status':
          await setOrderStatus(data.id, data.status);
          break;
        case 'toggle-paid':
          await togglePaid(data.id);
          break;
        case 'ask-cancel':
          askCancel(data.id);
          break;
        case 'ask-delete':
          askDelete(data.id);
          break;
        case 'filter':
          state.filter = data.filter || 'all';
          render();
          break;
        case 'export':
          exportCSV();
          break;
        case 'import':
          triggerImport();
          break;
        case 'clear-finished':
          askClearFinished();
          break;
        case 'reset-all':
          askResetAll();
          break;
        case 'doc-open': {
          const blob = state.drawerBlobs[data.idx];
          if (!blob) {
            toast('This file is not available on this device.');
            break;
          }
          const url = URL.createObjectURL(blob);
          const win = window.open(url, '_blank', 'noopener');
          if (!win) toast('Allow pop-ups to preview documents.');
          setTimeout(() => URL.revokeObjectURL(url), 60000);
          break;
        }
        case 'doc-download': {
          const blob = state.drawerBlobs[data.idx];
          if (!blob) {
            toast('This file is not available on this device.');
            break;
          }
          const order = findOrder(state.detailId);
          const docs = orderDocs(order);
          const idx = Number(data.idx);
          const d = docs[idx] || {};
          const name = d.name || d.fileName || d.filename || `document-${idx + 1}`;
          downloadBlob(blob, name);
          toast('Download started.');
          break;
        }
        case 'confirm-yes': {
          const run = pendingConfirm;
          closeConfirm();
          if (run) {
            try {
              await run();
            } catch (err) {
              console.error('[admin]', err);
              toast(err && err.message ? err.message : 'Something went wrong.');
            }
          }
          break;
        }
        case 'confirm-no':
          closeConfirm();
          break;
        default:
          break;
      }
    }

    /* ------------------------------------------------------------
     * 18. Global event wiring
     * ---------------------------------------------------------- */
    document.addEventListener('click', (event) => {
      const navBtn = event.target.closest('[data-nav]');
      if (navBtn) {
        event.preventDefault();
        navigate(navBtn.dataset.nav);
        return;
      }

      const actionEl = event.target.closest('[data-act]');
      if (actionEl) {
        event.preventDefault();
        handleAction(actionEl.dataset.act, actionEl.dataset).catch((err) => {
          console.error('[admin]', err);
          toast(err && err.message ? err.message : 'Something went wrong.');
        });
      }
    });

    document.addEventListener('input', (event) => {
      if (event.target && event.target.id === 'order-search') {
        state.search = event.target.value;

        /* Re-render only the list area, keeping the input untouched. */
        const content = event.target.closest('.content');
        const list = content && content.querySelector('.queue-list');
        if (list) {
          const filtered = visibleOrders();
          list.innerHTML = filtered.length
            ? filtered.map(orderCard).join('')
            : `<div class="empty">
                 ${icon('search', 30)}
                 <strong>No matching orders</strong>
                 <p>Try a different search term or status filter.</p>
               </div>`;
          hydrateIcons(list);
        }
      }
    });

    /* Close the drawer by tapping the backdrop */
    $('#drawer-overlay').addEventListener('click', (event) => {
      if (event.target === event.currentTarget) closeDrawer();
    });

    /* Close the confirm dialog by tapping the backdrop */
    $('#confirm-overlay').addEventListener('click', (event) => {
      if (event.target === event.currentTarget) closeConfirm();
    });

    /* Escape closes dialogs */
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if ($('#confirm-overlay').classList.contains('open')) {
        closeConfirm();
      } else if ($('#drawer-overlay').classList.contains('open')) {
        closeDrawer();
      }
    });

    /* Scroll-to-top button visibility */
    const scrollTopBtn = $('#scroll-top');
    function updateScrollTopBtn() {
      if (!scrollTopBtn) return;
      scrollTopBtn.classList.toggle('show', window.scrollY > 280);
    }
    window.addEventListener('scroll', updateScrollTopBtn, { passive: true });
    updateScrollTopBtn();

    /* Refresh when the tab becomes visible again */
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        loadAll({ notify: true });
      }
    });
    /* Profile changes in the customer app (same browser) → refresh. */
    window.addEventListener('storage', (event) => {
      if (event.key === PROFILE_KEY) render();
    });
    window.addEventListener('focus', () => loadAll({ notify: true }));

    /* ------------------------------------------------------------
     * 19. Boot
     * ---------------------------------------------------------- */
    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => loadAll({ notify: true }), POLL_MS);
    }

    async function boot() {
      /* Restore the "already seen" set before the first load. */
      const savedSeen = loadSeen();
      state.seen = savedSeen || new Set();
      state.seenInit = savedSeen !== null;

      hydrateIcons(document);
      render();                    /* instant shell */
      connectChannel();
      await loadAll({ notify: false });
      startPolling();
    }

    boot().catch((err) => {
      console.error('[admin] boot failed', err);
      toast('Could not start the admin console.');
    });
  </script>
</body>
</html>
