<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c35">
  <title>Smart Xerox · Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       Smart Xerox · Admin console
       ============================================================ */
    :root {
      --ink: #15213a;
      --muted: #78849a;
      --blue: #325cf4;
      --blue-dark: #244be1;
      --line: #e8edf5;
      --bg: #f6f8fc;
      --green: #16945b;
      --green-soft: #e8f8ef;
      --amber: #b47700;
      --amber-soft: #fff4df;
      --red: #d14848;
      --red-soft: #fdeeee;
      --card-shadow: 0 5px 22px #192c5308;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    h1, h2, h3, h4, p { margin: 0; }
    button { font-family: inherit; cursor: pointer; }
    button:active { transform: scale(.975); }
    button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid #94b4ff;
      outline-offset: 2px;
    }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    svg { display: block; flex: none; }

    /* ---------- shell ---------- */
    .app { display: flex; min-height: 100vh; }
    .side { display: none; }
    .main-area { flex: 1; min-width: 0; }
    .content { max-width: 1080px; margin: 0 auto; padding: 18px 16px 120px; }

    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: -.6px; }
    .brand .mark {
      width: 38px; height: 38px; border-radius: 12px; flex: none;
      background: linear-gradient(135deg, #325cf4, #5379ff);
      color: #fff; display: grid; place-items: center;
      box-shadow: 0 6px 16px #325cf433;
    }
    .brand .mark svg { width: 20px; height: 20px; }
    .brand small { display: block; font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .4px; text-transform: uppercase; margin-top: 1px; }

    /* ---------- topbar (mobile) ---------- */
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 16px; background: #fff; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 15;
    }

    /* ---------- sync pill ---------- */
    .sync-pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: #fff; border: 1px solid var(--line); border-radius: 100px;
      padding: 6px 12px; font-size: 10.5px; font-weight: 800; color: var(--muted);
      white-space: nowrap;
    }
    .sync-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #c3ccdb; flex: none; }
    .sync-pill.ok .dot { background: #10b981; box-shadow: 0 0 0 3px #10b98120; }
    .sync-pill.ok { color: var(--green); }
    .sync-pill.err .dot { background: var(--red); box-shadow: 0 0 0 3px #d1484820; }
    .sync-pill.err { color: var(--red); }

    /* ---------- page head ---------- */
    .page-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; margin: 6px 0 20px;
    }
    .eyebrow { font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--blue); font-weight: 800; }
    .page-head h1 { font-size: 26px; letter-spacing: -1px; font-weight: 800; margin-top: 6px; }
    .page-head p { color: var(--muted); font-size: 12.5px; line-height: 1.55; margin-top: 5px; max-width: 520px; }
    .page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ---------- buttons ---------- */
    .btn {
      border: 0; background: var(--blue); color: #fff;
      padding: 11px 17px; border-radius: 11px; font-size: 12.5px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: background .18s, box-shadow .18s, border-color .18s, color .18s, transform .18s;
      box-shadow: 0 5px 13px #325cf42b;
    }
    .btn:hover { background: var(--blue-dark); }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
    .btn.ghost:hover { border-color: #b3c5f5; color: var(--blue); }
    .btn.danger { background: var(--red); box-shadow: 0 5px 13px #d1484830; }
    .btn.danger:hover { background: #c93b3b; }
    .btn.full { width: 100%; }
    .btn svg { width: 15px; height: 15px; }

    .mini {
      border: 0; background: #f3f6fb; border-radius: 8px; padding: 7px 10px;
      color: #53637d; font-size: 11px; font-weight: 800;
      display: inline-flex; align-items: center; gap: 5px; transition: .18s;
      white-space: nowrap;
    }
    .mini:hover { color: var(--blue); background: #eaf0ff; }
    .mini.solid { background: var(--blue); color: #fff; box-shadow: 0 4px 10px #325cf42e; }
    .mini.solid:hover { background: var(--blue-dark); color: #fff; }
    .mini.danger { background: #fdeeee; color: var(--red); }
    .mini.danger:hover { background: #f9dcdc; color: #b83a3a; }
    .mini svg { width: 13px; height: 13px; }

    /* ---------- alert ---------- */
    .alert {
      display: flex; gap: 11px; align-items: flex-start;
      padding: 14px 16px; border-radius: 14px; margin-bottom: 16px;
      background: var(--amber-soft); border: 1px solid #f1dcb0;
      font-size: 12px; line-height: 1.55; color: #7a5a12; font-weight: 600;
    }
    .alert svg { width: 17px; height: 17px; color: var(--amber); margin-top: 1px; }
    .alert strong { display: block; color: #5d4409; font-weight: 800; margin-bottom: 2px; }

    /* ---------- stats ---------- */
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 22px; }
    .stat {
      background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 14px 15px; box-shadow: var(--card-shadow); min-width: 0;
    }
    .stat-top { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
    .stat-ic {
      width: 30px; height: 30px; border-radius: 9px; flex: none;
      background: #eef2ff; color: var(--blue); display: grid; place-items: center;
    }
    .stat-ic svg { width: 15px; height: 15px; }
    .stat-ic.green { background: var(--green-soft); color: var(--green); }
    .stat-ic.amber { background: var(--amber-soft); color: var(--amber); }
    .stat-ic.red { background: var(--red-soft); color: var(--red); }
    .stat-label {
      font-size: 9.5px; font-weight: 800; letter-spacing: 1.1px;
      text-transform: uppercase; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .stat-value {
      font-size: 23px; font-weight: 800; letter-spacing: -1px;
      font-variant-numeric: tabular-nums; line-height: 1.1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .stat-sub { font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 4px; }

    /* ---------- new-order banner ---------- */
    .new-banner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 18px;
      background: linear-gradient(135deg, #fff8ea, #fff1d6);
      border: 1px solid #f0d9a8; border-radius: 16px; padding: 13px 15px;
      box-shadow: 0 6px 20px #b4770012;
    }
    .nb-left { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .nb-left .stat-ic { flex: none; }
    .nb-left strong { display: block; font-size: 12.5px; font-weight: 800; color: #6b4e0a; }
    .nb-left small { display: block; font-size: 11px; font-weight: 600; color: #8a6a1f; margin-top: 2px; }
    .nb-actions { display: flex; gap: 7px; flex-wrap: wrap; }

    .new-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: #fff4df; color: #b47700; border: 1px solid #f1dcb0;
      border-radius: 100px; padding: 3px 8px;
      font-size: 9px; font-weight: 800; letter-spacing: .6px;
    }
    .q-row.is-new { border-color: #f0d9a8; box-shadow: 0 6px 20px #b4770014; }
    .order-card.is-new { border-color: #f0d9a8; box-shadow: 0 6px 20px #b4770014; }

    /* ---------- section ---------- */
    .section { margin-bottom: 26px; }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .section-head h2 { font-size: 15.5px; font-weight: 800; letter-spacing: -.3px; }
    .section-head small { font-size: 11px; color: var(--muted); font-weight: 600; }

    /* ---------- queue rows ---------- */
    .queue-list { display: grid; gap: 9px; }
    .q-row {
      display: flex; align-items: center; gap: 13px;
      background: #fff; border: 1px solid var(--line); border-radius: 15px;
      padding: 13px 14px; box-shadow: var(--card-shadow);
      transition: border-color .18s, box-shadow .18s;
    }
    .q-row:hover { border-color: #cddbf7; box-shadow: 0 10px 26px #192c5314; }
    .q-num {
      flex: none; min-width: 54px; text-align: center;
      font-size: 17px; font-weight: 800; letter-spacing: -.5px;
      font-variant-numeric: tabular-nums; color: var(--ink);
      background: #f5f8ff; border: 1px solid #e4ecf8; border-radius: 10px;
      padding: 7px 9px;
    }
    .q-body { flex: 1; min-width: 0; }
    .q-line1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .q-line1 strong { font-size: 12.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .q-line2 { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 4px; display: flex; gap: 5px 10px; flex-wrap: wrap; }
    .q-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

    /* ---------- status badge ---------- */
    .sbadge {
      display: inline-flex; align-items: center; gap: 5px;
      border-radius: 100px; padding: 4px 9px;
      font-size: 10px; font-weight: 800; letter-spacing: .3px; white-space: nowrap;
    }
    .sbadge .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
    .sbadge.pending   { background: var(--amber-soft); color: var(--amber); }
    .sbadge.printing  { background: #eef2ff; color: var(--blue); }
    .sbadge.ready     { background: var(--green-soft); color: var(--green); }
    .sbadge.completed { background: #f0f2f6; color: #68758a; }
    .sbadge.cancelled { background: var(--red-soft); color: var(--red); }

    /* ---------- order card ---------- */
    .order-card {
      background: #fff; border: 1px solid var(--line); border-radius: 17px;
      padding: 14px 15px; box-shadow: var(--card-shadow);
      transition: border-color .18s, box-shadow .18s;
    }
    .order-card:hover { border-color: #cddbf7; box-shadow: 0 10px 26px #192c5314; }
    .oc-main { display: flex; align-items: center; gap: 13px; }
    .oc-q { flex: none; min-width: 54px; text-align: center; }
    .oc-q-label { display: block; font-size: 8.5px; font-weight: 800; letter-spacing: 1.3px; color: #94a0b2; }
    .oc-q strong {
      font-size: 18px; font-weight: 800; letter-spacing: -.6px;
      font-variant-numeric: tabular-nums; line-height: 1.15;
    }
    .oc-info { flex: 1; min-width: 0; }
    .oc-title { font-size: 12.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .oc-sub { font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 3px; }
    .oc-right { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .oc-amt { font-size: 15px; font-weight: 800; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
    .oc-actions {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin-top: 11px; padding-top: 11px; border-top: 1px dashed #eef2f9;
    }

    /* ---------- filters ---------- */
    .toolbar { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .search-wrap { position: relative; flex: 1; min-width: 190px; }
    .search-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; color: #94a0b2; pointer-events: none;
    }
    .search-input {
      width: 100%; border: 1px solid #dce4f0; border-radius: 11px;
      padding: 11px 13px 11px 36px; font-size: 12.5px; background: #fff;
      color: var(--ink); font-family: inherit; transition: border-color .15s, box-shadow .15s;
    }
    .search-input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px #325cf420; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip-btn {
      border: 1.5px solid var(--line); background: #fff; border-radius: 100px;
      padding: 7px 13px; font-size: 11px; font-weight: 800; color: #52617a; transition: .16s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .chip-btn:hover { border-color: #a9bdfc; }
    .chip-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 5px 13px #325cf42e; }
    .chip-btn .n {
      font-size: 9.5px; font-weight: 800; padding: 1px 5px; border-radius: 100px;
      background: #eef2f9; color: #68758a; font-variant-numeric: tabular-nums;
    }
    .chip-btn.active .n { background: #ffffff2e; color: #fff; }

    /* ---------- empty ---------- */
    .empty {
      text-align: center; padding: 38px 20px; background: #fff;
      border: 1px dashed #dbe4f2; border-radius: 17px; color: var(--muted);
    }
    .empty svg { width: 30px; height: 30px; color: #aebddd; margin: 0 auto 12px; }
    .empty strong { display: block; color: var(--ink); font-size: 13.5px; font-weight: 800; }
    .empty p { font-size: 11.5px; line-height: 1.6; margin-top: 5px; }

    /* ---------- settings ---------- */
    .card {
      background: #fff; border: 1px solid var(--line); border-radius: 17px;
      padding: 17px; box-shadow: var(--card-shadow); margin-bottom: 14px;
    }
    .card h3 { font-size: 13px; font-weight: 800; margin-bottom: 4px; }
    .card > p.hint { font-size: 11.5px; color: var(--muted); line-height: 1.6; margin-bottom: 13px; }
    .kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 12px; color: #758196; }
    .kv + .kv { border-top: 1px solid #f4f7fc; }
    .kv strong { color: var(--ink); font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .price-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    .price-table th, .price-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #f4f7fc; }
    .price-table th { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: #94a0b2; font-weight: 800; }
    .price-table td { color: #53637d; font-weight: 600; }
    .price-table td:last-child, .price-table th:last-child { text-align: right; font-weight: 800; color: var(--ink); }

    /* ---------- view all / back button ---------- */
    .view-all-wrap { margin-top: 12px; }
    .back-btn { margin-bottom: 2px; }

    /* ---------- scroll to top ---------- */
    .scroll-top {
      position: fixed; right: 16px; bottom: 82px; z-index: 40;
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid var(--line); background: #fff; color: var(--blue);
      display: grid; place-items: center;
      box-shadow: 0 8px 22px #15213a24;
      opacity: 0; pointer-events: none; transform: translateY(14px);
      transition: opacity .22s, transform .22s, background .18s, color .18s, border-color .18s;
    }
    .scroll-top.show { opacity: 1; pointer-events: auto; transform: none; }
    .scroll-top:hover { background: var(--blue); border-color: var(--blue); color: #fff; }

    @media (min-width: 900px) {
      .scroll-top { right: 26px; bottom: 26px; width: 46px; height: 46px; }
    }

    /* ---------- bottom nav ---------- */
    .bottom {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      height: 66px; background: #fff; border-top: 1px solid var(--line);
      display: flex; justify-content: space-around;
      box-shadow: 0 -5px 25px #15213a0a;
    }
    .nav-btn {
      border: 0; background: none; color: #94a0b2;
      display: grid; justify-items: center; align-content: center; gap: 3px;
      font-size: 9.5px; font-weight: 800; min-width: 74px; letter-spacing: .2px;
    }
    .nav-btn svg { width: 19px; height: 19px; }
    .nav-btn.active { color: var(--blue); }

    /* ---------- drawer ---------- */
    .drawer-overlay {
      position: fixed; inset: 0; z-index: 60; display: none;
      background: #101b34a8; backdrop-filter: blur(4px);
    }
    .drawer-overlay.open { display: block; animation: fadeIn .18s ease-out; }
    .drawer {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: min(470px, 100%); background: #fff;
      display: flex; flex-direction: column;
      box-shadow: -24px 0 60px #101c3540;
      animation: slideIn .26s cubic-bezier(.2, .8, .3, 1);
    }
    .drawer-body { flex: 1; overflow: auto; overscroll-behavior: contain; }
    .dw-head {
      position: sticky; top: 0; z-index: 2; background: #fff;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 16px 18px 13px; border-bottom: 1px solid var(--line);
    }
    .dw-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -.8px; margin-top: 3px; font-variant-numeric: tabular-nums; }
    .dw-close {
      flex: none; border: 1px solid var(--line); background: #fff;
      width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
      color: var(--ink); transition: .18s;
    }
    .dw-close:hover { color: var(--red); border-color: #f5c9c9; background: var(--red-soft); }
    .dw-close svg { width: 16px; height: 16px; }
    .dw-content { padding: 16px 18px 26px; }

    .dw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 14px; }
    .dw-cell {
      background: #fafcff; border: 1px solid #eef2f9; border-radius: 12px;
      padding: 10px 12px; min-width: 0;
    }
    .dw-cell small {
      display: block; font-size: 9px; font-weight: 800; letter-spacing: 1.1px;
      text-transform: uppercase; color: #94a0b2; margin-bottom: 3px;
    }
    .dw-cell strong {
      display: block; font-size: 12px; font-weight: 800; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dw-cell a { color: var(--blue); text-decoration: none; font-weight: 800; }
    .dw-cell a:hover { text-decoration: underline; }
    .dw-amount {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 18px; border-radius: 16px; margin-bottom: 18px;
      background: linear-gradient(135deg, #eef2ff, #e0e8ff); border: 1px solid #cfdaff;
    }
    .dw-amount small { font-size: 9.5px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: #5a6b86; }
    .dw-amount strong { font-size: 24px; font-weight: 800; letter-spacing: -1px; color: var(--blue); font-variant-numeric: tabular-nums; }

    .dw-section { margin-bottom: 20px; }
    .dw-section > h3 {
      font-size: 12px; font-weight: 800; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px; color: var(--ink);
    }
    .dw-section > h3 .count {
      font-size: 9.5px; font-weight: 800; color: #68758a;
      background: #f0f2f6; border-radius: 100px; padding: 2px 8px;
    }

    .dw-doc {
      display: flex; gap: 11px; align-items: flex-start;
      background: #fff; border: 1px solid var(--line); border-radius: 13px;
      padding: 12px 13px; margin-bottom: 8px;
    }
    .dw-doc-ic {
      flex: none; width: 34px; height: 38px; border-radius: 9px;
      background: #eef2ff; color: var(--blue); display: grid; place-items: center;
    }
    .dw-doc-ic svg { width: 16px; height: 16px; }
    .dw-doc-body { flex: 1; min-width: 0; }
    .dw-doc-body strong { display: block; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dw-doc-body small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 2px; }
    .dw-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .dw-chips span {
      font-size: 9.5px; font-weight: 700; color: #53637d;
      background: #f7f9fd; border: 1px solid #eef2f9; border-radius: 100px; padding: 3px 8px;
      white-space: nowrap;
    }
    .dw-muted { font-size: 11.5px; color: var(--muted); line-height: 1.6; }

    .dw-doc-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
    .doc-loading, .doc-missing { font-size: 10.5px; font-weight: 700; color: var(--muted); }
    .doc-missing { color: var(--red); }
    .doc-mismatch {
      display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 100px;
      background: var(--amber-soft); color: var(--amber);
      font-size: 9.5px; font-weight: 800;
    }

    .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .status-opt {
      border: 1.5px solid var(--line); background: #fff; border-radius: 11px;
      padding: 10px 12px; font-size: 11.5px; font-weight: 800; color: #52617a;
      transition: .16s; text-align: center;
    }
    .status-opt:hover { border-color: #a9bdfc; color: var(--blue); }
    .status-opt.active { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 5px 13px #325cf42e; }
    .status-opt.cancel { grid-column: 1 / -1; }
    .status-opt.cancel:hover { border-color: #f5c9c9; color: var(--red); background: var(--red-soft); }
    .status-opt.cancel.active { background: var(--red); border-color: var(--red); color: #fff; box-shadow: none; }
    .status-opt.gated {
      opacity: .62;
      border-style: dashed;
    }
    .status-opt.gated:hover {
      color: var(--amber);
      border-color: #f1dcb0;
      background: var(--amber-soft);
    }

    .dw-delete {
      width: 100%; margin-top: 6px; padding: 11px;
      background: transparent; border: 0; border-radius: 10px;
      color: #94a0b2; font-size: 11.5px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 6px; transition: .18s;
    }
    .dw-delete:hover { color: var(--red); background: var(--red-soft); }
    .dw-delete svg { width: 13px; height: 13px; }

    /* ---------- confirm ---------- */
    .confirm-overlay {
      position: fixed; inset: 0; z-index: 70; display: none;
      align-items: center; justify-content: center; padding: 20px;
      background: #101b34a8; backdrop-filter: blur(5px);
    }
    .confirm-overlay.open { display: flex; animation: fadeIn .18s ease-out; }
    .confirm-card {
      background: #fff; border-radius: 22px; padding: 25px 22px 21px;
      width: 100%; max-width: 380px; text-align: center;
      box-shadow: 0 25px 60px #101c3550;
      animation: pop .28s cubic-bezier(.2, .8, .3, 1.1);
    }
    .confirm-icon {
      width: 54px; height: 54px; border-radius: 50%;
      background: #eef2ff; color: var(--blue);
      display: grid; place-items: center; margin: 0 auto 15px;
    }
    .confirm-icon.danger { background: var(--red-soft); color: var(--red); }
    .confirm-icon.warn   { background: var(--amber-soft); color: var(--amber); }
    .confirm-icon svg { width: 25px; height: 25px; }
    .confirm-card h3 { font-size: 17px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 7px; }
    .confirm-card p { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
    .confirm-actions { display: flex; gap: 9px; }
    .confirm-actions .btn { flex: 1; }

    /* ---------- toast ---------- */
    .toast {
      position: fixed; z-index: 90; top: 16px; left: 50%;
      transform: translateX(-50%) translateY(-90px);
      background: #172440; color: #fff; border-radius: 11px;
      padding: 11px 16px; font-size: 12px; font-weight: 700;
      box-shadow: 0 10px 30px #101c3540;
      transition: transform .28s cubic-bezier(.2, .8, .3, 1);
      max-width: 90vw; text-align: center; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { transform: translateX(48px); opacity: .5; } to { transform: none; opacity: 1; } }
    @keyframes pop { from { transform: scale(.93) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ---------- tablet / desktop ---------- */
    @media (min-width: 560px) {
      .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (min-width: 900px) {
      .side {
        display: flex; flex-direction: column; flex: none;
        width: 244px; padding: 26px 16px; background: #fff;
        border-right: 1px solid var(--line);
        position: sticky; top: 0; height: 100vh;
      }
      .side .brand { margin: 2px 8px 34px; }
      .side-nav { display: grid; gap: 5px; }
      .side-nav button {
        border: 0; background: transparent; color: #718097;
        display: flex; align-items: center; gap: 12px;
        padding: 11px 12px; border-radius: 11px;
        font-size: 12.5px; font-weight: 800; text-align: left;
        transition: background .16s, color .16s;
      }
      .side-nav button svg { width: 17px; height: 17px; }
      .side-nav button:hover { background: #f5f8ff; color: var(--ink); }
      .side-nav button.active { background: #edf2ff; color: var(--blue); }
      .side-foot { margin-top: auto; padding: 0 6px; }
      .side-foot .sync-pill { margin-bottom: 8px; }
      .side-foot > small { display: block; font-size: 10.5px; line-height: 1.6; color: #94a0b2; font-weight: 600; }

      .topbar { display: none; }
      .bottom { display: none; }
      .content { padding: 34px 38px 80px; }
      .page-head h1 { font-size: 30px; }
      .drawer { border-radius: 0; }
    }

    @media (min-width: 1180px) {
      .content { padding: 38px 46px 90px; }
    }

    /* ---------- settings card heads ---------- */
    .card-head { display: flex; align-items: flex-start; gap: 11px; }
    .card-head h3 { margin: 0; }
    .ch-ic {
      width: 32px; height: 32px; border-radius: 10px; flex: none;
      display: grid; place-items: center;
    }
    .ch-ic svg { width: 16px; height: 16px; }
    .ch-blue   { background: #eef2ff; color: var(--blue); }
    .ch-violet { background: #f1ecff; color: #7c5cff; }
    .ch-green  { background: var(--green-soft); color: var(--green); }
    .ch-amber  { background: var(--amber-soft); color: var(--amber); }
    .ch-red    { background: var(--red-soft); color: var(--red); }

    /* ---------- pricing editor ---------- */
    .price-editor { display: grid; gap: 14px; }
    .pe-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .pe-field { display: grid; gap: 5px; min-width: 0; }
    .pe-field label {
      font-size: 10px; font-weight: 800; letter-spacing: .8px;
      text-transform: uppercase; color: #94a0b2;
    }
    .pe-input-wrap { position: relative; display: flex; align-items: center; }
    .pe-prefix { position: absolute; left: 11px; font-size: 12px; font-weight: 800; color: #68758a; pointer-events: none; }
    .pe-suffix { position: absolute; right: 11px; font-size: 11px; font-weight: 800; color: #94a0b2; pointer-events: none; }
    .pe-input {
      width: 100%; border: 1.5px solid #dce4f0; border-radius: 10px;
      padding: 10px 12px; font-size: 13px; font-weight: 700;
      background: #fff; color: var(--ink); font-family: inherit;
      font-variant-numeric: tabular-nums;
      transition: border-color .15s, box-shadow .15s;
    }
    .pe-input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px #325cf420; }
    .pe-input.has-prefix { padding-left: 26px; }
    .pe-input.has-suffix { padding-right: 30px; }
    .pe-input::-webkit-outer-spin-button,
    .pe-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .pe-input[type=number] { -moz-appearance: textfield; }
    .pe-paper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .pe-preview {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 14px; border-radius: 12px;
      background: #f5f8ff; border: 1px dashed #cfdaff;
      font-size: 11.5px; color: #52617a; font-weight: 600;
    }
    .pe-preview strong {
      font-size: 16px; color: var(--blue);
      font-variant-numeric: tabular-nums; letter-spacing: -.3px;
    }
    .pe-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .pe-footnote { font-size: 10.5px; color: var(--muted); font-weight: 600; }
    .pe-footnote strong { color: var(--ink); font-weight: 800; }
    .pe-saved {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 800; color: var(--green);
      background: var(--green-soft); border-radius: 100px; padding: 4px 9px;
      white-space: nowrap;
    }
    .pe-saved svg { width: 11px; height: 11px; }
    @media (max-width: 560px) {
      .pe-paper { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- ================= sidebar (desktop) ================= -->
    <aside class="side">
      <div class="brand">
        <span class="mark" data-icon="printer"></span>
        <div>
          <strong>Smart Xerox</strong>
          <small>Admin console</small>
        </div>
      </div>

      <nav class="side-nav" aria-label="Admin navigation">
        <button data-nav="dashboard" class="active" data-icon-label="grid">Dashboard</button>
        <button data-nav="orders" data-icon-label="list">Orders</button>
        <button data-nav="settings" data-icon-label="sliders">Settings</button>
      </nav>

      <div class="side-foot">
        <div class="sync-pill"><span class="dot"></span><span class="txt">Connecting…</span></div>
        <small>Status changes appear instantly in the customer app.</small>
      </div>
    </aside>

    <!-- ================= main ================= -->
    <div class="main-area">
      <header class="topbar">
        <div class="brand">
          <span class="mark" data-icon="printer"></span>
          <div>
            <strong>Smart Xerox</strong>
            <small>Admin</small>
          </div>
        </div>
        <div class="sync-pill"><span class="dot"></span><span class="txt">Connecting…</span></div>
      </header>

      <main id="view" class="content" aria-live="polite"></main>
    </div>
  </div>

  <!-- ================= bottom nav (mobile) ================= -->
  <nav class="bottom" aria-label="Admin navigation">
    <button class="nav-btn active" data-nav="dashboard" data-icon-label="grid">Dashboard</button>
    <button class="nav-btn" data-nav="orders" data-icon-label="list">Orders</button>
    <button class="nav-btn" data-nav="settings" data-icon-label="sliders">Settings</button>
  </nav>

  <!-- ================= order drawer ================= -->
  <div id="drawer-overlay" class="drawer-overlay">
    <aside class="drawer" role="dialog" aria-modal="true" aria-label="Order details">
      <div id="drawer-body" class="drawer-body"></div>
    </aside>
  </div>

  <!-- ================= confirm dialog ================= -->
  <div id="confirm-overlay" class="confirm-overlay">
    <div id="confirm-card" class="confirm-card" role="dialog" aria-modal="true"></div>
  </div>

  <!-- ================= scroll to top ================= -->
  <button id="scroll-top" class="scroll-top" data-act="scroll-top" aria-label="Scroll to top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
  </button>

  <!-- ================= toast ================= -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    /* ============================================================
     *  Smart Xerox · Admin console
     *  - reads / writes the same IndexedDB as the customer app
     *  - auto-detects new orders (polling + BroadcastChannel)
     *  - resolves document Blobs from the "documents" store
     * ============================================================ */
    'use strict';

    /* ------------------------------------------------------------
     * 0. Tiny helpers
     * ---------------------------------------------------------- */
    const $  = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    const money = (n) => '₹' + Number(n || 0).toFixed(2);

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    const toDate = (v) => {
      const d = new Date(v);
      return isNaN(d.getTime()) ? null : d;
    };

    const fmt = (v) => {
      const d = toDate(v);
      return d ? d.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
    };

    const fmtTime = (v) => {
      const d = toDate(v);
      return d ? d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '—';
    };

    const fmtBytes = (n) => {
      const v = Number(n);
      if (!v || v < 0) return '—';
      if (v < 1024) return v + ' B';
      if (v < 1048576) return (v / 1024).toFixed(1) + ' KB';
      return (v / 1048576).toFixed(1) + ' MB';
    };

    const isSameDay = (a, b) =>
      a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();

    const stamp = () => {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
    };

    const pickText = (...values) => {
      for (const v of values) {
        if (v !== undefined && v !== null && String(v).trim() !== '') return String(v);
      }
      return '—';
    };

    /* ------------------------------------------------------------
     * 1. Icons (inline — no network dependency, always renders)
     * ---------------------------------------------------------- */
    const ICONS = {
      grid: '<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/>',
      list: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.1"/><circle cx="3.5" cy="12" r="1.1"/><circle cx="3.5" cy="18" r="1.1"/>',
      sliders: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h9M17 18h3"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="18" r="2"/>',
      printer: '<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="7" rx="2"/><path d="M6 14h12v7H6z"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      check: '<path d="M20 6 9 17l-5-5"/>',
      checkCircle: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>',
      x: '<path d="M18 6 6 18M6 6l12 12"/>',
      chevron: '<path d="m9 6 6 6-6 6"/>',
      arrowLeft: '<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
      trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/>',
      download: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/>',
      upload: '<path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M4 3h16"/>',
      alert: '<path d="M12 3 2 20h20L12 3z"/><path d="M12 9v5"/><circle cx="12" cy="17" r=".7"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
      file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
      banknote: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
      box: '<path d="m21 8-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
      eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
      database: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
      bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'
    };

    function icon(name, size = 18) {
      const paths = ICONS[name] || ICONS.file;
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
    }

    /** Fill every element that declares data-icon / data-icon-label. */
    function hydrateIcons(root = document) {
      $$('[data-icon]', root).forEach((el) => {
        if (el.dataset.iconDone === '1') return;
        el.innerHTML = icon(el.dataset.icon, 18);
        el.dataset.iconDone = '1';
      });
      $$('[data-icon-label]', root).forEach((el) => {
        if (el.dataset.iconDone === '1') return;
        el.insertAdjacentHTML('afterbegin', icon(el.dataset.iconLabel, 18));
        el.dataset.iconDone = '1';
      });
    }

    /* ------------------------------------------------------------
     * 2. Domain constants
     * ---------------------------------------------------------- */
    const DB_NAME = 'SmartXeroxDB';
    const CHANNEL = 'SmartXeroxOrders';
    const SEEN_KEY = 'smartxerox.admin.seen.v1';
    const PRICING_KEY = 'smartxerox.pricing.v1';

    /* Defaults — used until the admin saves custom rates.
       The customer app reads the exact same localStorage key. */
    const DEFAULT_PRICING = {
      bwRate: 2.00,
      colourRate: 8.00,
      minCharge: 0,
      paper: { A4: 1.00, A3: 2.00, A5: 0.80, Letter: 1.10, Legal: 1.35 },
      duplex: 2,
      updatedAt: null
    };

    const FLOW = ['Pending', 'Printing', 'Ready', 'Completed'];

    const STATUS_META = {
      Pending:   { cls: 'pending',   label: 'Pending' },
      Printing:  { cls: 'printing',  label: 'Printing' },
      Ready:     { cls: 'ready',     label: 'Ready for pickup' },
      Completed: { cls: 'completed', label: 'Completed' },
      Cancelled: { cls: 'cancelled', label: 'Cancelled' }
    };

    const ADVANCE_LABEL = {
      Pending: 'Start printing',
      Printing: 'Mark ready',
      Ready: 'Mark collected'
    };

    const CFG_LABEL = {
      colour: 'Colour', color: 'Colour', paper: 'Paper', copies: 'Copies',
      sides: 'Sides', perSheet: 'Pages per sheet', orientation: 'Orientation',
      pagesMode: 'Pages', range: 'Range', quality: 'Quality', scale: 'Scale',
      mode: 'Mode', duplex: 'Duplex', binding: 'Binding'
    };

    const POLL_MS = 5000;

    /* ------------------------------------------------------------
     * 3. State
     * ---------------------------------------------------------- */
    const state = {
      view: 'dashboard',
      orders: [],
      loaded: false,
      sig: '',
      dbError: false,
      detailId: null,
      filter: 'all',
      search: '',
      docCount: null,
      busy: false,

      /* new-order tracking */
      seen: new Set(),
      seenInit: false,
      newIds: new Set(),

      /* drawer document hydration */
      drawerToken: 0,
      drawerBlobs: {},
      blobCache: new Map()
    };

    let pendingConfirm = null;
    let pollTimer = null;
    let bc = null;

    /* ------------------------------------------------------------
     * 4. Seen-orders persistence (for "needs checking")
     * ---------------------------------------------------------- */
    function loadSeen() {
      try {
        const raw = localStorage.getItem(SEEN_KEY);
        if (!raw) return null;
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return null;
        return new Set(arr);
      } catch (_) {
        return null;
      }
    }

    function saveSeen(set) {
      try {
        localStorage.setItem(SEEN_KEY, JSON.stringify(Array.from(set)));
      } catch (_) { /* private mode — ignore */ }
    }

    /* ------------------------------------------------------------
     * 5. IndexedDB layer
     * ---------------------------------------------------------- */
    let dbPromise = null;

    function getDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          if (!window.indexedDB) {
            reject(new Error('IndexedDB is not available in this browser.'));
            return;
          }
          let req;
          try {
            /* No version on purpose: reuse the customer app's database
               whether it already exists or needs to be created. */
            req = indexedDB.open(DB_NAME);
          } catch (err) {
            reject(err);
            return;
          }
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('documents')) {
              db.createObjectStore('documents', { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains('orders')) {
              db.createObjectStore('orders', { keyPath: 'id' });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error || new Error('Could not open the database.'));
          req.onblocked = () => reject(new Error('The database is blocked by another tab.'));
        }).catch((err) => {
          dbPromise = null;
          throw err;
        });
      }
      return dbPromise;
    }

    function dbRequest(storeName, mode, run) {
      return getDB().then((db) => new Promise((resolve, reject) => {
        let transaction;
        try {
          transaction = db.transaction(storeName, mode);
        } catch (err) {
          reject(err);
          return;
        }
        const store = transaction.objectStore(storeName);
        let req;
        try {
          req = run(store);
        } catch (err) {
          reject(err);
          return;
        }
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('Database request failed.'));
      }));
    }

    const getAllOrders = () => dbRequest('orders', 'readonly', (s) => s.getAll());
    const getOrder = (id) => dbRequest('orders', 'readonly', (s) => s.get(id));
    const putOrder = (order) => dbRequest('orders', 'readwrite', (s) => s.put(order));
    const deleteOrder = (id) => dbRequest('orders', 'readwrite', (s) => s.delete(id));
    const countDocuments = () => dbRequest('documents', 'readonly', (s) => s.count());
    const getDocument = (id) => dbRequest('documents', 'readonly', (s) => s.get(id));

    /* ------------------------------------------------------------
     * 6. Cross-tab broadcast (same protocol as the customer app)
     * ---------------------------------------------------------- */
    function connectChannel() {
      try {
        bc = new BroadcastChannel(CHANNEL);
        bc.onmessage = (event) => {
          const data = event.data;
          if (!data) return;
          if (data.type === 'order-status') {
            /* Another tab changed something — refresh and notify. */
            loadAll({ notify: true });
          } else if (data.type === 'pricing-updated') {
            /* Another tab saved new rates — refresh the Settings view. */
            if (state.view === 'settings') render();
          }
        };
      } catch (_) {
        bc = null; /* BroadcastChannel unsupported — polling still works */
      }
    }

    function broadcastOrder(order) {
      if (!bc) return;
      try {
        bc.postMessage({
          type: 'order-status',
          id: order.id,
          status: order.status,
          paymentStatus: order.paymentStatus
        });
      } catch (_) { /* ignore */ }
    }

    /* ------------------------------------------------------------
     * 7. Order normalisation helpers
     * ---------------------------------------------------------- */
    function normStatus(s) {
      if (!s) return 'Pending';
      const v = String(s).trim().toLowerCase();
      for (const k of FLOW.concat(['Cancelled'])) {
        if (k.toLowerCase() === v) return k;
      }
      return String(s);
    }

    function normPay(s) {
      const v = String(s || '').trim().toLowerCase();
      if (v === 'paid' || v === 'success' || v === 'succeeded') return 'Paid';
      if (!v || v === 'pending' || v === 'unpaid' || v === 'due' || v === 'not paid') return 'Pending';
      return String(s);
    }

    const statusOf = (order) => normStatus(order && order.status);

    /* The customer app saves { name, phone, email } here whenever the
       shopper completes / edits their profile. Admin runs on the same
       browser, so we can read it as a fallback when an order itself
       does not carry the customer snapshot. */
    const PROFILE_KEY = 'smartxerox.profile';

    function loadCustomerProfile() {
      try {
        const raw = localStorage.getItem(PROFILE_KEY);
        if (!raw) return null;
        const p = JSON.parse(raw);
        if (!p || typeof p !== 'object') return null;
        const name  = String(p.name  || '').trim();
        const phone = String(p.phone || '').replace(/\D/g, '').slice(-10);
        const email = String(p.email || '').trim();
        if (!name && !phone && !email) return null;
        return { name, phone, email };
      } catch (_) {
        return null;
      }
    }

        /* ------------------------------------------------------------
     * Pricing (shared with the customer app via localStorage)
     * ---------------------------------------------------------- */
    function loadPricing() {
      try {
        const raw = localStorage.getItem(PRICING_KEY);
        if (!raw) return { ...DEFAULT_PRICING, paper: { ...DEFAULT_PRICING.paper } };
        const p = JSON.parse(raw);
        if (!p || typeof p !== 'object') return { ...DEFAULT_PRICING, paper: { ...DEFAULT_PRICING.paper } };
        return {
          bwRate: Number.isFinite(Number(p.bwRate)) ? Number(p.bwRate) : DEFAULT_PRICING.bwRate,
          colourRate: Number.isFinite(Number(p.colourRate)) ? Number(p.colourRate) : DEFAULT_PRICING.colourRate,
          minCharge: Number.isFinite(Number(p.minCharge)) ? Number(p.minCharge) : DEFAULT_PRICING.minCharge,
          paper: {
            A4: Number.isFinite(Number(p.paper && p.paper.A4)) ? Number(p.paper.A4) : DEFAULT_PRICING.paper.A4,
            A3: Number.isFinite(Number(p.paper && p.paper.A3)) ? Number(p.paper.A3) : DEFAULT_PRICING.paper.A3,
            A5: Number.isFinite(Number(p.paper && p.paper.A5)) ? Number(p.paper.A5) : DEFAULT_PRICING.paper.A5,
            Letter: Number.isFinite(Number(p.paper && p.paper.Letter)) ? Number(p.paper.Letter) : DEFAULT_PRICING.paper.Letter,
            Legal: Number.isFinite(Number(p.paper && p.paper.Legal)) ? Number(p.paper.Legal) : DEFAULT_PRICING.paper.Legal
          },
          duplex: Number.isFinite(Number(p.duplex)) ? Number(p.duplex) : DEFAULT_PRICING.duplex,
          updatedAt: p.updatedAt || null
        };
      } catch (_) {
        return { ...DEFAULT_PRICING, paper: { ...DEFAULT_PRICING.paper } };
      }
    }

    function savePricing(pricing) {
      const payload = {
        bwRate: Number(pricing.bwRate) || 0,
        colourRate: Number(pricing.colourRate) || 0,
        minCharge: Number(pricing.minCharge) || 0,
        paper: {
          A4: Number(pricing.paper.A4) || 0,
          A3: Number(pricing.paper.A3) || 0,
          A5: Number(pricing.paper.A5) || 0,
          Letter: Number(pricing.paper.Letter) || 0,
          Legal: Number(pricing.paper.Legal) || 0
        },
        duplex: Number(pricing.duplex) || 2,
        updatedAt: new Date().toISOString()
      };
      localStorage.setItem(PRICING_KEY, JSON.stringify(payload));
      if (bc) {
        try { bc.postMessage({ type: 'pricing-updated', pricing: payload }); } catch (_) {}
      }
      return payload;
    }

    function customerOf(order) {
      const c = (order && (order.customer || order.customerDetails || order.user)) || {};
      const profile = loadCustomerProfile() || {};

      /* Prefer whatever the order itself carries (historically accurate),
         then fall back to the profile that lives on this device. */
      const name = pickText(
        c.name, c.fullName, c.customerName,
        order && order.customerName, order && order.name, order && order.userName,
        profile.name
      );
      const phone = pickText(
        c.phone, c.mobile, c.contact, c.phoneNumber,
        order && order.phone, order && order.mobile,
        order && order.contact, order && order.customerPhone,
        profile.phone
      );
      const email = pickText(
        c.email, c.mail,
        order && order.email, order && order.customerEmail,
        profile.email
      );

      return { name, phone, email };
    }

    function paymentMethodOf(order) {
      return pickText(
        order && order.paymentMethod,
        order && order.payment && order.payment.method,
        order && order.paymentMode,
        order && order.method,
        'Payment'
      );
    }

    function paymentStatusOf(order) {
      return normPay(
        (order && order.paymentStatus) ||
        (order && order.payment && order.payment.status) ||
        ''
      );
    }

    /* UPI / card / any transaction reference. The customer app may store
       it directly on the order or inside order.payment depending on the
       payment method and app version. */
    function transactionIdOf(order) {
      if (!order || typeof order !== 'object') return '';
      const p = order.payment && typeof order.payment === 'object' ? order.payment : {};
      const candidates = [
        order.transactionId, order.txnId, order.upiTransactionId,
        order.transactionRef, order.txnRef, order.upiRef,
        order.referenceId, order.reference, order.utr,
        p.transactionId, p.txnId, p.upiTransactionId,
        p.transactionRef, p.txnRef, p.upiRef,
        p.referenceId, p.reference, p.utr
      ];
      for (const v of candidates) {
        if (v !== undefined && v !== null && String(v).trim() !== '') {
          return String(v).trim();
        }
      }
      return '';
    }

    function amountOf(order) {
      if (!order || typeof order !== 'object') return 0;
      const raw =
        order.amount ??
        order.total ??
        order.totalAmount ??
        order.price ??
        (order.payment && order.payment.amount);
      const n = Number(raw);
      return Number.isFinite(n) ? n : 0;
    }

    function orderDocs(order) {
      if (!order) return [];
      const raw = order.docs ?? order.documents ?? order.files ?? order.items;
      if (Array.isArray(raw)) return raw;
      if (Array.isArray(order.docIds)) return order.docIds.map((id) => ({ docId: id }));
      return [];
    }

    function orderPages(order) {
      const docs = orderDocs(order);
      const sum = docs.reduce((n, d) => n + (Number(d && d.pages) || 0), 0);
      if (sum) return sum;
      return Number((order && (order.pages ?? order.totalPages)) || 0);
    }

    const queueLabel = (order) =>
      order && order.queue !== undefined && order.queue !== null && order.queue !== ''
        ? '#' + order.queue
        : '—';

    const isFinished = (order) =>
      order && (statusOf(order) === 'Completed' || statusOf(order) === 'Cancelled');

    function statusBadge(status) {
      const key = normStatus(status);
      const meta = STATUS_META[key] || { cls: 'pending', label: status || 'Unknown' };
      return `<span class="sbadge ${meta.cls}"><span class="dot"></span>${esc(meta.label)}</span>`;
    }

    function nextStatus(status) {
      const i = FLOW.indexOf(normStatus(status));
      return i >= 0 && i < FLOW.length - 1 ? FLOW[i + 1] : null;
    }

    function payDisplay(order) {
      const method = paymentMethodOf(order);
      const ps = paymentStatusOf(order);
      const word = ps === 'Paid' ? 'Paid' : ps === 'Pending' ? 'Unpaid' : ps;
      return `${method} · ${word}`;
    }

    function paidLabel(order) {
      const method = paymentMethodOf(order);
      const ps = paymentStatusOf(order);
      const word = ps === 'Paid' ? 'paid' : ps === 'Pending' ? 'unpaid' : ps.toLowerCase();
      return `${method} · ${word}`;
    }

    function findOrder(id) {
      return state.orders.find((o) => o.id === id) || null;
    }

    /* ------------------------------------------------------------
     * 8. Loading + new-order detection
     * ---------------------------------------------------------- */
    async function loadAll({ notify = false } = {}) {
      let orders;
      try {
        orders = await getAllOrders();
        state.dbError = false;
      } catch (err) {
        console.warn('[admin] could not read orders:', err);
        state.dbError = true;
        render();
        return;
      }

      orders.sort((a, b) => {
        const da = toDate(a.created);
        const db = toDate(b.created);
        return (db ? db.getTime() : 0) - (da ? da.getTime() : 0);
      });

      /* --- new-order detection --- */
      /* A finished order (Completed / Cancelled) is never "new" — the
         admin has already acted on it, whether they opened the drawer
         or just advanced it from the dashboard queue. */
      const fresh = orders.filter((o) => !state.seen.has(o.id) && !isFinished(o));

      if (!state.seenInit) {
        /* First ever load: treat everything as already seen, so the
           admin is not flooded with old orders. */
        orders.forEach((o) => state.seen.add(o.id));
        state.seenInit = true;
        saveSeen(state.seen);
        state.newIds.clear();
      } else if (fresh.length) {
        /* Only toast for orders we haven't already announced. Without
           this, every 5 s poll re-toasts the same unopened order. */
        const brandNew = fresh.filter((o) => !state.newIds.has(o.id));
        fresh.forEach((o) => state.newIds.add(o.id));
        if (notify && brandNew.length) {
          const names = brandNew
            .slice(0, 3)
            .map((o) => customerOf(o).name)
            .filter((n) => n !== '—');
          const label = brandNew.length === 1 ? 'New order' : brandNew.length + ' new orders';
          toast(label + ' received' + (names.length ? ' — ' + names.join(', ') : ''));
        }
      }

      /* prune newIds that no longer exist, or that are already finished */
      const liveIds = new Set(orders.map((o) => o.id));
      for (const id of Array.from(state.newIds)) {
        const order = orders.find((o) => o.id === id);
        if (!liveIds.has(id) || !order || isFinished(order)) {
          state.newIds.delete(id);
        }
      }

      const sig = orders
        .map((o) => [o.id, o.status, o.paymentStatus, amountOf(o), o.created].join(':'))
        .join('|');

      if (state.loaded && sig === state.sig) return;

      state.orders = orders;
      state.sig = sig;
      state.loaded = true;
      render();
    }

    async function loadDocumentCount() {
      try {
        state.docCount = await countDocuments();
      } catch (_) {
        state.docCount = null;
      }
    }

    /* ------------------------------------------------------------
     * 9. Toast
     * ---------------------------------------------------------- */
    let toastTimer = null;
    function toast(message) {
      const el = $('#toast');
      if (!el) return;
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
    }

    /* ------------------------------------------------------------
     * 10. Render
     * ---------------------------------------------------------- */
    function render() {
      /* Keep focus/caret if the orders search box is being typed in. */
      const active = document.activeElement;
      const restoreSearch = active && active.id === 'order-search';
      const caret = restoreSearch ? active.selectionStart : null;

      /* Navigation highlighting (the "All orders" page keeps Orders lit) */
      const navKey = state.view === 'all-orders' ? 'orders' : state.view;
      $$('[data-nav]').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.nav === navKey);
      });

      /* Sync pill */
      $$('.sync-pill').forEach((pill) => {
        pill.classList.toggle('ok', !state.dbError);
        pill.classList.toggle('err', state.dbError);
        const txt = pill.querySelector('.txt');
        if (txt) txt.textContent = state.dbError ? 'Storage error' : 'Live sync';
      });

      /* Unread counter in the browser tab */
      document.title = state.newIds.size
        ? '(' + state.newIds.size + ') Smart Xerox · Admin'
        : 'Smart Xerox · Admin';

      const view = $('#view');
      switch (state.view) {
        case 'orders':     view.innerHTML = ordersView(); break;
        case 'all-orders': view.innerHTML = ordersView('all'); break;
        case 'settings':   view.innerHTML = settingsView(); break;
        default:           view.innerHTML = dashboardView();
      }

      renderDrawer();
      hydrateIcons(view);
      if (state.view === 'settings') bindPricingEditor();

      if (restoreSearch) {
        const input = $('#order-search');
        if (input) {
          input.focus();
          try { input.setSelectionRange(caret, caret); } catch (_) { /* ignore */ }
        }
      }
    }

    /* ------------------------------------------------------------
     * 11. Views
     * ---------------------------------------------------------- */
    function errorBanner() {
      if (!state.dbError) return '';
      return `
        <div class="alert">
          ${icon('alert', 17)}
          <div>
            <strong>Local storage could not be read</strong>
            Open the Smart Xerox customer app once in this browser so the local
            database is created, then tap Refresh. Private windows may block storage.
          </div>
        </div>`;
    }

    function newOrdersBanner() {
      if (!state.newIds.size) return '';
      const list = state.orders.filter((o) => state.newIds.has(o.id)).slice(0, 3);
      const names = list.map((o) => customerOf(o).name).filter((n) => n !== '—');
      const latest = list[0];
      return `
        <div class="new-banner">
          <div class="nb-left">
            <span class="stat-ic amber">${icon('bell', 15)}</span>
            <div>
              <strong>${state.newIds.size} new order${state.newIds.size === 1 ? '' : 's'} need checking</strong>
              <small>
                ${names.length ? esc(names.join(', ')) : 'Open the orders list'}
                ${latest ? ' · latest at ' + esc(fmtTime(latest.created)) : ''}
              </small>
            </div>
          </div>
          <div class="nb-actions">
            <button class="mini solid" data-act="goto-new">Review new</button>
            <button class="mini" data-act="mark-all-seen">Mark all reviewed</button>
          </div>
        </div>`;
    }

    /* ---------------- Dashboard ---------------- */
    function dashboardView() {
      const now = new Date();
      const todays = state.orders.filter((o) => {
        const d = toDate(o.created);
        return d && isSameDay(d, now);
      });
      const active = state.orders
        .filter((o) => !isFinished(o))
        .slice()
        .sort((a, b) => {
          const da = toDate(a.created);
          const db = toDate(b.created);
          return (da ? da.getTime() : 0) - (db ? db.getTime() : 0);
        });

      const printing = active.filter((o) => statusOf(o) === 'Printing').length;
      const pending = active.filter((o) => statusOf(o) === 'Pending').length;

      /* "Ordered" = value of every non-cancelled order placed today.
         "Collected" = only the ones actually marked Paid. These are
         different numbers and showing only one of them is misleading. */
      const orderedToday = todays
        .filter((o) => statusOf(o) !== 'Cancelled')
        .reduce((sum, o) => sum + amountOf(o), 0);

      const collectedToday = todays
        .filter((o) => statusOf(o) !== 'Cancelled' && paymentStatusOf(o) === 'Paid')
        .reduce((sum, o) => sum + amountOf(o), 0);

      const unpaidToday = orderedToday - collectedToday;

      const completedToday = todays.filter((o) => statusOf(o) === 'Completed').length;
      const unpaidActive = active.filter((o) => paymentStatusOf(o) !== 'Paid').length;

      const queueRows = active.length
        ? active.map(queueRow).join('')
        : `<div class="empty">
             ${icon('checkCircle', 30)}
             <strong>No active orders</strong>
             <p>You're all caught up. New orders will appear here automatically.</p>
           </div>`;

      const recentLimit = 4;
      const recent = state.orders.slice(0, recentLimit);
      const hasMoreOrders = state.orders.length > recentLimit;
      const recentRows = recent.length
        ? recent.map(orderCard).join('')
        : `<div class="empty">
             ${icon('box', 30)}
             <strong>No orders yet</strong>
             <p>Orders placed in the customer app show up here instantly.</p>
           </div>`;

      return `
        ${errorBanner()}
        ${newOrdersBanner()}

        <div class="page-head">
          <div>
            <div class="eyebrow">SMART XEROX · ADMIN</div>
            <h1>Dashboard</h1>
            <p>Live overview of your print queue, payments and today's activity.</p>
          </div>
          <div class="page-actions">
            <button class="btn ghost" data-act="refresh">
              ${icon('refresh', 15)} Refresh
            </button>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-top">
              <span class="stat-ic">${icon('box', 15)}</span>
              <span class="stat-label">Orders today</span>
            </div>
            <div class="stat-value">${todays.length}</div>
            <div class="stat-sub">${state.orders.length} all time</div>
          </div>

          <div class="stat">
            <div class="stat-top">
              <span class="stat-ic amber">${icon('clock', 15)}</span>
              <span class="stat-label">In queue</span>
            </div>
            <div class="stat-value">${active.length}</div>
            <div class="stat-sub">${pending} waiting · ${printing} printing</div>
          </div>

          <div class="stat">
            <div class="stat-top">
              <span class="stat-ic green">${icon('banknote', 15)}</span>
              <span class="stat-label">Collected today</span>
            </div>
            <div class="stat-value">${money(collectedToday)}</div>
            <div class="stat-sub">of ${money(orderedToday)} ordered${unpaidToday > 0 ? ' · ' + money(unpaidToday) + ' outstanding' : ''}</div>
          </div>

          <div class="stat">
            <div class="stat-top">
              <span class="stat-ic green">${icon('checkCircle', 15)}</span>
              <span class="stat-label">Completed today</span>
            </div>
            <div class="stat-value">${completedToday}</div>
            <div class="stat-sub">${todays.filter((o) => statusOf(o) === 'Cancelled').length} cancelled</div>
          </div>
        </div>

        <section class="section">
          <div class="section-head">
            <h2>Live queue</h2>
            <small>${active.length} order${active.length === 1 ? '' : 's'} in progress</small>
          </div>
          <div class="queue-list">${queueRows}</div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2>Recent orders</h2>
            <small>${hasMoreOrders
              ? `Showing ${recent.length} of ${state.orders.length}`
              : 'Latest activity'}</small>
          </div>
          <div class="queue-list">${recentRows}</div>
          ${hasMoreOrders ? `
            <div class="view-all-wrap">
              <button class="btn ghost full" data-act="view-all-orders">
                ${icon('list', 15)} View all ${state.orders.length} orders
              </button>
            </div>` : ''}
        </section>
      `;
    }

    function queueRow(order) {
      const docs = orderDocs(order);
      const pages = orderPages(order);
      const c = customerOf(order);
      const isNew = state.newIds.has(order.id);
      const next = nextStatus(order.status);
      return `
        <div class="q-row ${isNew ? 'is-new' : ''}">
          <div class="q-num">${esc(queueLabel(order))}</div>
          <div class="q-body">
            <div class="q-line1">
              <strong>${esc(c.name)}</strong>
              ${isNew ? '<span class="new-badge">NEW</span>' : ''}
              ${statusBadge(order.status)}
            </div>
            <div class="q-line2">
              <span>${docs.length} doc${docs.length === 1 ? '' : 's'} · ${pages} page${pages === 1 ? '' : 's'}</span>
              <span>${money(amountOf(order))}</span>
              <span>${esc(paidLabel(order))}</span>
              <span>${esc(fmtTime(order.created))}</span>
            </div>
          </div>
          <div class="q-actions">
            ${next
              ? (PAYMENT_GATE.has(next) && paymentStatusOf(order) !== 'Paid'
                  ? `<button class="mini" data-act="advance" data-id="${esc(order.id)}" title="Payment not collected yet">
                       ${icon('banknote', 13)} ${esc(ADVANCE_LABEL[statusOf(order)] || 'Advance')}
                     </button>`
                  : `<button class="mini solid" data-act="advance" data-id="${esc(order.id)}">${esc(ADVANCE_LABEL[statusOf(order)] || 'Advance')}</button>`)
              : ''}
            <button class="mini" data-act="detail" data-id="${esc(order.id)}">
              ${icon('eye', 13)} View
            </button>
          </div>
        </div>`;
    }

    /* ---------------- Orders ---------------- */
    function visibleOrders() {
      const query = state.search.trim().toLowerCase();
      return state.orders.filter((o) => {
        if (state.filter === 'new') {
          if (!state.newIds.has(o.id)) return false;
        } else if (state.filter !== 'all' && statusOf(o) !== state.filter) {
          return false;
        }
        if (!query) return true;
        const c = customerOf(o);
        const haystack = [
          o.queue, o.id, paymentMethodOf(o), paymentStatusOf(o),
          c.name, c.phone, c.email,
          ...orderDocs(o).map((d) => (d && (d.name || d.fileName)) || '')
        ].join(' ').toLowerCase();
        return haystack.includes(query);
      });
    }

    function ordersView(mode = 'orders') {
      const isAll = mode === 'all';

      const counts = {
        all: state.orders.length,
        Pending: 0,
        Printing: 0,
        Ready: 0,
        Completed: 0,
        Cancelled: 0
      };
      state.orders.forEach((o) => {
        const s = statusOf(o);
        if (counts[s] !== undefined) counts[s] += 1;
      });

      const filtered = visibleOrders();

      const chips = [
        ['all', 'All', counts.all],
        ['new', 'New', state.newIds.size],
        ['Pending', 'Pending', counts.Pending],
        ['Printing', 'Printing', counts.Printing],
        ['Ready', 'Ready', counts.Ready],
        ['Completed', 'Completed', counts.Completed],
        ['Cancelled', 'Cancelled', counts.Cancelled]
      ];

      const list = filtered.length
        ? filtered.map(orderCard).join('')
        : `<div class="empty">
             ${icon('search', 30)}
             <strong>No matching orders</strong>
             <p>Try a different search term or status filter.</p>
           </div>`;

      return `
        ${errorBanner()}

        <div class="page-head">
          <div>
            ${isAll ? `<button class="mini back-btn" data-act="back-to-dashboard">${icon('arrowLeft', 13)} Back to dashboard</button>` : ''}
            <div class="eyebrow" ${isAll ? 'style="margin-top:12px"' : ''}>SMART XEROX · ADMIN</div>
            <h1>${isAll ? 'All orders' : 'Orders'}</h1>
            <p>${isAll
              ? `Every order stored on this device — ${state.orders.length} total. Search, filter and update any of them.`
              : 'Search, filter and update every print order placed in the shop.'}</p>
          </div>
          <div class="page-actions">
            <button class="btn ghost" data-act="refresh">${icon('refresh', 15)} Refresh</button>
            <button class="btn ghost" data-act="import">${icon('upload', 15)} Import CSV</button>
            <button class="btn" data-act="export">${icon('download', 15)} Export CSV</button>
          </div>
        </div>

        <div class="toolbar">
          <div class="search-wrap">
            ${icon('search', 15)}
            <input id="order-search" class="search-input" type="search"
                   placeholder="Search queue number, customer, phone or file name…"
                   value="${esc(state.search)}" autocomplete="off">
          </div>
        </div>

        <div class="chips" style="margin-bottom:16px">
          ${chips.map(([key, label, n]) => `
            <button class="chip-btn ${state.filter === key ? 'active' : ''}"
                    data-act="filter" data-filter="${key}">
              ${esc(label)} <span class="n">${n}</span>
            </button>`).join('')}
        </div>

        <div class="queue-list">${list}</div>
      `;
    }

    function orderCard(order) {
      const docs = orderDocs(order);
      const pages = orderPages(order);
      const c = customerOf(order);

    function bindPricingEditor() {
      const form = $('#pricing-form');
      if (!form) return;

      const previewSingle = $('#pe-preview-single');
      const previewDouble = $('#pe-preview-double');
      const savedNote = $('#pe-saved-note');
      const updatedAt = $('#pe-updated-at');

      const readForm = () => {
        const val = (name) => {
          const el = form.querySelector(`[name="${name}"]`);
          return el ? Number(el.value) || 0 : 0;
        };
        return {
          bwRate: val('bwRate'),
          colourRate: val('colourRate'),
          minCharge: val('minCharge'),
          paper: {
            A4: val('paper-A4'),
            A3: val('paper-A3'),
            A5: val('paper-A5'),
            Letter: val('paper-Letter'),
            Legal: val('paper-Legal')
          },
          duplex: 2
        };
      };

      /* Mirrors the customer app's price():
         sheets = ceil(pages / perSheet / sided), then × rate × paper,
         with the min-charge floor applied last. */
      const calcPreview = (p, sided) => {
        const sheets = Math.max(1, Math.ceil(10 / 1 / sided));
        let total = sheets * (p.colourRate + (p.paper.A4 || 0));
        if (p.minCharge && total < p.minCharge) total = p.minCharge;
        return total;
      };

      const updatePreview = () => {
        const p = readForm();
        if (previewSingle) previewSingle.textContent = money(calcPreview(p, 1));
        if (previewDouble) previewDouble.textContent = money(calcPreview(p, 2));
      };

      Array.from(form.querySelectorAll('.pe-input'))
        .forEach((el) => el.addEventListener('input', updatePreview));
      updatePreview();

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const saved = savePricing(readForm());
        if (savedNote) {
          savedNote.style.display = 'inline-flex';
          setTimeout(() => { savedNote.style.display = 'none'; }, 2600);
        }
        if (updatedAt) updatedAt.textContent = fmt(saved.updatedAt);
        toast('Pricing saved — the customer app will use these rates.');
      });

      const resetBtn = form.querySelector('[data-act="reset-pricing"]');
      if (resetBtn) {
        resetBtn.addEventListener('click', (e) => {
          e.preventDefault();
          const d = DEFAULT_PRICING;
          const set = (name, v) => {
            const el = form.querySelector(`[name="${name}"]`);
            if (el) el.value = v;
          };
          set('bwRate', Number(d.bwRate).toFixed(2));
          set('colourRate', Number(d.colourRate).toFixed(2));
          set('minCharge', Number(d.minCharge).toFixed(2));
          set('paper-A4', Number(d.paper.A4).toFixed(2));
          set('paper-A3', Number(d.paper.A3).toFixed(2));
          set('paper-A5', Number(d.paper.A5).toFixed(2));
          set('paper-Letter', Number(d.paper.Letter).toFixed(2));
          set('paper-Legal', Number(d.paper.Legal).toFixed(2));
          updatePreview();
          toast('Defaults loaded — tap “Save pricing” to apply them.');
        });
      }
    }

    /* ------------------------------------------------------------
     * 12. Document helpers (Blob access)
     * ---------------------------------------------------------- */
    function b64ToBytes(b64) {
      const bin = atob(String(b64).replace(/\s/g, ''));
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    function extractBlob(rec) {
      if (!rec) return null;
      const cand = rec.blob ?? rec.data ?? rec.file ?? rec.content ?? rec.buffer ?? rec.bytes ?? rec.value;
      if (!cand) return null;

      const mime = rec.type || rec.mime || rec.mimeType || 'application/octet-stream';

      if (cand instanceof Blob) return cand;
      if (cand instanceof ArrayBuffer) return new Blob([cand], { type: mime });
      if (ArrayBuffer.isView(cand)) return new Blob([cand.buffer], { type: mime });

      if (typeof cand === 'string') {
        if (cand.startsWith('data:')) {
          const comma = cand.indexOf(',');
          if (comma > 0) {
            try {
              const meta = cand.slice(0, comma);
              const b64 = cand.slice(comma + 1);
              const m = /data:([^;]+)/.exec(meta);
              return new Blob([b64ToBytes(b64)], { type: (m && m[1]) || mime });
            } catch (_) {
              return null;
            }
          }
          return null;
        }
        /* raw base64 fallback */
        if (cand.length > 32 && /^[A-Za-z0-9+/=\s]+$/.test(cand)) {
          try {
            return new Blob([b64ToBytes(cand)], { type: mime });
          } catch (_) {
            return null;
          }
        }
      }
      return null;
    }

    async function findDocumentRecord(doc) {
      if (!doc || typeof doc !== 'object') return null;
      const keys = [
        doc.docId, doc.docID, doc.documentId, doc.fileId, doc.id
      ].filter((k) => k !== undefined && k !== null && k !== '');
      const tried = new Set();
      for (const k of keys) {
        if (tried.has(k)) continue;
        tried.add(k);
        try {
          const rec = await getDocument(k);
          if (rec) return rec;
        } catch (_) { /* try next key */ }
      }
      return null;
    }

    function downloadBlob(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name || 'document';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    function cfgChips(cfg) {
      const chips = [];
      if (!cfg || typeof cfg !== 'object') return chips;

      const handled = new Set();

      ['colour', 'color', 'paper', 'sides', 'orientation', 'quality', 'duplex', 'binding', 'mode']
        .forEach((k) => {
          const v = cfg[k];
          if (v !== undefined && v !== null && v !== '' && v !== false) {
            chips.push(String(v));
            handled.add(k);
          }
        });

      if (cfg.copies) {
        chips.push(`${cfg.copies} ${Number(cfg.copies) === 1 ? 'copy' : 'copies'}`);
      }
      handled.add('copies');

      if (cfg.perSheet) chips.push(`${cfg.perSheet} / sheet`);
      handled.add('perSheet');

      if (cfg.pagesMode) {
        chips.push(String(cfg.pagesMode));
        if (cfg.pagesMode === 'Custom Range' && cfg.range) chips.push('Pages ' + cfg.range);
      }
      if (cfg.range && cfg.pagesMode !== 'Custom Range') {
        chips.push('Pages: ' + cfg.range);
      }
      handled.add('pagesMode');
      handled.add('range');

      Object.keys(cfg).forEach((k) => {
        if (handled.has(k)) return;
        const v = cfg[k];
        if (v === undefined || v === null || v === '' || v === false) return;
        const label = CFG_LABEL[k] || (k.charAt(0).toUpperCase() + k.slice(1));
        chips.push(`${label}: ${v}`);
      });

      return chips;
    }
