      async function preview(index) {
        const doc = state.docs[index];
        if (!doc) return;
        state.preview = doc;
        state.previewPage = 1;
        state.zoom = 1;
        $('#preview-name').textContent = doc.name;
        $('#preview').classList.add('open');
        document.body.style.overflow = 'hidden';
        await renderPreview();
      }

      async function renderPreview() {
        const doc = state.preview;
        if (!doc) return;
        const box = $('#preview-main');
        const thumbs = $('#thumbs');
        const type = doc.type || '';

        box.innerHTML = '<span>Loading preview…</span>';
        thumbs.innerHTML = '';
        $('#page-label').textContent = `${state.previewPage} / ${doc.pages}`;
        // Restore controls hidden by a previous DOCX render
        ['#prev-page', '#next-page', '#zoom-out', '#zoom-in'].forEach((sel) => {
          const el = $(sel);
          if (el) el.style.display = '';
        });
        // DOCX renders as a tall block; grid centering clips the top of overflow.
        // Reset to grid for PDF/image, block for DOCX (set below in its branch).
        box.style.display = 'grid';

        try {
          if (type === 'application/pdf') {
            if (!window.pdfjsLib) throw new Error('pdfjsLib not loaded');
            const pdf = await pdfjsLib.getDocument({ data: await doc.blob.arrayBuffer() }).promise;
            if (state.preview !== doc) return;

            const page = await pdf.getPage(state.previewPage);
            if (state.preview !== doc) return;

            const base = page.getViewport({ scale: 1 }).width;
            const fit = Math.min(1.7, Math.max(0.7, (box.clientWidth - 40) / base));
            const zoom = Math.min(2.5, Math.max(0.5, state.zoom));
            const vp = page.getViewport({ scale: zoom * fit });

            const canvas = document.createElement('canvas');
            canvas.width = vp.width;
            canvas.height = vp.height;
            box.replaceChildren(canvas);

            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

            thumbs.innerHTML = Array.from({ length: Math.min(doc.pages, 100) }, (_, i) => `
              <button data-action="preview-page" data-page="${i + 1}" class="${i + 1 === state.previewPage ? 'active' : ''}">Page ${i + 1}</button>`).join('');
          } else if (type.startsWith('image/')) {
            const img = document.createElement('img');
            img.alt = 'Preview of ' + doc.name;
            const url = URL.createObjectURL(doc.blob);
            img.src = url;
            img.onload = () => URL.revokeObjectURL(url);
            img.onerror = () => URL.revokeObjectURL(url);
            box.replaceChildren(img);
            $('#page-label').textContent = 'Image preview';
          } else if (/\.docx$/i.test(doc.name) || type.includes('wordprocessingml')) {
            if (!window.docx || typeof window.docx.renderAsync !== 'function') {
              throw new Error('docx-preview not loaded');
            }
            if (state.preview !== doc) return;

            const holder = document.createElement('div');
            holder.style.width = '100%';
            holder.style.maxWidth = '900px';
            holder.style.margin = '0 auto';
            box.style.display = 'block';
            box.innerHTML = `
              <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 20px;color:#94a0b2">
                <div style="width:34px;height:34px;border-radius:50%;border:3px solid #2b3954;border-top-color:#325cf4;animation:spin .8s linear infinite"></div>
                <span style="font-size:12px;font-weight:700;letter-spacing:.3px">Rendering document…</span>
              </div>`;

            await window.docx.renderAsync(doc.blob, holder, null, {
              className: 'docx-render',
              inWrapper: true,
              ignoreWidth: true,
              ignoreHeight: false,
              breakPages: true,
              ignoreLastRenderedPageBreak: false
            });

            // Guard against rapid file switches — discard stale renders
            if (state.preview !== doc) return;

            // Swap the spinner out for the actual rendered content
            box.replaceChildren(holder);

            // Style each rendered page to sit nicely on the dark preview bg.
            // Match both the configured className and docx-preview's default
            // `.docx` / `section` selectors, so a version bump can't break styling.
            const pages = holder.querySelectorAll('.docx-render, .docx-wrapper > section, .docx-wrapper .docx');
            pages.forEach((el) => {
              el.style.background = '#fff';
              el.style.color = '#15213a';
              el.style.margin = '0 auto 16px';
              el.style.boxShadow = '0 10px 30px #0005';
            });
            const wrapper = holder.querySelector('.docx-wrapper');
            if (wrapper) {
              wrapper.style.background = 'transparent';
              wrapper.style.padding = '0';
              wrapper.style.display = 'flex';
              wrapper.style.flexDirection = 'column';
              wrapper.style.alignItems = 'center';
              wrapper.style.gap = '0';
            }

            const renderedPages = pages.length;
            $('#page-label').textContent =
              `${renderedPages || doc.pages} page${(renderedPages || doc.pages) === 1 ? '' : 's'} · scroll to view`;

            // docx-preview renders all pages at once — no stepper/zoom
            $('#prev-page').style.display = 'none';
            $('#next-page').style.display = 'none';
            $('#zoom-out').style.display = 'none';
            $('#zoom-in').style.display = 'none';
            thumbs.innerHTML = '';
          } else {
            box.innerHTML = `
              <div style="text-align:center;max-width:300px">
                <i data-lucide="file-text"></i>
                <h2>Preview unavailable</h2>
                <p>This document format cannot be previewed here. You can still include it in your order.</p>
              </div>`;
            $('#page-label').textContent = 'Document preview';
            icons();
          }
        } catch (err) {
          console.warn('[SmartXerox] Preview failed:', err);
          box.style.display = 'grid';
          ['#prev-page', '#next-page', '#zoom-out', '#zoom-in'].forEach((sel) => {
            const el = $(sel);
            if (el) el.style.display = 'none';
          });
          box.innerHTML = `
            <div style="text-align:center;max-width:300px">
              <i data-lucide="file-warning"></i>
              <h2>This file could not be previewed</h2>
              <p>The file may be corrupted or in a format the browser can't render. You can still include it in your order.</p>
            </div>`;
          $('#page-label').textContent = 'Preview unavailable';
          icons();
        }
      }

      function closePreview() {
        state.preview = null;
        $('#preview').classList.remove('open');
        document.body.style.overflow = '';
      }

      /* =====================================================================
       *  Reorder / receipt
       * ===================================================================== */
      async function reorder(order) {
        const docs = [];
        for (const saved of order.docs || []) {
          try {
            const stored = await getDoc(saved.id);
            if (stored && stored.blob) {
              docs.push({ ...stored, cfg: clone(saved.cfg || defaultCfg()) });
            }
          } catch (_) { /* skip */ }
        }
        state.docs = docs;
        state.current = 0;
        closeSheet();
        if (docs.length) {
          navigate('config');
          if (docs.length < (order.docs || []).length) {
            toast('Some original files are unavailable. Add replacements before ordering.');
          }
        } else {
          navigate('home');
          toast('Original files are unavailable. Upload them again to reorder.');
        }
      }

      function receipt(order) {
        const docs = order.docs || [];
        const text = [
          'SMART XEROX — ORDER RECEIPT',
          `Queue: ${order.queue}`,
          `Order ID: ${order.id}`,
          `Date: ${fmt(order.created)}`,
          `Status: ${order.status}`,
          `Payment: ${order.paymentMethod} (${order.paymentStatus})`,
          '',
          ...docs.map((d) => {
            const c = d.cfg || defaultCfg();
            return `${d.name}\n${d.selectedLabel || ''} pages · ${c.copies} copies · ${c.paper} · ${c.colour} · ${c.orientation} · ${c.perSheet}/sheet · ${c.sides}`;
          }),
          '',
          `TOTAL: ${money(order.amount)}`
        ].join('\n');

        const w = window.open('', '_blank');
        if (!w) return toast('Allow pop-ups to print your receipt.');
        w.document.write(
          '<!doctype html><title>Smart Xerox Receipt</title>' +
          '<pre style="font:14px/1.7 sans-serif;white-space:pre-wrap;max-width:600px;margin:40px auto">' +
          esc(text) + '</pre>'
        );
        w.document.close();
        w.focus();
        w.print();
      }

      /* =====================================================================
       *  Event delegation
       * ===================================================================== */
      document.addEventListener('click', async (event) => {
        const navBtn = event.target.closest('[data-nav]');
        if (navBtn) { navigate(navBtn.dataset.nav); return; }

        const choice = event.target.closest('[data-key]');
        const activeDoc = state.docs[state.current];
        if (choice && activeDoc) {
          const key = choice.dataset.key;
          const value = choice.dataset.value;
          activeDoc.cfg[key] = key === 'perSheet' ? Number(value) : value;
          render();
          return;
        }

        const btn = event.target.closest('[data-action]');
        if (!btn) return;

        const action = btn.dataset.action;
        const index = Number(btn.dataset.i);

        switch (action) {
          case 'browse': $('#files').click(); break;

          case 'setup': state.current = 0; navigate('config'); break;

          case 'home':
          case 'orders':
          case 'history': navigate(action); break;

          case 'select-doc': state.current = index; render(); break;

          case 'remove': {
            const removed = state.docs[index];
            if (!removed) break;
            state.docs.splice(index, 1);
            state.current = Math.min(state.current, Math.max(0, state.docs.length - 1));
            render();
            const label = removed.name.length > 24
              ? removed.name.slice(0, 22) + '…'
              : removed.name;
            toast(`${label} removed`);
            break;
          }

          case 'replace': {
            const input = $('#replace-file');
            input.dataset.i = String(index);
            input.click();
            break;
          }

          case 'preview': await preview(index); break;

          case 'minus':
          case 'plus': {
            const doc = state.docs[state.current];
            if (!doc) break;
            doc.cfg.copies = Math.max(1, doc.cfg.copies + (action === 'plus' ? 1 : -1));
            render();
            break;
          }

          case 'pick': {
            const doc = state.docs[state.current];
            if (!doc) break;
            const page = Number(btn.dataset.page);
            const picked = doc.cfg.picked;
            doc.cfg.picked = picked.includes(page)
              ? picked.filter((p) => p !== page)
              : [...picked, page].sort((a, b) => a - b);
            render();
            break;
          }

          case 'pick-all': {
            const doc = state.docs[state.current];
            if (!doc) break;
            doc.cfg.picked = Array.from(
              { length: Math.min(doc.pages, 500) },
              (_, i) => i + 1
            );
            render();
            break;
          }

          case 'pick-none': {
            const doc = state.docs[state.current];
            if (!doc) break;
            doc.cfg.picked = [];
            render();
            break;
          }

          case 'detail':
            state.detail = btn.dataset.id;
            state.view = 'detail';
            render();
            window.scrollTo(0, 0);
            break;

          case 'receipt': {
            const o = state.orders.find((x) => x.id === state.detail);
            if (o) receipt(o);
            break;
          }

          case 'reorder': {
            const o = state.orders.find((x) => x.id === state.detail);
            if (o) await reorder(o);
            break;
          }

          case 'download-qr': {
            const img = document.getElementById('upi-qr');
            if (!img || !img.src) { toast('QR not ready yet'); break; }
            const btnEl = btn;
            const originalHTML = btnEl.innerHTML;
            btnEl.disabled = true;
            btnEl.innerHTML = '<i data-lucide="loader"></i> Generating…';
            icons();
            try {
              const canvas = await generateQrCard();
              await new Promise((resolve, reject) => {
                canvas.toBlob((blob) => {
                  if (!blob) { reject(new Error('toBlob failed')); return; }
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = `SmartXerox-UPI-${Date.now()}.png`;
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  setTimeout(() => URL.revokeObjectURL(url), 1000);
                  resolve();
                }, 'image/png');
              });
              toast('QR card downloaded');
            } catch (err) {
              console.warn('[SmartXerox] QR card generation failed:', err);
              window.open(img.src, '_blank');
              toast('Long-press the QR image to save it');
            } finally {
              btnEl.disabled = false;
              btnEl.innerHTML = originalHTML;
              icons();
            }
            break;
          }

          case 'close-sheet': closeSheet(); break;

          case 'clear-all':
            if (!$('#confirm-overlay').classList.contains('open')) confirmClearAll();
            break;
          case 'confirm-cancel': closeConfirm(); break;
          case 'confirm-clear': {
            state.docs = [];
            state.current = 0;
            closeConfirm();
            render();
            toast('All documents cleared');
            const browse = document.querySelector('.dropzone .btn');
            if (browse) browse.focus();
            break;
          }

          case 'delete-order': {
            event.stopPropagation();
            confirmDeleteOrder(btn.dataset.id);
            break;
          }

          case 'confirm-delete-order': {
            deleteOrder(deleteOrderId);
            break;
          }

          case 'copy-order-id': {
            try {
              await navigator.clipboard.writeText(btn.dataset.id || '');
                if (!btn.dataset.originalHtml) btn.dataset.originalHtml = btn.innerHTML;
                btn.classList.add('copied');
                btn.innerHTML = '<i data-lucide="check"></i> Copied';
                icons();
                toast('Order ID copied');
                clearTimeout(btn._copyTimer);
                btn._copyTimer = setTimeout(() => {
                  btn.classList.remove('copied');
                  btn.innerHTML = btn.dataset.originalHtml;
                  delete btn.dataset.originalHtml;
                  icons();
                }, 1600);
            } catch (_) {
              toast('Could not copy — please copy manually');
            }
            break;
          }

          case 'cash': cash(); break;

          case 'upi': upi(); break;

          case 'copy-upi': {
            try {
              await navigator.clipboard.writeText(UPI_ID);
              btn.classList.add('copied');
              btn.innerHTML = '<i data-lucide="check"></i>';
              icons();
              toast('UPI ID copied');
              setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = '<i data-lucide="copy"></i>';
                icons();
              }, 1600);
            } catch (_) {
              toast('Could not copy — please copy manually');
            }
            break;
          }

          case 'confirm-cash':
            await submit('Cash');
            break;

          case 'confirm-upi':
            await submit('UPI', $('#transaction-id') ? $('#transaction-id').value : '');
            break;

          case 'success-detail':
            state.detail = btn.dataset.id;
            state.view = 'detail';
            closeSheet();
            render();
            window.scrollTo(0, 0);
            break;

          case 'success-home':
            closeSheet();
            navigate('home');
            break;

          case 'preview-page':
            state.previewPage = Number(btn.dataset.page);
            await renderPreview();
            break;

          default: break;
        }
      });

      /* -------------------- Copies input: commit on blur / Enter ------- */
      $('#view').addEventListener('change', (e) => {
        if (e.target.id !== 'copies-input') return;
        const doc = state.docs[state.current];
        if (!doc) return;
        let n = parseInt(e.target.value, 10);
        if (!Number.isFinite(n) || n < 1) n = 1;
        doc.cfg.copies = n;
        e.target.value = String(n);   // reflect the clamped value in the field
        refreshTotals();
      });

      /* Live validation for UPI transaction ID + copy feedback */
      document.addEventListener('input', (e) => {
        if (!e.target || e.target.id !== 'transaction-id') return;
        const val = e.target.value.trim();
        // Proper UPI txn IDs are 8–30 alphanumeric characters
        const isValid = /^[A-Za-z0-9]{8,30}$/.test(val);
        const ok = document.getElementById('txn-ok');
        const submitBtn = document.getElementById('upi-submit');
        if (ok) ok.classList.toggle('show', isValid);
        if (submitBtn) submitBtn.disabled = !isValid;
      });
      $('#files').addEventListener('change', async (e) => {
        const files = [...e.target.files];
        e.target.value = '';
        if (files.length) addFiles(files);
      });

      $('#replace-file').addEventListener('change', (e) => {
        const idx = Number(e.target.dataset.i);
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        delete e.target.dataset.i;
        if (file && Number.isInteger(idx) && idx >= 0) addFiles([file], idx);
      });

      /* -------------------- Range input / history search -------------- */
      let rangeDebounce = 0;
      let copiesDebounce = 0;
      $('#view').addEventListener('input', (e) => {
        if (e.target.id === 'copies-input') {
          const doc = state.docs[state.current];
          if (!doc) return;
          const n = parseInt(e.target.value, 10);
          if (!Number.isFinite(n) || n < 1) return;  // ignore empty / 0 / junk while typing
          doc.cfg.copies = n;
          clearTimeout(copiesDebounce);
          copiesDebounce = setTimeout(refreshTotals, 100);
          return;
        }

        if (e.target.id === 'range') {
          const doc = state.docs[state.current];
          if (!doc) return;
          doc.cfg.range = e.target.value;
          clearTimeout(rangeDebounce);
          rangeDebounce = setTimeout(refreshTotals, 120);
          return;
        }

        if (e.target.id === 'history-search') {
          const term = e.target.value.trim().toLowerCase();
          const results = state.orders.filter((o) =>
            ['Completed', 'Cancelled'].includes(o.status) &&
            String(o.queue).toLowerCase().includes(term));
          const list = $('#orders-list');
          if (!list) return;
          list.innerHTML = results.length
            ? results.map((o) => orderCard(o)).join('')
            : '<div class="empty card canva-card"><strong>No matching orders</strong></div>';
          icons();
        }
      });

      /* -------------------- Drag & drop -------------------------------- */
      $('#view').addEventListener('dragover', (e) => {
        const drop = e.target.closest('#drop');
        if (!drop) return;
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        drop.classList.add('drag');
      });

      $('#view').addEventListener('dragleave', (e) => {
        const drop = e.target.closest('#drop');
        if (!drop) return;
        if (e.relatedTarget && drop.contains(e.relatedTarget)) return;
        drop.classList.remove('drag');
      });

      $('#view').addEventListener('drop', (e) => {
        const drop = e.target.closest('#drop');
        if (!drop) return;
        e.preventDefault();
        drop.classList.remove('drag');
        const files = e.dataTransfer ? [...e.dataTransfer.files] : [];
        if (files.length) addFiles(files);
      });

      /* -------------------- Keyboard on drop zone / order card --------- */
      $('#view').addEventListener('keydown', (e) => {
        if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('order')) {
          e.preventDefault();
          e.target.click();
        }
      });

      $('#view').addEventListener('click', (e) => {
        const drop = e.target.closest('#drop');
        if (!drop) return;
        if (e.target.closest('button')) return;
        $('#files').click();
      });

      /* -------------------- Action bar pay button ---------------------- */
      $('#action-bar').addEventListener('click', (e) => {
        if (e.target.closest('#pay-btn')) payment();
      });

      /* -------------------- Overlay close ------------------------------ */
      $('#overlay').addEventListener('click', (e) => {
        if (e.target.id === 'overlay') closeSheet();
      });

      $('#confirm-overlay').addEventListener('click', (e) => {
        if (e.target.id !== 'confirm-overlay') return;
        // Ignore the very first backdrop click that lands within 260ms
        // of opening — protects against fast double-clicks on "Clear all".
        if (Date.now() - (confirmOpenedAt || 0) < 260) return;
        closeConfirm();
      });
      /* -------------------- Preview controls --------------------------- */
      $('#close-preview').addEventListener('click', closePreview);

      $('#prev-page').addEventListener('click', () => {
        if (state.previewPage > 1) { state.previewPage--; renderPreview(); }
      });

      $('#next-page').addEventListener('click', () => {
        if (state.preview && state.previewPage < state.preview.pages) {
          state.previewPage++;
          renderPreview();
        }
      });

      $('#zoom-in').addEventListener('click', () => {
        state.zoom = Math.min(2.5, state.zoom + 0.25);
        renderPreview();
      });

      $('#zoom-out').addEventListener('click', () => {
        state.zoom = Math.max(0.5, state.zoom - 0.25);
        renderPreview();
      });

      /* -------------------- ESC key ------------------------------------ */
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (state.preview) closePreview();
        else if ($('#confirm-overlay').classList.contains('open')) closeConfirm();
        else if ($('#overlay').classList.contains('open')) closeSheet();
      });

      /* -------------------- Go! ---------------------------------------- */
      init();
    </script>
  </body>
</html>
