        perSheet: 1,
        orientation: 'Portrait',
        pagesMode: 'All Pages',
        range: '',
        picked: [],
        sides: 'Single-sided'
      });

      /* -------------------- IndexedDB (with graceful fallback) ---------- */
      const tx = (name, mode = 'readonly') => state.db.transaction(name, mode).objectStore(name);

      const request = (req) => new Promise((resolve, reject) => {
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });

      function openDB() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) return reject(new Error('indexedDB not supported'));
          let req;
          try {
            req = indexedDB.open('SmartXeroxDB', 1);
          } catch (err) { return reject(err); }
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('documents')) db.createObjectStore('documents', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('orders')) db.createObjectStore('orders', { keyPath: 'id' });
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
          req.onblocked = () => reject(new Error('indexedDB blocked'));
        });
      }

      async function saveDoc(doc) {
        const record = {
          id: doc.id, name: doc.name, size: doc.size,
          type: doc.type, pages: doc.pages, blob: doc.blob
        };
        if (!state.db) { state._memDocs[doc.id] = record; return; }
        await request(tx('documents', 'readwrite').put(record));
      }

      async function getDoc(id) {
        if (!state.db) return state._memDocs[id] || null;
        return request(tx('documents').get(id));
      }

      async function saveOrder(order) {
        if (!state.db) { state._memOrders[order.id] = order; return; }
        await request(tx('orders', 'readwrite').put(order));
      }

      async function loadOrders() {
        if (!state.db) {
          state.orders = Object.values(state._memOrders)
            .sort((a, b) => new Date(b.created) - new Date(a.created));
          return;
        }
        state.orders = await request(tx('orders').getAll());
        state.orders.sort((a, b) => new Date(b.created) - new Date(a.created));
      }

      /* -------------------- optional remote SDK ------------------------ */
      async function sdkInit() {
        if (!window.dataSdk || typeof window.dataSdk.init !== 'function') {
          console.info('[SmartXerox] Order sync service not detected — running in local-only mode.');
          state.ready = false;
          return;
        }
        try {
          const res = await window.dataSdk.init({ onDataChanged() {} });
          state.ready = !!(res && res.isOk);
          if (!state.ready) console.info('[SmartXerox] Order sync service unavailable — running in local-only mode.');
        } catch (err) {
          state.ready = false;
          console.info('[SmartXerox] Order sync service unavailable — running in local-only mode.');
        }
      }

            /* =====================================================================
       *  Profile — name / phone (required) + email (optional)
       * ===================================================================== */
      const PROFILE_KEY = 'smartxerox.profile';

      function loadProfile() {
        try {
          const raw = localStorage.getItem(PROFILE_KEY);
          if (!raw) return { name: '', phone: '', email: '' };
          const p = JSON.parse(raw) || {};
          return {
            name: String(p.name || ''),
            phone: String(p.phone || ''),
            email: String(p.email || '')
          };
        } catch (_) {
          return { name: '', phone: '', email: '' };
        }
      }

      function persistProfile() {
        try { localStorage.setItem(PROFILE_KEY, JSON.stringify(state.profile)); } catch (_) {}
      }

      function normalisePhone(v) {
        let d = String(v || '').replace(/\D/g, '');
        if (d.length > 10 && d.startsWith('91')) d = d.slice(-10);
        if (d.length > 10 && d.startsWith('0')) d = d.slice(-10);
        return d;
      }

      const validName  = (v) => String(v || '').trim().length >= 2;
      const validPhone = (v) => /^\d{10}$/.test(normalisePhone(v));
      const validEmail = (v) => !String(v || '').trim()
        || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim());

      function profileComplete() {
        const p = state.profile || {};
        return validName(p.name) && validPhone(p.phone);
      }

      function profileInitials() {
        const parts = String((state.profile && state.profile.name) || '')
          .trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return 'SX';
        return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
      }

      /* ---------- validation helpers ---------- */
      function setFieldError(scope, key, msg) {
        const box = scope.querySelector('[data-err="' + key + '"]');
        const input = scope.querySelector('[data-pf="' + key + '"], [data-pmf="' + key + '"]');
        if (box) {
          if (msg) {
            box.innerHTML = '<i data-lucide="alert-circle"></i>' + esc(msg);
            box.hidden = false;
          } else {
            box.innerHTML = '';
            box.hidden = true;
          }
        }
        if (input) input.classList.toggle('invalid', !!msg);
      }

      function validateProfileFields(scope, get) {
        let ok = true;
        if (!validName(get('name'))) { setFieldError(scope, 'name', 'Please enter your full name.'); ok = false; }
        else setFieldError(scope, 'name', '');
        if (!validPhone(get('phone'))) { setFieldError(scope, 'phone', 'Enter a valid 10-digit mobile number.'); ok = false; }
        else setFieldError(scope, 'phone', '');
        if (!validEmail(get('email'))) { setFieldError(scope, 'email', 'That email address does not look right.'); ok = false; }
        else setFieldError(scope, 'email', '');
        return ok;
      }

      /* ---------- Profile tab view ---------- */
      function profileView() {
        const p = state.profile || { name: '', phone: '', email: '' };
        const done = profileComplete();
        return `
          <section class="home-head">
            <div class="home-greet">
              <div class="eyebrow">YOUR ACCOUNT</div>
              <h1>Profile</h1>
              <p>Your name and phone number appear on every print order. They stay in this browser — nothing is uploaded.</p>
            </div>
            <div class="home-pill"><span class="dot" style="${done ? '' : 'background:#efa823;box-shadow:0 0 0 3px #efa82330'}"></span>${done ? 'Profile complete' : 'Details needed'}</div>
          </section>

          <div class="card profile-card-lg">
            <div class="profile-id">
              <div class="profile-avatar">${esc(profileInitials())}</div>
              <div class="profile-id-tx">
                <strong>${esc(p.name.trim() || 'Your name')}</strong>
                <small>${p.phone ? '+91 ' + esc(normalisePhone(p.phone)) : 'Phone number not added'}${p.email ? ' · ' + esc(p.email) : ''}</small>
              </div>
            </div>

            <div class="pf-grid">
              <div class="pf-row">
                <label class="pf-label" for="pf-name">Full name <span class="pf-req">*</span></label>
                <input id="pf-name" class="field" data-pf="name" type="text" autocomplete="name"
                       placeholder="e.g. Aarav Sharma" maxlength="60" value="${esc(p.name)}">
                <p class="pf-err" data-err="name" hidden></p>
              </div>
              <div class="pf-row">
                <label class="pf-label" for="pf-phone">Phone number <span class="pf-req">*</span></label>
                <input id="pf-phone" class="field" data-pf="phone" type="tel" inputmode="numeric"
                       autocomplete="tel" placeholder="10-digit mobile number" maxlength="14" value="${esc(p.phone)}">
                <p class="pf-err" data-err="phone" hidden></p>
              </div>
              <div class="pf-row wide">
                <label class="pf-label" for="pf-email">Email <span class="pf-opt">OPTIONAL</span></label>
                <input id="pf-email" class="field" data-pf="email" type="email" autocomplete="email"
                       placeholder="you@example.com" maxlength="80" value="${esc(p.email)}">
                <p class="pf-err" data-err="email" hidden></p>
              </div>
            </div>

            <button class="btn full" data-action="save-profile" style="margin-top:18px">
              <i data-lucide="check"></i> Save details
            </button>
            <p class="hint" style="text-align:center">Name and phone number are required before you can pay.</p>
          </div>`;
      }

      function saveProfileFromPage() {
        const scope = document.querySelector('.profile-card-lg');
        if (!scope) return;
        const get = (k) => {
          const el = scope.querySelector('[data-pf="' + k + '"]');
          return el ? el.value : '';
        };
        if (!validateProfileFields(scope, get)) { icons(); return; }
        state.profile = {
          name: get('name').trim(),
          phone: normalisePhone(get('phone')),
          email: get('email').trim()
        };
        persistProfile();
        toast('Profile saved');
        render();
      }

      /* ---------- "Details needed" gate modal ---------- */
      function renderProfileGate() {
        const p = state.profile || { name: '', phone: '', email: '' };
        const card = $('#profile-gate-card');
        if (!card) return;
        card.innerHTML = `
          <div class="pg-head">
            <div class="pg-icon"><i data-lucide="user-round-check"></i></div>
            <button class="icon-btn" data-action="close-profile-gate" aria-label="Close"><i data-lucide="x"></i></button>
          </div>
          <h2 id="pg-title">Add your details to continue</h2>
          <p class="sub">We need your <strong>name</strong> and <strong>phone number</strong> before we can create your print order. Your email is optional.</p>

          <div class="pf-row">
            <label class="pf-label" for="pg-name">Full name <span class="pf-req">*</span></label>
            <input id="pg-name" class="field" data-pmf="name" type="text" autocomplete="name"
                   placeholder="e.g. Aarav Sharma" maxlength="60" value="${esc(p.name)}">
            <p class="pf-err" data-err="name" hidden></p>
          </div>
          <div class="pf-row" style="margin-top:12px">
            <label class="pf-label" for="pg-phone">Phone number <span class="pf-req">*</span></label>
            <input id="pg-phone" class="field" data-pmf="phone" type="tel" inputmode="numeric"
                   autocomplete="tel" placeholder="10-digit mobile number" maxlength="14" value="${esc(p.phone)}">
            <p class="pf-err" data-err="phone" hidden></p>
          </div>
          <div class="pf-row" style="margin-top:12px">
            <label class="pf-label" for="pg-email">Email <span class="pf-opt">OPTIONAL</span></label>
            <input id="pg-email" class="field" data-pmf="email" type="email" autocomplete="email"
                   placeholder="you@example.com" maxlength="80" value="${esc(p.email)}">
            <p class="pf-err" data-err="email" hidden></p>
          </div>

          <div class="pg-note"><i data-lucide="info"></i><span>You can change these anytime from the <strong>Profile</strong> tab in the menu.</span></div>

          <div class="pg-actions">
            <button class="btn ghost" data-action="close-profile-gate">Not now</button>
            <button class="btn" data-action="save-profile-gate">Save &amp; continue <i data-lucide="arrow-right"></i></button>
          </div>`;
        icons();
      }

      function openProfileGate() {
        renderProfileGate();
        const ov = $('#profile-gate');
        if (!ov) return;
        ov.classList.add('open');
        document.body.style.overflow = 'hidden';
        setTimeout(() => {
          const f = $('#pg-name');
          if (f) f.focus({ preventScroll: true });
        }, 160);
      }

      function closeProfileGate() {
        const ov = $('#profile-gate');
        if (!ov) return;
        ov.classList.remove('open');
        document.body.style.overflow = '';
      }

      function saveProfileGate() {
        const scope = $('#profile-gate-card');
        if (!scope) return;
        const get = (k) => {
          const el = scope.querySelector('[data-pmf="' + k + '"]');
          return el ? el.value : '';
        };
        if (!validateProfileFields(scope, get)) { icons(); return; }
        state.profile = {
          name: get('name').trim(),
          phone: normalisePhone(get('phone')),
          email: get('email').trim()
        };
        persistProfile();
        closeProfileGate();
        toast('Details saved — continuing to payment');
        setTimeout(() => {
          const btn = $('#pay-btn');
          if (btn) btn.click();          // re-run the normal pay flow
        }, 280);
      }

      /* ---------- wiring ---------- */
      // 1) Block "Proceed to Pay" until name + phone exist.
      //    Capture phase runs before any handler the app may already have on #pay-btn.
      document.addEventListener('click', (e) => {
        const btn = e.target && e.target.closest ? e.target.closest('#pay-btn') : null;
        if (!btn) return;
        if (profileComplete()) return;
        e.preventDefault();
        e.stopPropagation();
        if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        openProfileGate();
      }, true);

      // 2) Profile tab navigation (harmless if the app already handles data-nav).
      document.addEventListener('click', (e) => {
        const nav = e.target && e.target.closest ? e.target.closest('[data-nav="profile"]') : null;
        if (nav) navigate('profile');
      });

      // 3) Keep typed values live-saved in the Profile tab.
      document.addEventListener('input', (e) => {
        const el = e.target && e.target.closest ? e.target.closest('[data-pf]') : null;
        if (!el) return;
        state.profile[el.dataset.pf] = el.value;
        persistProfile();
        const scope = el.closest('.profile-card-lg');
        if (scope) setFieldError(scope, el.dataset.pf, '');
      });

      // 4) Buttons + backdrop + Esc.
      document.addEventListener('click', (e) => {
        const t = e.target;
        if (t && t.id === 'profile-gate') { closeProfileGate(); return; }
        const el = t && t.closest ? t.closest('[data-action]') : null;
        if (!el) return;
        const action = el.dataset.action;
        if (action === 'save-profile') { e.preventDefault(); saveProfileFromPage(); }
        else if (action === 'close-profile-gate') { e.preventDefault(); closeProfileGate(); }
        else if (action === 'save-profile-gate') { e.preventDefault(); saveProfileGate(); }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeProfileGate();
      });


      /* -------------------- init --------------------------------------- */
      async function init() {
        /* Safe here: by the time init() runs, every module-level const
           (including PROFILE_KEY) has been initialised. */
        state.profile = loadProfile();

        try {
          state.db = await openDB();
        } catch (err) {
          console.warn('[SmartXerox] IndexedDB unavailable:', err);
          state.db = null;
          setTimeout(() => toast('Storage is limited in this browser — files last for this session only.'), 900);
        }

        try { await loadOrders(); }
        catch (err) { console.warn('[SmartXerox] Could not load orders:', err); }

        await sdkInit();
        render();

        try {
          const ch = new BroadcastChannel('SmartXeroxOrders');
          ch.onmessage = async (ev) => {
            const d = ev.data;
            if (!d || d.type !== 'order-status' || !d.id) return;
            try {
              let order;
              if (state.db) order = await request(tx('orders').get(d.id));
              else order = state._memOrders[d.id];
              if (!order) return;
              if (d.status) order.status = d.status;
              if (d.paymentStatus) order.paymentStatus = d.paymentStatus;
              await saveOrder(order);
              await loadOrders();
              render();
              toast('Order status updated');
            } catch (err) { /* ignore */ }
          };
        } catch (_) { /* BroadcastChannel unsupported */ }
      }

      /* =====================================================================
       *  Pricing
       * ===================================================================== */

      const PRICING_KEY = 'smartxerox.pricing.v1';
const DEFAULT_PRICING = {
  bwRate: 2.00, colourRate: 8.00, minCharge: 0,
  paper: { A4: 0, A3: 2, A5: 0, Letter: 0, Legal: 1 },   // ₹ added per sheet
  duplex: 2, updatedAt: null
};

function loadPricing() {
  try {
    const raw = localStorage.getItem(PRICING_KEY);
    if (!raw) return { ...DEFAULT_PRICING, paper: { ...DEFAULT_PRICING.paper } };
    const p = JSON.parse(raw);
    return {
      bwRate: Number.isFinite(Number(p.bwRate)) ? Number(p.bwRate) : DEFAULT_PRICING.bwRate,
      colourRate: Number.isFinite(Number(p.colourRate)) ? Number(p.colourRate) : DEFAULT_PRICING.colourRate,
      minCharge: Number.isFinite(Number(p.minCharge)) ? Number(p.minCharge) : DEFAULT_PRICING.minCharge,
      paper: {
        A4: Number.isFinite(Number(p.paper?.A4)) ? Number(p.paper.A4) : DEFAULT_PRICING.paper.A4,
        A3: Number.isFinite(Number(p.paper?.A3)) ? Number(p.paper.A3) : DEFAULT_PRICING.paper.A3,
        A5: Number.isFinite(Number(p.paper?.A5)) ? Number(p.paper.A5) : DEFAULT_PRICING.paper.A5,
        Letter: Number.isFinite(Number(p.paper?.Letter)) ? Number(p.paper.Letter) : DEFAULT_PRICING.paper.Letter,
        Legal: Number.isFinite(Number(p.paper?.Legal)) ? Number(p.paper.Legal) : DEFAULT_PRICING.paper.Legal
      },
      duplex: Number.isFinite(Number(p.duplex)) ? Number(p.duplex) : DEFAULT_PRICING.duplex
    };
  } catch (_) {
    return { ...DEFAULT_PRICING, paper: { ...DEFAULT_PRICING.paper } };
  }
}

      function selectedPages(doc) {
        const cfg = doc.cfg;
        if (cfg.pagesMode === 'All Pages') return doc.pages;
        if (cfg.pagesMode === 'Pick Pages') return cfg.picked.length;
        const set = new Set();
        for (const part of String(cfg.range).split(',')) {
          const m = part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);
          if (!m) continue;
          const a = Number(m[1]);
          const b = m[2] ? Number(m[2]) : a;
          if (b < a || b - a >= 10000) continue;
          for (let n = a; n <= Math.min(b, doc.pages); n++) if (n >= 1) set.add(n);
        }
        return set.size;
      }

      function sheets(doc) {
        const cfg = doc.cfg;
        const perSheet = Math.max(1, cfg.perSheet || 1);
        const sided = cfg.sides === 'Double-sided' ? 2 : 1;
        return Math.ceil(selectedPages(doc) / perSheet / sided) * cfg.copies;
      }

      function price(doc) {
        const cfg = doc.cfg;
        const P = loadPricing();
        const rate = cfg.colour === 'Colour' ? P.colourRate : P.bwRate;
        const surcharge = P.paper[cfg.paper] ?? 0;
        let t = sheets(doc) * (rate + surcharge);
        if (P.minCharge && t < P.minCharge) t = P.minCharge;
        return Math.max(0, t);
      }

      const total = () => state.docs.reduce((s, d) => s + price(d), 0);

      /* =====================================================================
       *  Rendering
       * ===================================================================== */
      function render() {
        if (state.view === 'config' && !state.docs.length) state.view = 'home';
        if (state.view === 'detail' && !state.orders.some((o) => o.id === state.detail)) state.view = 'orders';
        if (state.current >= state.docs.length) state.current = Math.max(0, state.docs.length - 1);

        document.querySelectorAll('[data-nav]').forEach((btn) => {
          const active = btn.dataset.nav === state.view
            || (state.view === 'config' && btn.dataset.nav === 'home')
            || (state.view === 'detail' && btn.dataset.nav === 'orders');
          btn.classList.toggle('active', active);
        });

        const v = $('#view');
        switch (state.view) {
          case 'config': v.innerHTML = config(); break;
          case 'orders': v.innerHTML = ordersView(false); break;
          case 'history': v.innerHTML = ordersView(true); break;
          case 'detail': v.innerHTML = details(); break;
          case 'profile': v.innerHTML = profileView(); break;
          default: v.innerHTML = home();
        }

        const bar = $('#action-bar');
        if (state.view === 'config') {
          const selPages = state.docs.reduce((n, d) => n + selectedPages(d), 0);
          const sheetCount = state.docs.reduce((n, d) => n + sheets(d), 0);
          bar.hidden = false;
          bar.innerHTML = `
            <div><small>${selPages} page${selPages === 1 ? '' : 's'} · ${sheetCount} sheet${sheetCount === 1 ? '' : 's'}</small><strong>${money(total())}</strong></div>
            <button id="pay-btn" class="btn canva-button">Proceed to Pay <i data-lucide="arrow-right"></i></button>`;
        } else {
          bar.hidden = true;
          bar.innerHTML = '';
        }

        icons();
      }

      function refreshTotals() {
        const summary = $('#summary-card');
        if (summary) summary.innerHTML = summaryCard();
        const bar = $('#action-bar');
        if (bar && !bar.hidden) {
          const selPages = state.docs.reduce((n, d) => n + selectedPages(d), 0);
          const sheetCount = state.docs.reduce((n, d) => n + sheets(d), 0);
          const small = bar.querySelector('small');
          if (small) small.textContent = `${selPages} page${selPages === 1 ? '' : 's'} · ${sheetCount} sheet${sheetCount === 1 ? '' : 's'}`;
          const amt = bar.querySelector('strong');
          if (amt) amt.textContent = money(total());
        }
        icons();
      }

      function navigate(view) {
        state.view = view;
        state.detail = null;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      /* -------------------- Home ---------------------------------------- */
      function home() {
        const hasDocs = state.docs.length > 0;
        const totalPages = state.docs.reduce((n, d) => n + d.pages, 0);
        const totalMB = state.docs.reduce((n, d) => n + d.size, 0) / 1024 / 1024;
        const activeOrder = state.orders.find((o) => !['Completed', 'Cancelled'].includes(o.status));

        const activeStrip = activeOrder ? `
          <button class="active-strip" data-action="detail" data-id="${esc(activeOrder.id)}" aria-label="View order ${esc(activeOrder.queue)}">
            <span class="ico"><i data-lucide="clock"></i></span>
            <span class="txt">
              <strong>Order ${esc(activeOrder.queue)} · ${esc(activeOrder.status)}</strong>
              <small>${money(activeOrder.amount)} · ${fmt(activeOrder.created)}</small>
            </span>
            <span class="go">View order <i data-lucide="arrow-right"></i></span>
          </button>` : '';

        if (!hasDocs) {
          return `
            <section class="home-head">
              <div class="home-greet">
                <div class="eyebrow">WELCOME TO SMART XEROX</div>
                <h1>Let's get printing.</h1>
                <p>Upload a document to get started — customize your settings and grab a queue number in seconds.</p>
              </div>
            </section>

            <div class="trust-bar" role="list" aria-label="Why Smart Xerox">
              <div class="trust-item" role="listitem"><i data-lucide="shield-check"></i><span><strong>Private</strong> — files never leave your browser</span></div>
              <div class="trust-item" role="listitem"><i data-lucide="zap"></i><span><strong>Fast</strong> — skip the queue</span></div>
              <div class="trust-item" role="listitem"><i data-lucide="wallet"></i><span><strong>Flexible</strong> — UPI or cash</span></div>
            </div>

            <div id="drop" class="dropzone" role="group" aria-label="Upload documents">
              <span class="dz-badge"><i data-lucide="sparkles"></i> Start a new print</span>
              <div class="dz-icon"><i data-lucide="upload-cloud"></i></div>
              <h2>Drop your files here</h2>
              <p>or click below to browse your device</p>
              <div class="dz-actions">
                <button data-action="browse" class="btn canva-button"><i data-lucide="folder-open"></i> Browse files</button>
              </div>
              <div class="dz-formats"><span>PDF</span><span>DOCX</span><span>DOC</span><span>JPG</span><span>PNG</span><span>≤ 25 MB</span></div>
            </div>

            ${activeStrip}`;
        }

        return `
          <section class="home-head">
            <div class="home-greet">
              <div class="eyebrow">YOUR PRINT SESSION</div>
              <h1>${state.docs.length} file${state.docs.length === 1 ? '' : 's'} ready.</h1>
              <p>Review your documents and continue to print setup, or add more files.</p>
            </div>
            <div class="home-pill"><span class="dot"></span>${totalPages} page${totalPages === 1 ? '' : 's'} · ${money(total())}</div>
          </section>

          <section class="docs-section">
            <div class="docs-section-title">
              <h2>Your documents</h2>
              <div class="docs-meta">
                <small>${totalMB.toFixed(2)} MB total</small>
                <button class="clear-all canva-button" data-action="clear-all" aria-label="Clear all documents">
                  <i data-lucide="trash-2"></i> Clear all
                </button>
              </div>
            </div>

            ${state.docs.map((d, i) => docCard(d, i)).join('')}

            <div id="drop" class="dropzone compact" role="group" aria-label="Add more documents">
              <div class="dz-icon"><i data-lucide="plus"></i></div>
              <div class="dz-inner">
                <h2>Add more files</h2>
                <p>Drag &amp; drop here, or browse from your device</p>
              </div>
              <button data-action="browse" class="btn dark canva-button"><i data-lucide="plus"></i> Add files</button>
            </div>

            <button data-action="setup" class="btn full canva-button" style="margin-top:16px">
              Continue to print setup <i data-lucide="arrow-right"></i>
            </button>
          </section>

          ${activeStrip}`;
      }

      /* Shared file-type detection — used by both docCard() and config() */
      function fileMeta(doc) {
        const t = doc.type || '';
        const isPdf = t === 'application/pdf' || /\.pdf$/i.test(doc.name);
        const isImg = t.startsWith('image/');
        const isWord = t.includes('word') || /\.docx?$/i.test(doc.name);
        return {
          isPdf, isImg, isWord,
          icon: isPdf ? 'file-text' : isImg ? 'image' : 'file',
          tone: isPdf ? 'pdf' : isImg ? 'img' : '',
          kind: isPdf ? 'PDF'
            : isImg ? (t.split('/')[1] || 'image').toUpperCase()
            : isWord ? 'WORD' : 'FILE'
        };
      }

      function docCard(doc, index) {
        const meta = fileMeta(doc);
        return `
          <div class="doc card canva-card">
            <div class="file-icon ${meta.tone}"><i data-lucide="${meta.icon}"></i></div>
            <div class="doc-info">
              <div class="doc-head">
                <div class="doc-name" title="${esc(doc.name)}">${esc(doc.name)}</div>
                <span class="chip">${doc.pages} ${doc.pages === 1 ? 'page' : 'pages'}</span>
              </div>
              <div class="meta">${meta.kind} · ${(doc.size / 1024 / 1024).toFixed(2)} MB${meta.isWord ? ' · page count estimated' : ''}</div>
              <div class="doc-actions">
                <button class="mini canva-button" data-action="preview" data-i="${index}"><i data-lucide="eye"></i> Preview</button>
                <button class="mini canva-button" data-action="replace" data-i="${index}"><i data-lucide="refresh-cw"></i> Replace</button>
                <button class="mini danger canva-button" data-action="remove" data-i="${index}"><i data-lucide="trash-2"></i> Remove</button>
              </div>
            </div>
          </div>`;
      }

      /* -------------------- Config -------------------------------------- */
      function opt(key, values, visual = false) {
        const doc = state.docs[state.current];
        if (!doc) return '';
        const current = doc.cfg[key];
        const iconFor = (v) => {
          if (v === 'Colour') return 'palette';
          if (v === 'Black & White') return 'contrast';
          if (v === 'Portrait') return 'rectangle-vertical';
          if (v === 'Landscape') return 'rectangle-horizontal';
          if (v === 'Single-sided') return 'file';
          return 'copy';
        };
        return `
          <div class="options">
            ${values.map((v) => {
              const active = String(current) === String(v);
              const label = key === 'perSheet' ? `${v} ${v === 1 ? 'Page' : 'Pages'}` : esc(v);
              return `<button type="button"
                              class="choice canva-button ${visual ? 'visual' : ''} ${active ? 'active' : ''}"
                              data-key="${key}" data-value="${esc(v)}"
                              aria-pressed="${active}">
                        ${visual ? `<i data-lucide="${iconFor(v)}"></i>` : ''}${label}
                      </button>`;
            }).join('')}
          </div>`;
      }

      function summaryCard() {
        const doc = state.docs[state.current];
        if (!doc) return '';
        const c = doc.cfg;
        const selPages = state.docs.reduce((n, d) => n + selectedPages(d), 0);
        const sheetCount = state.docs.reduce((n, d) => n + sheets(d), 0);
        return `
          <div class="sum-head">
            <span class="ci"><i data-lucide="receipt"></i></span>
            <div>
              <h2>Print summary</h2>
              <small>Live estimate</small>
            </div>
          </div>
          <div class="sum-row"><span>Documents</span><strong>${state.docs.length}</strong></div>
          <div class="sum-row"><span>Selected pages</span><strong>${selPages}</strong></div>
          <div class="sum-row"><span>Estimated sheets</span><strong>${sheetCount}</strong></div>
          <div class="sum-row"><span>Copies</span><strong>${state.docs.map((d) => d.cfg.copies).join(' + ')}</strong></div>
          <div class="sum-row"><span>Colour · Paper</span><strong>${esc(c.colour)} · ${esc(c.paper)}</strong></div>
          <div class="sum-row"><span>Layout · Sides</span><strong>${c.perSheet}/sheet · ${esc(c.sides)}</strong></div>
          <div class="sum-total"><span>Estimated total</span><strong>${money(total())}</strong></div>
          <p class="hint">Estimate based on print settings. Final shop pricing may vary.</p>`;
      }

      function config() {
        if (!state.docs.length) { state.view = 'home'; return home(); }
        const doc = state.docs[state.current];
        const c = doc.cfg;
        const chips = Array.from({ length: Math.min(doc.pages, 500) }, (_, i) => i + 1)
          .map((p) => `
            <button class="page-chip canva-button ${c.picked.includes(p) ? 'active' : ''}"
                    data-action="pick" data-page="${p}"
                    aria-label="Page ${p}" aria-pressed="${c.picked.includes(p)}">${p}</button>`)
          .join('');

        const fileTabs = state.docs.map((d, i) => {
          const meta = fileMeta(d);
          const active = i === state.current;
          return `
            <div class="file-tab-wrap${active ? ' active' : ''}">
              <button class="file-tab canva-tabs ${active ? 'active' : ''}"
                      data-action="select-doc" data-i="${i}"
                      aria-pressed="${active}" title="${esc(d.name)}">
                <span class="ft-ic"><i data-lucide="${meta.icon}"></i></span>
                <span class="ft-tx">
                  <span class="ft-nm">${esc(d.name)}</span>
                  <span class="ft-mt">${d.pages} ${d.pages === 1 ? 'page' : 'pages'}</span>
                </span>
              </button>
              <button class="file-tab-del canva-button"
                      data-action="remove" data-i="${i}"
                      aria-label="Remove ${esc(d.name)}"
                      title="Remove this file">
                <i data-lucide="x"></i>
              </button>
            </div>`;
        }).join('');

        return `
          <div class="setup-head">
            <button class="setup-back canva-button" data-action="home" aria-label="Back to home">
              <i data-lucide="arrow-left"></i>
            </button>
            <div class="setup-head-txt">
              <div class="eyebrow">STEP 02 · PRINT SETUP</div>
              <h1>Make it yours</h1>
            </div>
          </div>

          <div class="setup-progress" aria-label="Checkout progress">
            <span class="setup-step done"><span class="n">✓</span> Upload</span>
            <span class="bar"></span>
            <span class="setup-step active"><span class="n">2</span> Print setup</span>
            <span class="bar"></span>
            <span class="setup-step"><span class="n">3</span> Payment</span>
          </div>

          <p class="sub" style="margin:-6px 0 16px">Settings are saved per file — switch tabs to tune each document.</p>

          <div class="file-switch" role="tablist" aria-label="Documents">${fileTabs}</div>

          <div class="desktop-columns">
            <div class="config-grid">
              <section class="card canva-card cfg-card">
                <div class="cfg-head"><span class="ci"><i data-lucide="palette"></i></span>
                  <div><h3>Colour mode</h3><small>Ink style for your prints</small></div></div>
                ${opt('colour', ['Black & White', 'Colour'], true)}
              </section>

              <section class="card canva-card cfg-card">
                <div class="cfg-head"><span class="ci"><i data-lucide="file"></i></span>
                  <div><h3>Paper size</h3><small>Pick what fits your document</small></div></div>
                ${opt('paper', ['A4', 'A3', 'A5', 'Letter', 'Legal'])}
              </section>

              <section class="card canva-card cfg-card">
                <div class="cfg-head"><span class="ci"><i data-lucide="layers"></i></span>

      /* -------------------- Orders / History ---------------------------- */
      function badge(s) {
        const cls = (s === 'Completed' || s === 'Ready for Pickup') ? 'green'
          : (s === 'Pending' || s === 'Pending Verification') ? 'amber'
          : s === 'Cancelled' ? 'gray' : '';
        return `<span class="badge ${cls} canva-tag">${esc(s)}</span>`;
      }

      function orderCard(o) {
        const docs = o.docs || [];
        const totalPages = docs.reduce((n, d) => n + (d.pages || 0), 0);
        const totalSheets = docs.reduce((n, d) => n + (d.sheets || 0), 0);
        const isActive = !['Completed', 'Cancelled'].includes(o.status);

        // Overlapping file-type icons (up to 3 + a "+N" chip)
        const docIcons = docs.slice(0, 3).map((d) => {
          const meta = fileMeta(d);
          return `<span class="oc-doc-ic ${meta.tone || ''}" title="${esc(d.name)}"><i data-lucide="${meta.icon}"></i></span>`;
        }).join('');
        const extraDocs = docs.length > 3
          ? `<span class="oc-doc-ic more" title="${docs.length - 3} more">+${docs.length - 3}</span>`
          : '';

        const payMethod = o.paymentMethod || '—';
        const payIcon = payMethod.toLowerCase().includes('upi') ? 'scan-line' : 'banknote';

        return `
          <article class="order order-v2 canva-card ${isActive ? 'is-active' : ''}"
                   data-action="detail" data-id="${esc(o.id)}"
                   tabindex="0" role="button" aria-label="View order ${esc(o.queue)}">
            <div class="oc-top">
              <div class="oc-queue-wrap">
                <div class="oc-queue-label">QUEUE NUMBER</div>

              <div class="oc-doc-icons">${docIcons}${extraDocs}</div>
              <div class="oc-doc-meta">
                <strong>${docs.length} document${docs.length === 1 ? '' : 's'}</strong>
                <small>${totalPages} page${totalPages === 1 ? '' : 's'} · ${totalSheets} sheet${totalSheets === 1 ? '' : 's'}</small>
              </div>
            </div>

            <div class="oc-foot">
              <div class="oc-pay">

      function ordersView(history) {
        const list = state.orders.filter((o) => history
          ? ['Completed', 'Cancelled'].includes(o.status)
          : !['Completed', 'Cancelled'].includes(o.status));

        // Live stats for the My Orders tab (hidden on History)
        const activeCount = state.orders.filter(
          (o) => !['Completed', 'Cancelled'].includes(o.status)
        ).length;
        const completedCount = state.orders.filter(
          (o) => o.status === 'Completed'
        ).length;
        const totalSpent = state.orders
          .filter((o) => o.status === 'Completed')
          .reduce((s, o) => s + (o.amount || 0), 0);

        const statsBar = !history ? `
          <div class="orders-stats" role="list" aria-label="Order summary">

        const empty = `

      function details() {
        const o = state.orders.find((x) => x.id === state.detail);
        if (!o) return ordersView(false);
        const docs = o.docs || [];
        // Normalise so 'paid', 'PAID', 'Paid ', 'Paid\n' all match the same step.
        const normStatus = (v) => String(v || '').trim().toLowerCase();
        const isCancelled = normStatus(o.status) === 'cancelled';
        const isCompleted = normStatus(o.status) === 'completed';
        const heroClass = isCancelled ? 'is-cancelled' : isCompleted ? 'is-done' : 'is-active';

        // Progress steps
        const steps = [
          { key: 'placed',    label: 'Placed'    },
          { key: 'paid',      label: 'Paid'      },
          { key: 'printing',  label: 'Printing'  },
          { key: 'ready',     label: 'Ready',     green: true },
          { key: 'completed', label: 'Completed', green: true }
        ];

        // Map the order status to the step index that has been reached, then
        // tick every step up to and including it. The next step becomes "active".
        //   Placed → 0 · Paid → 1 · Printing → 2 · Ready → 3 · Completed → 4
        const STATUS_ORDER = ['placed', 'paid', 'printing', 'ready', 'completed'];
        const statusIdx = STATUS_ORDER.indexOf(normStatus(o.status));
        let reached = statusIdx < 0 ? -1 : statusIdx;

        // If the admin marked the order paid but the order status is still
        // "Placed" (paymentStatus flipped before status), tick "Paid" anyway.
        if (reached < 1 && normStatus(o.paymentStatus) === 'paid') reached = 1;

        steps.forEach((s, i) => { s.done = i <= reached; });
        const activeIdx = reached + 1 < steps.length ? reached + 1 : -1;

        const trackHtml = isCancelled
          ? `<div class="od-cancel-banner"><i data-lucide="x-circle"></i> This order was cancelled and will not be printed.</div>`
          : `<div class="od-track">
              ${steps.map((s, i) => `
                <div class="od-track-step ${s.done ? 'done' : ''} ${i === activeIdx ? 'active' : ''} ${s.green ? 'green' : ''}">
                  <span class="od-track-dot">${s.done ? '<i data-lucide="check"></i>' : ''}</span>
                  <span class="od-track-label">${s.label}</span>

        // Document cards
        const cards = docs.map((d) => {
          const c = d.cfg || defaultCfg();
          const meta = fileMeta(d);

          return `
            <div class="od-doc">
              <div class="od-doc-head">
                <span class="od-doc-icon ${meta.tone || ''}"><i data-lucide="${meta.icon}"></i></span>
                <div class="od-doc-info">
                  <div class="od-doc-name" title="${esc(d.name)}">${esc(d.name)}</div>
                  <div class="od-doc-sub">
                    <span>${d.pages || 0} pages</span>
                    <span>·</span>
                    <span>${esc(selectedLabel)}</span>
                  </div>
                </div>
                <span class="od-doc-sheets">${d.sheets || 0} sheets</span>
              </div>
              <div class="od-doc-settings">
                <span class="od-setting"><i data-lucide="palette"></i>${esc(c.colour)}</span>
                <span class="od-setting"><i data-lucide="file"></i>${esc(c.paper)}</span>
                <span class="od-setting"><i data-lucide="layers"></i><strong>${c.copies}</strong> ${c.copies === 1 ? 'copy' : 'copies'}</span>
                <span class="od-setting"><i data-lucide="layout-grid"></i><strong>${c.perSheet}</strong>/sheet</span>
                <span class="od-setting"><i data-lucide="rectangle-vertical"></i>${esc(c.orientation)}</span>
                <span class="od-setting"><i data-lucide="copy"></i>${esc(c.sides)}</span>
              </div>
            </div>`;
        }).join('') || '<div class="empty card canva-card"><i data-lucide="file-x"></i><strong>No documents in this order</strong></div>';

        // Total sheets
        const totalSheets = docs.reduce((n, d) => n + (d.sheets || 0), 0);

        return `
          <div class="od-topbar">
            <button class="od-back canva-button" data-action="orders" aria-label="Back to orders">
              <i data-lucide="arrow-left"></i>
            </button>
            <div class="od-topbar-txt">
              <div class="eyebrow">ORDER DETAILS</div>
              <h1>Order ${esc(o.queue)}</h1>
            </div>
          </div>

          <div class="od-hero ${heroClass}">
            <div class="od-hero-row">
              <div class="od-hero-left">
                <div class="od-hero-label">QUEUE NUMBER</div>
                <div class="od-hero-queue">${esc(o.queue)}</div>
                <div class="od-hero-sub">
                  <span><i data-lucide="calendar"></i>${fmt(o.created)}</span>
                  <button type="button" class="od-copy canva-button"
                          data-action="copy-order-id" data-id="${esc(o.id)}"
                          title="Copy full order ID">
                    <i data-lucide="copy"></i> ${esc(String(o.id).slice(0, 8))}…
                  </button>
                </div>
              </div>
              <div class="od-hero-badges">
                ${badge(o.status)}
                ${badge(o.paymentStatus)}
              </div>
            </div>
            ${trackHtml}
          </div>

          <div class="od-summary">
            <div class="od-sum-item">
              <small><i data-lucide="wallet"></i>Method</small>
              <strong>${esc(o.paymentMethod || '—')}</strong>
            </div>
            <div class="od-sum-item">
              <small><i data-lucide="files"></i>Documents</small>
              <strong>${docs.length}</strong>
            </div>
            <div class="od-sum-item">
              <small><i data-lucide="layers"></i>Sheets</small>
              <strong>${totalSheets}</strong>
            </div>
            <div class="od-sum-item accent">
              <small><i data-lucide="indian-rupee"></i>Total</small>
              <strong>${money(o.amount)}</strong>
            </div>
          </div>

          <div class="od-section-title">
            <span class="ci"><i data-lucide="files"></i></span>
            <div>
              <h2>Documents &amp; settings</h2>
              <small>${docs.length} ${docs.length === 1 ? 'file' : 'files'} in this order</small>
            </div>
          </div>
          ${cards}

          <div class="od-actions">
            <button data-action="receipt" class="btn secondary canva-button">
              <i data-lucide="printer"></i> Print Receipt
            </button>
            ${isCompleted || isCancelled
              ? `<button data-action="reorder" class="btn canva-button"><i data-lucide="rotate-cw"></i> Reorder</button>`
              : `<button data-action="home" class="btn canva-button"><i data-lucide="plus"></i> New order</button>`}
          </div>

          <button type="button" class="od-delete-link canva-button"
                  data-action="delete-order" data-id="${esc(o.id)}"
                  aria-label="Delete order ${esc(o.queue)}">
            <i data-lucide="trash-2"></i> Delete this order
          </button>`;
      }

      /* =====================================================================
       *  File handling — always works, degrades gracefully
       * ===================================================================== */
      async function addFiles(files, replaceIndex = null) {
        let target = Number.isInteger(replaceIndex) && replaceIndex >= 0 ? replaceIndex : null;
        let added = 0;
        const hadDb = !!state.db;

        for (const file of files) {
          if (!/\.(pdf|docx?|jpe?g|png)$/i.test(file.name)) {
            toast('Unsupported file: ' + file.name);
            continue;
          }
          if (file.size > 25 * 1024 * 1024) {
            toast('File exceeds 25 MB: ' + file.name);
            continue;
          }

          let pages = 1;
          const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);

          if (isPdf && window.pdfjsLib) {
            try {
              const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
              pages = pdf.numPages || 1;
            } catch (err) {
              console.warn('[SmartXerox] PDF parse failed, defaulting to 1 page:', err);
              pages = 1;
            }
          }

          const type = isPdf
            ? 'application/pdf'
            : /\.(jpe?g|png)$/i.test(file.name)
              ? 'image/' + (/\.png$/i.test(file.name) ? 'png' : 'jpeg')
              : (file.type || 'application/octet-stream');

          const doc = {
            id: uid(),
            name: file.name,
            size: file.size,
            type,
            pages,
            blob: file,
            cfg: defaultCfg()
          };

          try {
            await saveDoc(doc);   // falls back to memory if no db
          } catch (err) {
            console.warn('[SmartXerox] saveDoc failed, using memory:', err);
            state._memDocs[doc.id] = {
              id: doc.id, name: doc.name, size: doc.size,
              type: doc.type, pages: doc.pages, blob: doc.blob
            };
          }

          if (target !== null) {
            state.docs.splice(target, 1, doc);
            target = null;
          } else {
            state.docs.push(doc);
          }
          added++;
        }

        if (added) {
          render();
          toast(added + ' document' + (added > 1 ? 's' : '') + ' ready to print');
          if (!hadDb) console.info('[SmartXerox] Files stored in memory only (no IndexedDB).');
        }
      }

      /* =====================================================================
       *  Sheets / checkout
       * ===================================================================== */
      let closeTimer = null;
      let qrTimerInterval = null;

      function openSheet(html) {
        clearTimeout(closeTimer);
        clearInterval(qrTimerInterval);
        $('#sheet').innerHTML = html;
        const overlay = $('#overlay');
        overlay.classList.remove('closing');
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        icons();
        const first = $('#sheet').querySelector('button');
        if (first) first.focus();
      }

      function closeSheet() {
        if (state.submitting) return;
        const overlay = $('#overlay');
        if (!overlay.classList.contains('open')) return;
        overlay.classList.add('closing');
        clearTimeout(closeTimer);
        closeTimer = setTimeout(() => {
          overlay.classList.remove('open', 'closing');
          document.body.style.overflow = '';
          clearInterval(qrTimerInterval);
        }, 220);
      }

      let confirmOpenedAt = 0;

      function confirmClearAll() {
        if (!state.docs.length) return;
        const overlay = $('#confirm-overlay');
        const card = $('#confirm-card');
        const n = state.docs.length;
        confirmOpenedAt = Date.now();
        card.setAttribute('aria-labelledby', 'confirm-title');
        card.innerHTML = `
          <div class="confirm-icon"><i data-lucide="trash-2"></i></div>
          <h3 id="confirm-title">Clear all documents?</h3>
          <p>This removes all ${n} loaded ${n === 1 ? 'file' : 'files'} from this session. You can upload them again anytime.</p>
          <div class="confirm-actions">
            <button data-action="confirm-cancel" class="btn ghost canva-button">Cancel</button>
            <button data-action="confirm-clear" class="btn danger canva-button">Clear all</button>
          </div>`;
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        icons();
        const first = card.querySelector('button');
        if (first) first.focus();
      }

      function closeConfirm() {
        const wasOpen = $('#confirm-overlay').classList.contains('open');
        $('#confirm-overlay').classList.remove('open');
        document.body.style.overflow = '';
        if (wasOpen) {
          const trigger = document.querySelector('[data-action="clear-all"]');
          if (trigger) trigger.focus();
        }
      }

            let deleteOrderId = null;

      function confirmDeleteOrder(id) {
        const order = state.orders.find((o) => o.id === id);
        if (!order) return;
        deleteOrderId = id;
        confirmOpenedAt = Date.now();

        const overlay = $('#confirm-overlay');
        const card = $('#confirm-card');
        card.setAttribute('aria-labelledby', 'confirm-title');
        card.innerHTML = `
          <div class="confirm-icon"><i data-lucide="trash-2"></i></div>
          <h3 id="confirm-title">Delete this order?</h3>
          <p>Order <strong>${esc(order.queue)}</strong> (${money(order.amount)}) will be permanently removed from this device.</p>
          <div class="confirm-actions">
            <button data-action="confirm-cancel" class="btn ghost canva-button">Cancel</button>
            <button data-action="confirm-delete-order" class="btn danger canva-button">Delete</button>
          </div>`;
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        icons();
        const first = card.querySelector('button');
        if (first) first.focus();
      }

      async function deleteOrder(id) {
        if (!id) return;
        try {
          if (state.db) {
            await request(tx('orders', 'readwrite').delete(id));
          } else {
            delete state._memOrders[id];
          }
          deleteOrderId = null;
          await loadOrders();
          if (state.detail === id) state.view = 'orders';
          closeConfirm();
          render();
          toast('Order deleted');
        } catch (err) {
          console.error('[SmartXerox] Delete failed:', err);
          toast('Could not delete order. Please try again.');
        }
      }

      const sheetHead = (title, subtitle) => `
        <div class="sheet-head">
          <div>
            <div class="eyebrow">SMART XEROX CHECKOUT</div>
            <h2>${title}</h2>
          </div>
          <button data-action="close-sheet" class="icon-btn canva-button" aria-label="Close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <p class="sub">${subtitle}</p>`;

      function payment() {
        if (!state.docs.length) return;
        if (state.docs.some((d) => selectedPages(d) < 1)) {
          toast('Select at least one page for every document.');
          return;
        }
        const docCount = state.docs.length;
        const pageCount = state.docs.reduce((n, d) => n + selectedPages(d), 0);

        openSheet(sheetHead('Choose Payment Method', 'One last step before your documents join the queue.') + `

            <span class="pay-progress-line done"></span>
            <span class="pay-progress-step done"><span class="dot">✓</span> Setup</span>
            <span class="pay-progress-line done"></span>
            <span class="pay-progress-step active"><span class="dot">3</span> Payment</span>
          </div>

          <div class="pay-sheet">

      function startQrTimer() {
        clearInterval(qrTimerInterval);
        let remaining = 5 * 60;
        const el = document.getElementById('qr-timer');
        if (!el) return;
        const span = el.querySelector('span');
        qrTimerInterval = setInterval(() => {
          remaining--;
          if (remaining < 0) {
            clearInterval(qrTimerInterval);
            if (span) span.textContent = 'QR expired — close & reopen to refresh';
            el.classList.add('warn');
            return;
          }
          const m = Math.floor(remaining / 60);
          const s = String(remaining % 60).padStart(2, '0');
          if (span) span.textContent = `QR valid for ${m}:${s}`;
          if (remaining <= 60) el.classList.add('warn');
        }, 1000);
      }

      /* ---- QR Card Generator (professional branded PNG) ---- */
      function roundRectPath(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      async function generateQrCard() {
        try { await document.fonts.ready; } catch (_) {}

        const W = 640, H = 920, dpr = 2;
        const canvas = document.createElement('canvas');
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        // Page background
        const pageGrad = ctx.createLinearGradient(0, 0, 0, H);
        pageGrad.addColorStop(0, '#f6f8fc');
        pageGrad.addColorStop(1, '#eef3ff');
        ctx.fillStyle = pageGrad;
        ctx.fillRect(0, 0, W, H);

        // Main card
        const cardX = 40, cardY = 40, cardW = W - 80, cardH = 840;
        ctx.save();
        ctx.shadowColor = 'rgba(25,44,83,0.18)';
        ctx.shadowBlur = 32;
        ctx.shadowOffsetY = 12;
        roundRectPath(ctx, cardX, cardY, cardW, cardH, 28);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();

        // Header
        const headerH = 150;
        ctx.save();
        roundRectPath(ctx, cardX, cardY, cardW, headerH, 28);
        ctx.clip();
        const headerGrad = ctx.createLinearGradient(cardX, cardY, cardX + cardW, cardY + headerH);
        headerGrad.addColorStop(0, '#325cf4');
        headerGrad.addColorStop(0.55, '#4568f6');
        headerGrad.addColorStop(1, '#5379ff');
        roundRectPath(ctx, cardX, cardY, cardW, headerH, 28);
        ctx.fillStyle = headerGrad;
        ctx.fill();

        // Decorative circles
        ctx.beginPath();
        ctx.arc(cardX + cardW - 40, cardY + 30, 110, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cardX + 30, cardY + headerH - 10, 80, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fill();

        // Brand icon tile
        const iconX = cardX + 36, iconY = cardY + 36, iconSize = 56;
        roundRectPath(ctx, iconX, iconY, iconSize, iconSize, 15);
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 1;
        roundRectPath(ctx, iconX, iconY, iconSize, iconSize, 15);
        ctx.stroke();

        // Printer glyph
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        roundRectPath(ctx, iconX + 18, iconY + 12, 20, 10, 2);
        ctx.stroke();
        roundRectPath(ctx, iconX + 10, iconY + 22, 36, 18, 3);
        ctx.stroke();
        roundRectPath(ctx, iconX + 16, iconY + 38, 24, 9, 2);
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(iconX + 16, iconY + 31, 1.8, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        // Brand text
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 22px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.fillText('Smart Xerox', iconX + iconSize + 16, iconY + 6);
        ctx.font = '700 11px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.fillText('P A Y M E N T   Q R   C O D E', iconX + iconSize + 16, iconY + 38);
        ctx.restore();

        // "SCAN TO PAY"
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.font = '800 12px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.fillStyle = '#94a0b2';
        ctx.fillText('S C A N   T O   P A Y', W / 2, cardY + 172);

        // Fetch QR image as blob (CORS-safe for canvas)
        const upiImg = document.getElementById('upi-qr');
        const src = upiImg?.src || '';
        let qrBitmap;
        try {
          const res = await fetch(src, { mode: 'cors', cache: 'no-store' });
          if (!res.ok) throw new Error('QR fetch failed');
          const blob = await res.blob();
          qrBitmap = await createImageBitmap(blob);
        } catch (err) {
          throw new Error('Could not load QR image for download');
        }

        const qrSize = 300;
        const qrX = (W - qrSize) / 2;
        const qrY = cardY + 212;

        // QR white frame
        ctx.save();
        ctx.shadowColor = 'rgba(25,44,83,0.1)';
        ctx.shadowBlur = 20;
        ctx.shadowOffsetY = 6;
        roundRectPath(ctx, qrX - 16, qrY - 16, qrSize + 32, qrSize + 32, 24);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
        ctx.strokeStyle = '#e8edf5';
        ctx.lineWidth = 1.5;
        roundRectPath(ctx, qrX - 16, qrY - 16, qrSize + 32, qrSize + 32, 24);
        ctx.stroke();

        // Draw QR centered, preserving aspect ratio
        const qrBW = qrBitmap.width || qrSize;
        const qrBH = qrBitmap.height || qrSize;
        const qrScale = Math.min(qrSize / qrBW, qrSize / qrBH);
        const qrDW = qrBW * qrScale;
        const qrDH = qrBH * qrScale;
        const qrDX = qrX + (qrSize - qrDW) / 2;
        const qrDY = qrY + (qrSize - qrDH) / 2;

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(qrBitmap, qrDX, qrDY, qrDW, qrDH);

        // Amount card
        const amtX = cardX + 36;
        const amtW = cardW - 72;
        const amtY = qrY + qrSize + 34;
        const amtH = 96;

        roundRectPath(ctx, amtX, amtY, amtW, amtH, 18);
        const amtGrad = ctx.createLinearGradient(amtX, amtY, amtX + amtW, amtY + amtH);
        amtGrad.addColorStop(0, '#eef2ff');
        amtGrad.addColorStop(1, '#dfe8ff');
        ctx.fillStyle = amtGrad;
        ctx.fill();
        ctx.strokeStyle = '#cfdaff';
        ctx.lineWidth = 1.5;
        roundRectPath(ctx, amtX, amtY, amtW, amtH, 18);
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.font = '800 10.5px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.fillStyle = '#5a6b86';
        ctx.fillText('A M O U N T   T O   P A Y', amtX + 22, amtY + 16);
        ctx.font = '800 34px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.fillStyle = '#325cf4';
        ctx.fillText(money(total()), amtX + 22, amtY + 34);

        // Right-side tags
        const docsCount = state.docs.length;
        const pageTotal = state.docs.reduce((n, d) => n + selectedPages(d), 0);
        ctx.textAlign = 'right';
        ctx.font = '700 9.5px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.fillStyle = '#5a6b86';
        ctx.fillText('INCLUSIVE OF ALL TAXES', amtX + amtW - 22, amtY + 18);
        ctx.fillStyle = '#68758a';
        ctx.font = '700 11px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.fillText(`${docsCount} doc · ${pageTotal} pg`, amtX + amtW - 22, amtY + 54);

        // UPI ID card
        const upiX = amtX;
        const upiY = amtY + amtH + 20;
        const upiW = amtW;
        const upiH = 68;
        roundRectPath(ctx, upiX, upiY, upiW, upiH, 16);
        ctx.fillStyle = '#fafcff';
        ctx.fill();
        ctx.strokeStyle = '#e4ebf7';
        ctx.lineWidth = 1.5;
        roundRectPath(ctx, upiX, upiY, upiW, upiH, 16);
        ctx.stroke();

        const cx = upiX + 36, cy = upiY + upiH / 2;
        ctx.beginPath();
        ctx.arc(cx, cy, 19, 0, Math.PI * 2);
        ctx.fillStyle = '#eef2ff';
        ctx.fill();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 18px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.fillStyle = '#325cf4';
        ctx.fillText('@', cx, cy + 1);

        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.font = '800 9.5px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.fillStyle = '#94a0b2';
        ctx.fillText('S H O P   U P I   I D', upiX + 68, upiY + 16);
        ctx.font = '800 16px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.fillStyle = '#15213a';
        ctx.fillText(UPI_ID, upiX + 68, upiY + 34);

        // Footer divider
        ctx.strokeStyle = '#eef2f9';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(amtX, cardY + cardH - 92);
        ctx.lineTo(amtX + amtW, cardY + cardH - 92);
        ctx.stroke();

        // Footer text
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        ctx.font = '700 11px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.fillStyle = '#94a0b2';
        ctx.fillText('Scan with any UPI app · Pay securely', W / 2, cardY + cardH - 80);

        const gen = new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
        ctx.font = '600 9.5px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.fillStyle = '#b6c1d3';
        ctx.fillText(`Generated ${gen}`, W / 2, cardY + cardH - 60);

        // "Developed by ~ Shankar Prasad Pyke" — name emphasized
        const devLead = 'Developed by ~ ';
        const devName = 'Shankar Prasad Pyke';
        const devY = cardY + cardH - 40;

        ctx.font = '600 10.5px "Plus Jakarta Sans", system-ui, sans-serif';
        const leadW = ctx.measureText(devLead).width;
        ctx.font = '800 10.5px "Plus Jakarta Sans", system-ui, sans-serif';
        const nameW = ctx.measureText(devName).width;
        const startX = (W - (leadW + nameW)) / 2;

        ctx.textAlign = 'left';
        ctx.font = '600 10.5px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.fillStyle = '#8a97ac';
        ctx.fillText(devLead, startX, devY);

        ctx.font = '800 10.5px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.fillStyle = '#3d4d68';
        ctx.fillText(devName, startX + leadW, devY);

        ctx.textAlign = 'center';

        return canvas;
      }

          .map((o) => parseInt(String(o.queue || '').split('-')[1], 10))

        return 'XR-' + String(Math.max(23, ...nums) + 1).padStart(3, '0');

      async function submit(method, txn = '') {
        if (state.submitting) return;
        if (!state.docs.length) return toast('Add a document before placing an order.');
        if (state.docs.some((d) => selectedPages(d) < 1)) {
          return toast('Select at least one page for every document.');
        }
        if (method === 'UPI') {
          const cleanTxn = String(txn).trim();
          if (!cleanTxn) {
            return toast('Please enter your transaction ID.');
          }
          if (!/^[A-Za-z0-9]{8,30}$/.test(cleanTxn)) {
            return toast('That transaction ID looks invalid — please check and try again.');
          }
        }
        if (state.orders.length >= 999) return toast('Order limit reached.');

        state.submitting = true;
        const btn = $('#sheet [data-action^="confirm-"]');
        const btnLabel = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; btn.textContent = 'Placing order…'; }

        const order = {
          id: 'SX-' + Date.now().toString(36).toUpperCase(),
          queue: nextQueue(),
          created: new Date().toISOString(),
          amount: total(),
          paymentMethod: method,
          paymentStatus: method === 'UPI' ? 'Pending Verification' : 'Pay at Counter',
          transactionId: String(txn).trim(),
          status: 'Pending',
          docs: state.docs.map((d) => ({
            id: d.id,
            name: d.name,
            pages: d.pages,
            cfg: clone(d.cfg),
            selectedLabel: d.cfg.pagesMode === 'All Pages'
              ? 'All'
              : d.cfg.pagesMode === 'Custom Range'
                ? d.cfg.range
                : d.cfg.picked.join(', '),
            selectedPages: selectedPages(d),
            sheets: sheets(d)
          }))
        };

        let synced = false;

        try {
          // Try remote sync — completely optional
          if (window.dataSdk && state.ready && typeof window.dataSdk.create === 'function') {
            try {
              const res = await window.dataSdk.create({
                order_id: order.id,
                queue_number: order.queue,
                created_at: order.created,
                amount: order.amount,
                payment_method: order.paymentMethod,
                payment_status: order.paymentStatus,
                transaction_id: order.transactionId,
                document_count: order.docs.length,
                total_pages: order.docs.reduce((n, d) => n + d.selectedPages, 0),
                order_details: JSON.stringify(order.docs)
              });
              synced = !!(res && res.isOk);
              if (!synced) console.warn('[SmartXerox] SDK create returned not-OK; continuing locally.');
            } catch (sdkErr) {
              console.warn('[SmartXerox] SDK create failed; continuing locally:', sdkErr);
            }
          }

          // Always persist locally (memory or IndexedDB)
          await saveOrder(order);
          await loadOrders();

          state.docs = [];
          state.current = 0;
          state.view = 'home';
          render();
          success(order, synced);
        } catch (err) {
          toast(err.message || 'Could not save your order. Please try again.');
          if (btn) { btn.disabled = false; btn.textContent = btnLabel; }
        } finally {
          state.submitting = false;
        }
      }
