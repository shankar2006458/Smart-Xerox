<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101c35">
    <title>Smart Xerox</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Icons (stable version) -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <!-- PDF.js — main + worker from the SAME release on jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <!-- DOCX renderer requires JSZip -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.2/dist/docx-preview.min.js"></script>
    
    <style>
      :root {
        --ink: #15213a;
        --muted: #78849a;
        --blue: #325cf4;
        --line: #e8edf5;
        --bg: #f6f8fc;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body, button, input { font-family: "Plus Jakarta Sans", sans-serif; }
      body { margin: 0; background: var(--bg); color: var(--ink); }
      button { cursor: pointer; }
      button:active { transform: scale(.975); }
      button:focus-visible,
      input:focus-visible,
      [tabindex]:focus-visible { outline: 3px solid #94b4ff; outline-offset: 3px; }
      button:disabled { opacity: .55; cursor: not-allowed; }

      .app { min-height: 100vh; }
      .side { display: none; }
      .content { max-width: 1040px; margin: auto; padding: 28px 18px 145px; }
      .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 34px; }
      .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; font-size: 18px; letter-spacing: -.7px; }
      .mark { width: 38px; height: 38px; background: #315cf4; color: #fff; border-radius: 12px; display: grid; place-items: center; box-shadow: 0 6px 14px #315cf433; }
      .mark svg { width: 20px; }
      .top-note { font-size: 12px; color: var(--muted); font-weight: 700; }
      .eyebrow { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--blue); font-weight: 800; }
      .heading { font-size: 30px; line-height: 1.18; letter-spacing: -1.3px; font-weight: 800; margin: 10px 0; }
      .sub { color: var(--muted); font-size: 14px; line-height: 1.65; }
      .section-title { font-size: 16px; font-weight: 800; letter-spacing: -.4px; margin: 29px 0 13px; }
      .card { background: #fff; border: 1px solid var(--line); border-radius: 19px; box-shadow: 0 5px 22px #192c5308; }

      .btn { border: 0; background: var(--blue); color: #fff; padding: 13px 20px; border-radius: 12px; font-size: 13px; font-weight: 800; display: inline-flex; gap: 8px; align-items: center; justify-content: center; transition: .2s; box-shadow: 0 5px 13px #325cf42b; }
      .btn:hover { background: #244be1; }
      .btn.secondary { background: #eef2ff; color: var(--blue); box-shadow: none; }
      .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
      .btn.dark { background: #172440; }
      .btn.full { width: 100%; }
      .hint { font-size: 11px; color: #94a0b2; margin-top: 13px; }

      .doc { padding: 15px; display: flex; align-items: flex-start; gap: 12px; margin-bottom: 9px; }
      .file-icon { flex: none; width: 40px; height: 43px; border-radius: 11px; background: #edf1ff; color: var(--blue); display: grid; place-items: center; }
      .file-icon svg { width: 19px; }
      .doc-info { min-width: 0; flex: 1; }
      .doc-name { font-weight: 800; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .meta { font-size: 11px; color: var(--muted); margin-top: 5px; }
      .doc-actions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
      .mini { border: 0; background: #f3f6fb; border-radius: 8px; padding: 7px 9px; color: #53637d; font-size: 11px; font-weight: 700; }
      .mini:hover { color: var(--blue); background: #eaf0ff; }

      .empty { padding: 32px 18px; text-align: center; color: var(--muted); }
      .empty svg { width: 29px; height: 29px; color: #aebddd; margin: auto; }
      .empty strong { display: block; color: var(--ink); margin-top: 12px; font-size: 14px; }
      .empty p { font-size: 12px; line-height: 1.6; margin: 6px 0 0; }

      .step-top { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
      .back { border: 0; background: #fff; border-radius: 11px; width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); }

      .config-grid { display: grid; gap: 16px; }
      .config-card { padding: 18px; }
      .config-card h3 { font-size: 13px; font-weight: 800; margin: 0 0 13px; }
      .options { display: flex; flex-wrap: wrap; gap: 8px; }
      .choice { border: 1.5px solid var(--line); background: #fff; border-radius: 11px; padding: 11px 14px; color: #52617a; font-size: 12px; font-weight: 800; transition: .18s; min-height: 42px; }
      .choice:hover { border-color: #a9bdfc; }
      .choice.active { color: var(--blue); background: #eef2ff; border-color: var(--blue); box-shadow: 0 0 0 2px #325cf410; }
      .choice.visual { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 120px; }
      .choice svg { width: 17px; height: 17px; }

      .stepper { display: flex; align-items: center; gap: 8px; }
      .stepper button { border: 1px solid var(--line); background: #f7f9fd; border-radius: 10px; width: 37px; height: 37px; font-size: 20px; color: var(--blue); }
      .stepper strong { min-width: 22px; text-align: center; }

      .field { border: 1px solid #dce4f0; border-radius: 11px; width: 100%; padding: 12px 13px; font-size: 13px; background: #fff; color: var(--ink); margin-top: 11px; }

      .page-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; max-height: 175px; overflow: auto; }
      .page-chip { width: 38px; height: 42px; border: 1px solid var(--line); background: #fff; border-radius: 8px; font-weight: 800; color: #69788e; }
      .page-chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }

      .summary { padding: 20px; }
      .sum-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 12px; color: #758196; }
      .sum-row strong { color: var(--ink); text-align: right; }
      .sum-total { border-top: 1px dashed #dce4f0; margin-top: 7px; padding-top: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 800; }
      .sum-total strong { font-size: 24px; color: var(--blue); }

      .action-bar[hidden] { display: none; }
      .action-bar { position: fixed; bottom: 68px; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 18px; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 15px; box-shadow: 0 -5px 25px #15213a0a; }
      .action-bar small { display: block; color: var(--muted); font-size: 10px; }
      .action-bar strong { font-size: 20px; letter-spacing: -.7px; }

      .bottom { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line); height: 69px; display: flex; justify-content: space-around; z-index: 21; }
      .nav-btn { border: 0; background: none; color: #94a0b2; display: grid; justify-items: center; align-content: center; gap: 4px; font-size: 10px; font-weight: 800; min-width: 76px; }
      .nav-btn svg { width: 19px; height: 19px; }
      .nav-btn.active { color: var(--blue); }

      /* ===================== Enhanced My Orders ===================== */

      /* Stat summary strip */
      .orders-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 20px 0 4px;
      }
      .os-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 14px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 3px 10px #192c5308;
        min-width: 0;
      }
      .os-icon {
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: #eef2ff;
        color: var(--blue);
        display: grid;
        place-items: center;
      }
      .os-icon.green { background: #e8f8ef; color: #16945b; }
      .os-icon.blue  { background: #eef2ff; color: var(--blue); }
      .os-icon svg { width: 16px; height: 16px; }
      .os-item > div { min-width: 0; }
      .os-item small {
        display: block;
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .os-item strong {
        display: block;
        font-size: 15px;
        font-weight: 800;
        color: var(--ink);
        letter-spacing: -.3px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Orders list container */
      .orders-list-v2 { display: grid; gap: 12px; margin-top: 18px; }
      .orders-list-v2 .empty { margin: 0; }

      /* Enhanced order card */
      .order.order-v2 {
        padding: 0;
        margin: 0;
        overflow: hidden;
        border-radius: 18px;
        background: #fff;
        border: 1px solid var(--line);
        position: relative;
        cursor: pointer;
        transition: transform .2s, box-shadow .2s, border-color .2s;
      }
      .order.order-v2::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: var(--blue);
        opacity: .85;
      }
      .order.order-v2.is-active::before {
        background: linear-gradient(180deg, #efa823, #f7c85a);
      }
      .order.order-v2:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px #192c5318;
        border-color: #cddbf7;
      }

      /* Card top: queue + status */
      .oc-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px 12px;
      }
      .oc-queue-wrap { min-width: 0; flex: 1; }
      .oc-queue-label {
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: 1.6px;
        color: #94a0b2;
        margin-bottom: 2px;
      }
      .oc-queue {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -.8px;
        color: var(--ink);
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .oc-time {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
        font-weight: 600;
      }
      .oc-badge-wrap { flex: none; }

      /* Docs strip */
      .oc-docs-strip {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 18px 14px;
      }
      .oc-doc-icons { display: flex; flex: none; }
      .oc-doc-ic {
        width: 26px;
        height: 30px;
        border-radius: 7px;
        background: #eef2ff;
        color: var(--blue);
        display: grid;
        place-items: center;
        box-shadow: 0 0 0 2px #fff;
        margin-left: -6px;
        flex: none;
      }
      .oc-doc-ic:first-child { margin-left: 0; }
      .oc-doc-ic svg { width: 13px; height: 13px; }
      .oc-doc-ic.pdf { background: #fdeeee; color: #d14848; }
      .oc-doc-ic.img { background: #e9f8f0; color: #12915c; }
      .oc-doc-ic.more {
        background: #f3f6fb;
        color: #53637d;
        font-size: 10px;
        font-weight: 800;
      }
      .oc-doc-meta { min-width: 0; flex: 1; }
      .oc-doc-meta strong {
        display: block;
        font-size: 12px;
        font-weight: 800;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .oc-doc-meta small {
        display: block;
        font-size: 10.5px;
        color: var(--muted);
        font-weight: 600;
        margin-top: 1px;
      }

      /* Footer */
      .oc-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 12px 18px 15px;
        border-top: 1px solid #f1f5fc;
        background: #fafcff;
      }
      .oc-pay {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        min-width: 0;
      }
      .oc-pay-method {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 700;
        color: #53637d;
        background: #fff;
        border: 1px solid #e4ebf7;
        border-radius: 100px;
        padding: 4px 9px 4px 7px;
        white-space: nowrap;
      }
      .oc-pay-method svg { width: 12px; height: 12px; }
      .oc-amount {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      .oc-amount small {
        font-size: 10px;
        font-weight: 700;
        color: #94a0b2;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .oc-amount strong {
        font-size: 17px;
        font-weight: 800;
        color: var(--ink);
        letter-spacing: -.5px;
        font-variant-numeric: tabular-nums;
      }
      .oc-arrow {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #eef2ff;
        color: var(--blue);
        display: grid;
        place-items: center;
        transition: background .2s, color .2s, transform .2s;
      }
      .oc-arrow svg { width: 13px; height: 13px; }
      .order.order-v2:hover .oc-arrow {
        background: var(--blue);
        color: #fff;
        transform: translateX(2px);
      }

      /* Delete icon inside each card footer */
      .oc-del {
        flex: none;
        width: 28px;
        height: 28px;
        margin-left: 2px;
        border: 1px solid transparent;
        background: transparent;
        color: #b6c1d3;
        border-radius: 8px;
        display: grid;
        place-items: center;
        padding: 0;
        cursor: pointer;
        transition: .18s;
      }
      .oc-del svg { width: 14px; height: 14px; pointer-events: none; }
      .oc-del:hover {
        color: #d14848;
        background: #fdeeee;
        border-color: #f5c9c9;
      }
      .oc-del:active { transform: scale(.94); }

      /* Keep legacy classes used elsewhere */
      .order-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
      .queue { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
      .badge { display: inline-block; border-radius: 100px; padding: 6px 10px; background: #edf2ff; color: #325cf4; font-size: 10px; font-weight: 800; }
      .badge.green { background: #e8f8ef; color: #16945b; }
      .badge.amber { background: #fff4df; color: #a76d0a; }
      .badge.gray  { background: #f0f2f6; color: #68758a; }
      .order-foot { border-top: 1px solid var(--line); padding-top: 13px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }

      @media (max-width: 480px) {
        .orders-stats { grid-template-columns: 1fr 1fr; }
        .os-item:nth-child(3) { grid-column: 1 / -1; }
        .oc-queue { font-size: 21px; }
        .oc-amount strong { font-size: 16px; }
        .oc-amount small { display: none; }
      }

      /* ===================== Order Details v2 ===================== */

      /* Top bar */
      .od-topbar { display: flex; align-items: center; gap: 13px; margin-bottom: 20px; }
      .od-back {
        flex: none;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 12px;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        color: var(--ink);
        box-shadow: 0 4px 12px #192c530a;
        transition: .18s;
        cursor: pointer;
      }
      .od-back:hover { color: var(--blue); border-color: #b3c5f5; transform: translateX(-2px); }
      .od-back svg { width: 18px; height: 18px; }
      .od-topbar-txt { flex: 1; min-width: 0; }
      .od-topbar-txt h1 { font-size: 22px; font-weight: 800; letter-spacing: -.7px; margin: 4px 0 0; }

      /* Hero */
      .od-hero {
        position: relative;
        overflow: hidden;
        background: linear-gradient(150deg, #ffffff 0%, #f5f9ff 100%);
        border: 1px solid #e2eafb;
        border-radius: 22px;
        padding: 20px 20px 16px;
        box-shadow: 0 8px 24px #192c530c;
      }
      .od-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 100% 0%, #325cf414, transparent 55%);
        pointer-events: none;
      }
      .od-hero::after {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 4px;
        background: var(--blue);
        opacity: .9;
      }
      .od-hero.is-active::after { background: linear-gradient(180deg, #efa823, #f7c85a); }
      .od-hero.is-done::after   { background: linear-gradient(180deg, #16945b, #4dcd92); }
      .od-hero.is-cancelled::after { background: #e04c4c; }
      .od-hero > * { position: relative; z-index: 1; }

      .od-hero-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
      .od-hero-left { min-width: 0; flex: 1; }
      .od-hero-label { font-size: 9.5px; font-weight: 800; letter-spacing: 1.6px; color: #94a0b2; text-transform: uppercase; margin-bottom: 2px; }
      .od-hero-queue {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -1.2px;
        color: var(--ink);
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .od-hero-sub {
        margin-top: 8px;
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 600;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
      }
      .od-hero-sub > span { display: inline-flex; align-items: center; gap: 4px; }
      .od-hero-sub > span svg { width: 12px; height: 12px; color: var(--blue); }
      .od-hero-badges { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

      /* Copy order id */
      .od-copy {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 9px;
        border: 1px solid #e4ebf7;
        background: #fff;
        border-radius: 8px;
        color: #53637d;
        font-size: 10.5px;
        font-weight: 700;
        cursor: pointer;
        transition: .18s;
        white-space: nowrap;
      }
      .od-copy:hover { color: var(--blue); border-color: #b3c5f5; background: #f5f8ff; }
      .od-copy.copied { color: #16945b; border-color: #b7e6cd; background: #edfaf3; }
      .od-copy svg { width: 11px; height: 11px; }

      /* Progress tracker */
      .od-track {
        display: flex;
        align-items: flex-start;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px dashed #e4ecf8;
      }
      .od-track-step {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        position: relative;
        text-align: center;
        min-width: 0;
      }
      .od-track-step::before {
        content: "";
        position: absolute;
        top: 12px;
        left: calc(-50% + 12px);
        right: calc(50% + 12px);
        height: 2px;
        background: #e4ecf8;
        z-index: 0;
      }
      .od-track-step:first-child::before { display: none; }
      .od-track-step.done::before,
      .od-track-step.active::before { background: var(--blue); }
      .od-track-step.done.green::before,
      .od-track-step.active.green::before { background: #16945b; }
      .od-track-dot {
        position: relative;
        z-index: 1;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #eef2f9;
        color: #8a97ac;
        display: grid;
        place-items: center;
        font-size: 10px;
        font-weight: 800;
        border: 2px solid #fff;
        box-shadow: 0 0 0 1.5px #e4ecf8;
        transition: all .25s;
      }
      .od-track-dot svg { width: 12px; height: 12px; }
      .od-track-step.done .od-track-dot { background: var(--blue); color: #fff; box-shadow: 0 0 0 1.5px var(--blue); }
      .od-track-step.done.green .od-track-dot { background: #16945b; box-shadow: 0 0 0 1.5px #16945b; }
      .od-track-step.active .od-track-dot {
        background: var(--blue);
        color: #fff;
        box-shadow: 0 0 0 1.5px var(--blue), 0 0 0 5px #325cf41a;
        animation: odPulse 1.8s ease-in-out infinite;
      }
      .od-track-step.active.green .od-track-dot {
        background: #16945b;
        box-shadow: 0 0 0 1.5px #16945b, 0 0 0 5px #16945b1a;
        animation: odPulseGreen 1.8s ease-in-out infinite;
      }
      @keyframes odPulse {
        0%,100% { box-shadow: 0 0 0 1.5px var(--blue), 0 0 0 5px #325cf41a; }
        50%     { box-shadow: 0 0 0 1.5px var(--blue), 0 0 0 9px #325cf40a; }
      }
      @keyframes odPulseGreen {
        0%,100% { box-shadow: 0 0 0 1.5px #16945b, 0 0 0 5px #16945b1a; }
        50%     { box-shadow: 0 0 0 1.5px #16945b, 0 0 0 9px #16945b0a; }
      }
      .od-track-label {
        font-size: 10px;
        font-weight: 800;
        color: #94a0b2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;

      .od-track-step.done .od-track-label,

      .od-track-step.active.green .od-track-label { color: #16945b; }

      /* Cancelled banner (replaces tracker) */

        gap: 5px;
        white-space: nowrap;

      .od-sum-item strong {
        font-size: 16px;

      /* Section header */
      .od-section-title { display: flex; align-items: center; gap: 10px; margin: 22px 0 12px; }
      .od-section-title .ci {

      }
      .od-section-title .ci svg { width: 15px; height: 15px; }
      .od-section-title h2 { font-size: 15px; font-weight: 800; margin: 0; letter-spacing: -.3px; }
      .od-section-title small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 1px; }

      /* Document cards */
      .od-doc {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;

        flex: none;

      .od-doc-icon.img { background: #e9f8f0; color: #12915c; box-shadow: 0 2px 6px #12915c14; }
      .od-doc-info { flex: 1; min-width: 0; }
      .od-doc-name { font-size: 13px; font-weight: 800; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .od-doc-sub {

      .od-doc-sheets {
        flex: none;
        font-size: 10px;

        color: #53637d;

        border-radius: 100px;

        white-space: nowrap;
      }
      .od-doc-settings {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;

      }
      .od-setting {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px 5px 8px;
        background: #fafcff;

      }
      .od-setting svg { width: 11px; height: 11px; color: #94a0b2; }
      .od-setting strong { color: var(--ink); font-weight: 800; margin-left: 1px; }

      /* Actions */
      .od-actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 9px;
        margin-top: 22px;
      }
      @media (min-width: 520px) { .od-actions { grid-template-columns: 1fr 1fr; } }
      .od-actions .btn { width: 100%; padding: 13px 16px; }

      /* Subtle delete link */
      .od-delete-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        margin-top: 12px;
        padding: 10px;
        background: transparent;
        border: 0;
        border-radius: 10px;
        color: #94a0b2;
        font-size: 11.5px;
        font-weight: 700;

      }

      @media (max-width: 480px) {

      .overlay { position: fixed; inset: 0; background: #101b34a8; backdrop-filter: blur(5px); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
      .overlay.open { display: flex; }
      .sheet { background: #fff; border-radius: 25px 25px 0 0; padding: 24px 20px 30px; width: 100%; max-width: 550px; max-height: 92vh; overflow: auto; animation: rise .28s ease-out; }
      .sheet h2 { font-size: 21px; letter-spacing: -.7px; margin: 9px 0 6px; }
      .sheet .sub { margin: 0 0 20px; }
      .sheet-head { display: flex; align-items: center; justify-content: space-between; }
      .icon-btn { border: 0; background: #f3f5fa; border-radius: 10px; width: 34px; height: 34px; display: grid; place-items: center; }

      /* ===================== Enhanced Payment Modal ===================== */
      .pay-sheet {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 6px;
      }
      .pay-card {
        display: flex;
        gap: 14px;
        align-items: center;
        border: 1.5px solid var(--line);
        border-radius: 18px;
        padding: 16px 16px 16px 14px;
        width: 100%;
        text-align: left;
        background: #fff;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        font-family: inherit;
        transition: border-color .2s, box-shadow .2s, transform .2s, background .2s;
        animation: paySlideUp .5s cubic-bezier(.2,.8,.3,1) backwards;
      }
      .pay-sheet .pay-card:nth-child(1) { animation-delay: .04s; }
      .pay-sheet .pay-card:nth-child(2) { animation-delay: .12s; }
      .pay-card:hover {
        border-color: var(--blue);
        box-shadow: 0 14px 30px #325cf41a, 0 0 0 4px #325cf40d;
        transform: translateY(-2px);
        background: linear-gradient(180deg, #fff 0%, #f7faff 100%);
      }
      .pay-card:active { transform: translateY(0) scale(.99); }
      .pay-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 0% 0%, #325cf410, transparent 60%);
        opacity: 0;
        transition: opacity .25s;
        pointer-events: none;
      }
      .pay-card:hover::after { opacity: 1; }

      .pay-icon {
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        position: relative;
        z-index: 1;
        transition: transform .25s cubic-bezier(.2,.8,.3,1);
      }
      .pay-icon svg { width: 22px; height: 22px; }
      .pay-icon.cash {
        background: linear-gradient(135deg, #e8f8ef, #c9efda);
        color: #16945b;
        box-shadow: 0 4px 12px #16945b1a;
      }
      .pay-icon.upi {
        background: linear-gradient(135deg, #eef2ff, #dbe4ff);
        color: var(--blue);
        box-shadow: 0 4px 12px #325cf41f;
      }
      .pay-card:hover .pay-icon { transform: scale(1.07) rotate(-4deg); }

      .pay-body { flex: 1; min-width: 0; position: relative; z-index: 1; }
      .pay-body strong {
        display: block;
        font-size: 14px;
        font-weight: 800;
        color: var(--ink);
        letter-spacing: -.2px;
      }
      .pay-body small {
        display: block;
        color: var(--muted);
        margin-top: 4px;
        font-size: 11.5px;
        line-height: 1.45;
      }
      .pay-badge {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: .6px;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 100px;
        background: #e8f8ef;
        color: #16945b;
        margin-left: 6px;
        vertical-align: middle;
      }

      .pay-chevron {
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #f3f6fb;
        color: #94a0b2;
        display: grid;
        place-items: center;
        position: relative;
        z-index: 1;
        transition: background .2s, color .2s, transform .2s;
      }
      .pay-chevron svg { width: 14px; height: 14px; }
      .pay-card:hover .pay-chevron {
        background: var(--blue);
        color: #fff;
        transform: translateX(3px);
      }

      /* Amount summary card */
      .pay-amount-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
        padding: 18px 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, #eef2ff 0%, #e0e8ff 100%);
        border: 1px solid #cfdaff;
        position: relative;
        overflow: hidden;
        animation: paySlideUp .5s cubic-bezier(.2,.8,.3,1) .2s backwards;
      }
      .pay-amount-card::before {
        content: "";
        position: absolute;
        right: -40px;
        top: -40px;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle, #325cf422, transparent 70%);
        pointer-events: none;
      }
      .pay-amount-label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        position: relative;
        z-index: 1;
      }
      .pay-amount-label small {
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: #5a6b86;
      }
      .pay-amount-label span {
        font-size: 12px;
        color: #68758a;
        font-weight: 600;
      }
      .pay-amount-value {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -1px;
        color: var(--blue);
        position: relative;
        z-index: 1;
        font-variant-numeric: tabular-nums;
      }

      /* Trust row */
      .pay-trust {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px dashed #dce4f0;
        font-size: 10.5px;
        color: #94a0b2;
        font-weight: 600;
        flex-wrap: wrap;
        animation: paySlideUp .5s cubic-bezier(.2,.8,.3,1) .28s backwards;
      }
      .pay-trust span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .pay-trust svg { width: 13px; height: 13px; color: var(--blue); }

            /* Sheet header polish inside the payment flow */
      #sheet .sheet-head h2 { animation: paySlideUp .4s cubic-bezier(.2,.8,.3,1) both; }
      #sheet .sheet-head + .sub { animation: paySlideUp .4s cubic-bezier(.2,.8,.3,1) .05s both; }

      @keyframes paySlideUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .qr { width: 172px; height: 172px; margin: 16px auto; background: #fff; padding: 8px; border: 1px solid var(--line); border-radius: 12px; }
      .qr img { width: 100%; height: 100%; object-fit: contain; }
      .receipt-line { border-top: 1px dashed #dce4f0; margin: 16px 0; }

      .success-icon { width: 67px; height: 67px; border-radius: 50%; background: #e7f8ef; color: #18a362; display: grid; place-items: center; margin: 6px auto 14px; animation: pop .45s ease; }
      .success-icon svg { width: 34px; height: 34px; }
      .ticket { background: #f7f9ff; border: 1px dashed #bacaf2; border-radius: 18px; text-align: center; padding: 23px 16px; margin: 19px 0; }
      .ticket small { font-size: 10px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
      .ticket .number { font-size: 44px; letter-spacing: -2px; font-weight: 800; color: var(--blue); margin: 3px 0; }

      .toast { position: fixed; z-index: 100; top: 16px; left: 50%; transform: translateX(-50%) translateY(-70px); background: #172440; color: #fff; border-radius: 11px; padding: 11px 16px; font-size: 12px; font-weight: 700; box-shadow: 0 10px 30px #101c3540; transition: .25s; max-width: 90vw; text-align: center; }
      .toast.show { transform: translateX(-50%) translateY(0); }

      .preview { position: fixed; inset: 0; background: #101827; z-index: 60; display: none; flex-direction: column; color: #fff; }
      .preview.open { display: flex; }
      .preview-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 17px; background: #172238; }
      .preview-main { flex: 1; overflow: auto; display: grid; place-items: center; padding: 20px; }
      .preview-main canvas,
      .preview-main img { max-width: 100%; max-height: 68vh; object-fit: contain; box-shadow: 0 10px 30px #0005; }
      .preview-controls { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; background: #172238; }
      .preview-controls button { background: #2b3954; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; }
      .thumbs { display: flex; gap: 6px; overflow: auto; padding: 9px 16px; background: #172238; }
      .thumbs button { flex: none; background: #293a58; color: #fff; border: 1px solid #435573; border-radius: 7px; padding: 7px 11px; font-size: 11px; }
      .thumbs button.active { background: var(--blue); border-color: var(--blue); }

      /* ===================== Redesigned Home tab ===================== */
      /* Document card refinements (shared with the redesigned home) */
      .doc { transition: border-color .18s, box-shadow .18s; }
      .doc:hover { border-color: #cddbf7; box-shadow: 0 8px 22px #192c5312; }
      .doc-head { display: flex; align-items: center; gap: 8px; }
      .doc-head .doc-name { flex: 1; min-width: 0; }
      .chip { flex: none; font-size: 10px; font-weight: 800; color: #5a6b86; background: #f1f5fc; border-radius: 100px; padding: 3px 9px; white-space: nowrap; }
      .file-icon.pdf { background: #fdeeee; color: #d14848; }
      .file-icon.img { background: #e9f8f0; color: #12915c; }
      .mini { display: inline-flex; align-items: center; gap: 5px; }
      .mini svg { width: 13px; height: 13px; }

      /* Greeting header */
      .home-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; flex-wrap: wrap; }
      .home-greet .eyebrow { margin-bottom: 8px; }
      .home-greet h1 { font-size: 30px; letter-spacing: -1.3px; line-height: 1.1; margin: 0 0 9px; font-weight: 800; }
      .home-greet p { color: var(--muted); font-size: 14px; margin: 0; max-width: 480px; line-height: 1.6; }
      .home-pill { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 100px; padding: 8px 14px; font-size: 11.5px; font-weight: 700; color: var(--ink); box-shadow: 0 3px 10px #192c530a; white-space: nowrap; }
      .home-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 3px #10b98120; flex: none; }

      /* Big hero dropzone */
      .dropzone { position: relative; overflow: hidden; background: linear-gradient(160deg, #ffffff 0%, #f5f9ff 100%); border: 1.5px solid #e2eafb; border-radius: 24px; padding: 46px 24px; text-align: center; transition: .25s cubic-bezier(.2,.7,.3,1); cursor: pointer; }
      .dropzone::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, #325cf414, transparent 60%); opacity: 0; transition: .3s; pointer-events: none; }
      .dropzone:hover { border-color: #b3c5f5; box-shadow: 0 14px 38px #325cf416; }
      .dropzone:hover::before { opacity: 1; }
      .dropzone.drag { border-color: var(--blue); background: linear-gradient(160deg, #eff4ff, #e1eaff); }
      .dropzone > * { position: relative; z-index: 1; }
      .dz-badge { display: inline-flex; align-items: center; gap: 7px; background: #eef2ff; color: var(--blue); border-radius: 100px; padding: 5px 12px; font-size: 10.5px; font-weight: 800; letter-spacing: .7px; text-transform: uppercase; margin-bottom: 18px; }
      .dz-badge svg { width: 12px; height: 12px; }
      .dz-icon { width: 70px; height: 70px; border-radius: 22px; background: linear-gradient(135deg, #325cf4, #5379ff); color: #fff; display: grid; place-items: center; margin: 0 auto 18px; box-shadow: 0 14px 30px #325cf442, 0 0 0 8px #eef2ff; }
      .dz-icon svg { width: 32px; height: 32px; }
      .dropzone h2 { font-size: 20px; font-weight: 800; letter-spacing: -.5px; margin: 0 0 7px; }
      .dropzone p { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
      .dz-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .dz-formats { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 22px; }
      .dz-formats span { font-size: 10px; font-weight: 800; letter-spacing: .8px; color: #94a0b2; background: #eef2f9; border-radius: 6px; padding: 5px 9px; }

      /* Compact dropzone (when files exist) — high-visibility banner */
      .dropzone.compact {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        text-align: left;
        padding: 18px 20px;
        border: 2px dashed #7d9dff;
        background: linear-gradient(120deg, #f0f5ff 0%, #e1eaff 100%);
        margin-top: 14px;
        border-radius: 18px;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        animation: pulseBorder 2.4s ease-in-out infinite;
        transition: border-color .2s, box-shadow .2s, transform .2s;
      }
      .dropzone.compact::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 30%, #325cf418 50%, transparent 70%);
        transform: translateX(-100%);
        animation: shimmer 4s ease-in-out infinite;
        pointer-events: none;
      }
      .dropzone.compact:hover {
        border-color: var(--blue);
        box-shadow: 0 12px 30px #325cf42b;
        transform: translateY(-1px);
      }
      .dropzone.compact.drag {
        border-color: var(--blue);
        background: linear-gradient(120deg, #dfe9ff 0%, #cdd9ff 100%);
      }
      .dropzone.compact > * { position: relative; z-index: 1; }
      .dropzone.compact .dz-icon {
        width: 52px;
        height: 52px;
        border-radius: 15px;
        margin: 0;
        background: linear-gradient(135deg, #325cf4, #5379ff);
        color: #fff;
        box-shadow: 0 10px 22px #325cf450, 0 0 0 6px #dbe5ff;
        flex: none;
        animation: pulseIcon 2.4s ease-in-out infinite;
      }
      .dropzone.compact .dz-icon svg { width: 24px; height: 24px; }
      .dropzone.compact .dz-inner { flex: 1; min-width: 140px; }
      .dropzone.compact h2 { font-size: 15px; margin: 0 0 3px; color: var(--ink); font-weight: 800; letter-spacing: -.2px; }
      .dropzone.compact p { font-size: 12px; margin: 0; color: #5a6b86; }
      .dropzone.compact .btn { margin-left: auto; }

      @keyframes pulseBorder {
        0%, 100% { border-color: #7d9dff; }
        50% { border-color: #325cf4; }
      }
      @keyframes pulseIcon {
        0%, 100% { box-shadow: 0 10px 22px #325cf450, 0 0 0 6px #dbe5ff; }
        50% { box-shadow: 0 10px 24px #325cf470, 0 0 0 11px #c6d6ff; }
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        55%, 100% { transform: translateX(100%); }
      }

      /* Trust bar — deliberately flat and informational, NOT card-styled */
      .trust-bar { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: -10px 2px 20px; padding: 0; }
      .trust-item { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 1.4; color: #6c7a90; padding: 0; }
      .trust-item svg { width: 15px; height: 15px; color: var(--blue); flex: none; }
      .trust-item strong { font-weight: 800; color: var(--ink); }
      
      /* Active order strip — a live status + link, not a card */
      .active-strip {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 15px 18px 15px 20px;
        margin-top: 22px;
        background: #fffaf0;
        border: 1px solid #f1dcb0;
        border-left: 4px solid #efa823;
        border-radius: 14px;
        cursor: pointer;
        transition: .2s;
        text-align: left;
        width: 100%;
        font: inherit;
        color: inherit;
      }
      .active-strip:hover {
        background: #fff5e0;
        border-color: #ebc675;
        border-left-color: #d98b00;
        box-shadow: 0 10px 24px #ef9c2326;
        transform: translateY(-1px);
      }
      .active-strip .ico { flex: none; width: 40px; height: 40px; border-radius: 12px; background: #fff; color: #b47700; display: grid; place-items: center; box-shadow: 0 2px 8px #a76d0a1c; }
      .active-strip .ico svg { width: 18px; height: 18px; }
      .active-strip .txt { flex: 1; min-width: 0; }
      .active-strip strong { display: block; font-size: 13px; font-weight: 800; color: var(--ink); }
      .active-strip small { color: #8a6a34; font-size: 11.5px; font-weight: 600; }
      .active-strip .go {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .3px;
        color: #b47700;
        background: #fff;
        border: 1px solid #f0d7a2;
        border-radius: 100px;
        padding: 6px 11px;
        white-space: nowrap;
        transition: .2s;
      }
      .active-strip .go svg { width: 12px; height: 12px; }
      .active-strip:hover .go { background: #b47700; color: #fff; border-color: #b47700; }

      /* Documents section */
      .docs-section { margin-top: 6px; }
      .docs-section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
      .docs-section-title h2 { font-size: 17px; font-weight: 800; margin: 0; letter-spacing: -.3px; }
      .docs-section-title small { color: var(--muted); font-size: 11.5px; font-weight: 600; }
      .docs-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

      /* Clear-all button */
      .clear-all {
        border: 0;
        background: transparent;
        color: #94a0b2;
        font-size: 11px;
        font-weight: 800;
        padding: 6px 10px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: .18s;
        white-space: nowrap;
      }
      .clear-all:hover { color: #d14848; background: #fdeeee; }
      .clear-all svg { width: 13px; height: 13px; }

      /* Confirmation modal */
      .confirm-overlay {
        position: fixed;
        inset: 0;
        background: #101b34a8;
        backdrop-filter: blur(5px);
        z-index: 55;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .confirm-overlay.open { display: flex; animation: fadeIn .2s ease-out; }
      .confirm-card {
        background: #fff;
        border-radius: 22px;
        padding: 26px 22px 22px;
        width: 100%;
        max-width: 380px;
        text-align: center;
        box-shadow: 0 25px 60px #101c3550;
      }
      .confirm-overlay.open .confirm-card { animation: confirmPop .32s cubic-bezier(.2,.8,.3,1.1); }
      .confirm-icon {
        width: 56px; height: 56px;
        border-radius: 50%;
        background: #fdeeee;
        color: #d14848;
        display: grid; place-items: center;
        margin: 0 auto 16px;
      }
      .confirm-icon svg { width: 26px; height: 26px; }
      .confirm-card h3 {
        font-size: 18px; font-weight: 800;
        letter-spacing: -.4px;
        margin: 0 0 8px;
        color: var(--ink);
      }
      .confirm-card p {
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 22px;
      }
      .confirm-actions { display: flex; gap: 9px; }
      .confirm-actions .btn { flex: 1; }
      .btn.danger { background: #e04c4c; box-shadow: 0 5px 13px #e04c4c30; }
      .btn.danger:hover { background: #c93b3b; }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes confirmPop {
        from { transform: scale(.92) translateY(10px); opacity: 0; }
        to { transform: scale(1) translateY(0); opacity: 1; }
      }

      @media (min-width: 640px) {
        .trust-bar { gap: 10px 28px; }
      }
      @media (min-width: 800px) {
        .home-greet h1 { font-size: 36px; }
        .dropzone { padding: 60px 40px; }
        .dropzone h2 { font-size: 24px; }
        .dz-icon { width: 78px; height: 78px; border-radius: 24px; }
        .dz-icon svg { width: 36px; height: 36px; }
      }

      @keyframes rise { from { transform: translateY(35px); opacity: .5; } to { transform: none; opacity: 1; } }
      @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

      @media (min-width: 800px) {
        .app { display: flex; }
        .side { display: flex; width: 238px; flex: none; background: #fff; border-right: 1px solid var(--line); min-height: 100vh; padding: 28px 17px; flex-direction: column; position: sticky; top: 0; height: 100vh; }
        .side .brand { margin: 3px 10px 46px; }
        .side-nav { display: grid; gap: 7px; }
        .side-nav button { border: 0; background: transparent; color: #718097; text-align: left; display: flex; gap: 13px; align-items: center; padding: 13px; border-radius: 12px; font-weight: 800; font-size: 13px; }
        .side-nav button.active { color: var(--blue); background: #edf2ff; }
        .side-nav svg { width: 18px; }
        .main-area { flex: 1; min-width: 0; }
        .content { padding: 38px 48px 100px; }
        .top { display: none; }
        .heading { font-size: 37px; }
        .config-grid { grid-template-columns: 1fr 1fr; }
        .bottom { display: none; }
        .action-bar { left: 238px; bottom: 0; padding: 15px max(48px, calc((100vw - 1140px) / 2)); }
        .sheet { border-radius: 24px; margin-bottom: 30px; }
        .overlay { align-items: center; }
        .desktop-columns { display: grid; grid-template-columns: minmax(0, 1fr) 290px; align-items: start; gap: 18px; }
        .desktop-columns .summary { position: sticky; top: 25px; }
        .desktop-columns .config-grid { grid-template-columns: 1fr 1fr; }
      }

      /* ===================== Redesigned Print Setup ===================== */
      .setup-head { display: flex; align-items: center; gap: 13px; margin-bottom: 18px; }
      .setup-back { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 12px; width: 42px; height: 42px; display: grid; place-items: center; color: var(--ink); box-shadow: 0 4px 12px #192c530a; transition: .18s; }
      .setup-back:hover { color: var(--blue); border-color: #b3c5f5; transform: translateX(-2px); }
      .setup-back svg { width: 18px; height: 18px; }
      .setup-head-txt { flex: 1; min-width: 0; }
      .setup-head-txt h1 { font-size: 24px; letter-spacing: -.9px; font-weight: 800; margin: 5px 0 0; }

      /* Progress rail */
      .setup-progress { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: 0 0 22px; }
      .setup-step { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 800; color: #94a0b2; padding: 6px 12px; border-radius: 100px; background: #fff; border: 1px solid var(--line); }
      .setup-step .n { width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-size: 9.5px; font-weight: 800; background: #eef2f9; color: #8a97ac; }
      .setup-step.done { color: #16945b; background: #edfaf3; border-color: #c9eeda; }
      .setup-step.done .n { background: #16945b; color: #fff; }
      .setup-step.active { color: #fff; background: var(--blue); border-color: var(--blue); box-shadow: 0 6px 16px #325cf433; }
      .setup-step.active .n { background: #fff; color: var(--blue); }
      .setup-progress .bar { width: 14px; height: 2px; background: #dbe3f0; border-radius: 2px; }

      /* File switcher tabs */
      .file-switch { display: flex; gap: 9px; overflow-x: auto; padding: 2px 2px 12px; margin: 0 -2px 4px; scrollbar-width: thin; }
      .file-switch::-webkit-scrollbar { height: 6px; }
      .file-switch::-webkit-scrollbar-thumb { background: #d7e0ef; border-radius: 6px; }
      .file-tab { flex: none; display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 9px; border: 1.5px solid var(--line); background: #fff; border-radius: 13px; transition: .18s; color: #52617a; max-width: 240px; cursor: pointer; }
      .file-tab:hover { border-color: #b3c5f5; }
      .file-tab.active { border-color: var(--blue); background: #f5f8ff; box-shadow: 0 0 0 3px #325cf412; }
      .file-tab .ft-ic { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: #eef2ff; color: var(--blue); }
      .file-tab .ft-ic svg { width: 16px; height: 16px; }
      .file-tab.active .ft-ic { background: var(--blue); color: #fff; }
      .file-tab .ft-tx { min-width: 0; display: block; text-align: left; }
      .file-tab .ft-nm { display: block; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
      .file-tab .ft-mt { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 2px; }

      /* File tab wrapper + per-file delete button */
      .file-tab-wrap { position: relative; flex: none; }
      .file-tab-wrap .file-tab { padding-right: 40px; max-width: 280px; }
      .file-tab-del {
        position: absolute;
        top: 50%;
        right: 6px;
        transform: translateY(-50%);
        width: 26px;
        height: 26px;
        border: 0;
        background: transparent;
        color: #94a0b2;
        border-radius: 7px;
        display: grid;
        place-items: center;
        transition: .15s;
        cursor: pointer;
        z-index: 2;
      }
      .file-tab-del:hover { background: #fdeeee; color: #d14848; }
      .file-tab-del svg { width: 13px; height: 13px; }
      .file-tab-wrap.active .file-tab-del { color: var(--blue); }

      /* Danger variant of the mini button (used on home doc cards) */
      .mini.danger:hover { color: #d14848; background: #fdeeee; }

      /* Config card v2 */
      .cfg-card { padding: 18px 18px 16px; }
      .cfg-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .cfg-head .ci { flex: none; width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center; background: #eef2ff; color: var(--blue); }
      .cfg-head .ci svg { width: 15px; height: 15px; }
      .cfg-head h3 { font-size: 13px; font-weight: 800; margin: 0; letter-spacing: -.2px; }
      .cfg-head small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 2px; }

      /* Polished stepper — perfectly centered +/− and number field */
      .stepper button {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        border: 1px solid #dbe4f2;
        background: #fff;
        font-size: 22px;
        font-weight: 600;
        color: var(--blue);
        transition: .15s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        line-height: 0;
        font-family: inherit;
        box-shadow: 0 1px 3px #192c530a;
        /* Optical nudge: − sits higher than + in most fonts */
        text-rendering: geometricPrecision;
      }
      .stepper button:hover { background: #eef2ff; border-color: #b3c5f5; }
      .stepper button:active { transform: scale(.94); }
      .stepper button svg { display: block; }

      /* Nudge the minus sign down 1px to match the plus */
      .stepper button[data-action="minus"] {
        padding-top: 2px;
      }
      .stepper button[data-action="plus"] {
        padding-top: 0;
      }
      .stepper strong { font-size: 20px; font-weight: 800; min-width: 26px; letter-spacing: -.5px; }

      /* Typable copies input */
      .stepper .copies-input {
        width: 64px;
        height: 40px;
        text-align: center;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -.3px;
        color: var(--ink);
        background: #fff;
        border: 1px solid #dbe4f2;
        border-radius: 11px;
        padding: 0 6px;
        font-variant-numeric: tabular-nums;
        transition: border-color .15s, box-shadow .15s;
        box-shadow: 0 1px 3px #192c530a;
        -moz-appearance: textfield;
        appearance: textfield;
      }
      .stepper .copies-input:hover { border-color: #b3c5f5; }
      .stepper .copies-input:focus {
        border-color: var(--blue);
        outline: none;
        box-shadow: 0 0 0 3px #325cf420;
      }
      .stepper .copies-input::-webkit-outer-spin-button,
      .stepper .copies-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Summary card header */
      .sum-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .sum-head .ci { flex: none; width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center; background: #eef2ff; color: var(--blue); }
      .sum-head .ci svg { width: 15px; height: 15px; }
      .sum-head h2 { font-size: 14px; font-weight: 800; margin: 0; }
      .sum-head small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 2px; }

      /* ===================== Enhanced Payment Flow v2 ===================== */

      /* Smooth close animation for the bottom sheet */
      .overlay.closing { animation: overlayOut .22s ease-in forwards; }
      .overlay.closing .sheet { animation: sheetOut .22s cubic-bezier(.4,0,1,1) forwards; }
      @keyframes overlayOut { to { opacity: 0; } }
      @keyframes sheetOut { to { transform: translateY(40px); opacity: 0; } }

      /* Payment progress stepper */
      .pay-progress {
        display: flex; align-items: center; gap: 8px;
        margin: 4px 0 18px; padding: 12px 14px;
        background: linear-gradient(135deg, #f7faff, #eef3ff);
        border: 1px solid #e0e8fa; border-radius: 14px;
        animation: paySlideUp .4s cubic-bezier(.2,.8,.3,1) both;
      }
      .pay-progress-step {
        display: flex; align-items: center; gap: 6px;
        font-size: 11px; font-weight: 800; color: #94a0b2; white-space: nowrap;
      }
      .pay-progress-step .dot {
        width: 18px; height: 18px; border-radius: 50%;
        background: #e6ecf7; color: #94a0b2;
        display: grid; place-items: center; font-size: 9px; font-weight: 800;
        transition: all .3s;
      }
      .pay-progress-step.done { color: #16945b; }
      .pay-progress-step.done .dot { background: #16945b; color: #fff; }
      .pay-progress-step.active { color: var(--blue); }
      .pay-progress-step.active .dot {
        background: var(--blue); color: #fff;
        box-shadow: 0 0 0 4px #325cf41f;
        animation: pulseDot 1.8s ease-in-out infinite;
      }
      .pay-progress-line { flex: 1; height: 2px; background: #dbe3f0; border-radius: 2px; min-width: 12px; }
      .pay-progress-line.done { background: #16945b; }
      @keyframes pulseDot {
        0%,100% { box-shadow: 0 0 0 4px #325cf41f; }
        50%     { box-shadow: 0 0 0 7px #325cf40a; }
      }

      /* Payment cards — refined */
      .pay-card.selected {
        border-color: var(--blue);
        background: linear-gradient(180deg, #f5f8ff, #eef3ff);
        box-shadow: 0 0 0 3px #325cf41a, 0 10px 24px #325cf414;
      }
      .pay-card.selected .pay-chevron { background: var(--blue); color: #fff; }
      .pay-badge.hot {
        background: linear-gradient(90deg, #fff2d6, #ffe5b0);
        color: #a76d0a;
        animation: hotShimmer 2.5s ease-in-out infinite;
      }
      @keyframes hotShimmer {
        0%,100% { box-shadow: 0 0 0 0 #ffd88a40; }
        50%     { box-shadow: 0 0 0 4px #ffd88a20; }
      }

      /* UPI screen — QR hero */
      .upi-hero {
        display: flex; flex-direction: column; align-items: center;
        margin: 4px 0 18px;
        animation: paySlideUp .5s cubic-bezier(.2,.8,.3,1) .1s backwards;
      }
      .qr-frame {
        position: relative; width: 200px; height: 200px;
        padding: 10px; background: #fff; border-radius: 22px;
        display: grid; place-items: center;
        box-shadow: 0 20px 45px #192c5324, 0 0 0 1px #e8edf5;
      }
      .qr-frame::before {
        content: ""; position: absolute; inset: -3px; border-radius: 25px;
        background: conic-gradient(from 0deg, #325cf4, #7d9dff, #dbe4ff, #7d9dff, #325cf4);
        animation: spin 4s linear infinite; z-index: -1; opacity: .85;
      }
      .qr-frame::after {
        content: ""; position: absolute; inset: 0; border-radius: 20px;
        background: #fff; z-index: -1;
      }
      .qr-frame .qr {
        width: 100%; height: 100%; padding: 0; margin: 0;
        border: 0; border-radius: 14px; overflow: hidden; background: #fff;
      }
      .qr-frame .qr img { width: 100%; height: 100%; object-fit: contain; }

      .qr-timer {
        margin-top: 12px; font-size: 11px; font-weight: 700; color: var(--muted);
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 12px; border-radius: 100px; background: #f3f6fb;
      }
      .qr-timer svg { width: 12px; height: 12px; color: var(--blue); }
      .qr-timer.warn { color: #a76d0a; background: #fff4df; }
      .qr-timer.warn svg { color: #a76d0a; }

      .qr-download-btn {
        margin-top: 10px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 100px;
        border: 1px solid #dbe4f2;
        background: #fff;
        color: #53637d;
        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: .2px;
        transition: .18s;
        box-shadow: 0 2px 6px #192c530a;
      }
      .qr-download-btn:hover {
        color: var(--blue);
        border-color: #b3c5f5;
        background: #f5f8ff;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px #325cf41a;
      }
      .qr-download-btn:active { transform: translateY(0) scale(.97); }
      .qr-download-btn svg { width: 13px; height: 13px; }

      .upi-id-card {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 16px; border-radius: 15px;
        border: 1px solid #e4ebf7;
        background: linear-gradient(135deg, #fafcff, #f2f6ff);
        margin-top: 14px;
        animation: paySlideUp .5s cubic-bezier(.2,.8,.3,1) .18s backwards;
      }
      .upi-id-card .ci {
        flex: none; width: 38px; height: 38px; border-radius: 11px;
        background: #fff; color: var(--blue);
        display: grid; place-items: center;
        box-shadow: 0 3px 8px #325cf40d;
      }
      .upi-id-card .ci svg { width: 17px; height: 17px; }
      .upi-id-card .tx { flex: 1; min-width: 0; }
      .upi-id-card small {
        display: block; font-size: 9.5px; font-weight: 800;
        letter-spacing: 1.3px; color: #94a0b2;
        text-transform: uppercase; margin-bottom: 2px;
      }
      .upi-id-card strong {
        display: block; font-size: 13.5px; font-weight: 800;
        color: var(--ink); letter-spacing: -.2px;
      }
      .copy-btn {
        flex: none; width: 36px; height: 36px;
        border: 1px solid #dbe4f2; background: #fff;
        border-radius: 9px; color: #53637d;
        display: grid; place-items: center; transition: .18s;
      }
      .copy-btn:hover { color: var(--blue); border-color: #b3c5f5; background: #f5f8ff; }
      .copy-btn.copied { color: #16945b; border-color: #b7e6cd; background: #edfaf3; }
      .copy-btn svg { width: 15px; height: 15px; }

      /* Transaction input */
      .txn-field { margin-top: 18px; animation: paySlideUp .5s cubic-bezier(.2,.8,.3,1) .26s backwards; }
      .txn-label {
        display: flex; align-items: center; gap: 8px;
        font-size: 12px; font-weight: 800; color: var(--ink); margin-bottom: 8px;
      }
      .txn-label .step-num {
        width: 20px; height: 20px; border-radius: 50%;
        background: var(--blue); color: #fff;
        display: grid; place-items: center; font-size: 10px; font-weight: 800;
      }
      .txn-input-wrap { position: relative; }
      .txn-input-wrap .field { margin-top: 0; padding-left: 40px; padding-right: 40px; }
      .txn-input-wrap .field:focus {
        border-color: var(--blue); box-shadow: 0 0 0 3px #325cf420;
      }
      .txn-input-wrap .field-icon {
        position: absolute; left: 13px; top: 50%;
        transform: translateY(-50%); color: #94a0b2; pointer-events: none;
      }
      .txn-input-wrap .field-icon svg { width: 16px; height: 16px; display: block; }
      .txn-input-wrap .field-ok {
        position: absolute; right: 13px; top: 50%;
        transform: translateY(-50%) scale(0);
        color: #16945b; transition: transform .25s cubic-bezier(.2,.8,.3,1.2);
      }
      .txn-input-wrap .field-ok.show { transform: translateY(-50%) scale(1); }
      .txn-input-wrap .field-ok svg { width: 16px; height: 16px; display: block; }

      /* Cash screen */
      .cash-hero {
        display: flex; flex-direction: column; align-items: center;
        text-align: center; padding: 6px 0 2px;
        animation: paySlideUp .5s cubic-bezier(.2,.8,.3,1) .1s backwards;
      }
      .cash-icon {
        width: 64px; height: 64px; border-radius: 20px;
        background: linear-gradient(135deg, #e8f8ef, #c9efda);
        color: #16945b; display: grid; place-items: center;
        margin-bottom: 14px;
        box-shadow: 0 10px 24px #16945b1f, 0 0 0 7px #e8f8ef;
        animation: cashBounce .7s cubic-bezier(.2,.8,.3,1.2);
      }
      .cash-icon svg { width: 28px; height: 28px; }
      @keyframes cashBounce {
        0%   { transform: scale(.6); opacity: 0; }
        60%  { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      .cash-amount-box {
        width: 100%; margin-top: 18px; padding: 22px 20px;
        border-radius: 20px;
        background: linear-gradient(135deg, #f0faf5, #e2f7ec);
        border: 1px solid #c9eeda; position: relative; overflow: hidden;
        animation: paySlideUp .5s cubic-bezier(.2,.8,.3,1) .18s backwards;
      }
      .cash-amount-box::before {
        content: ""; position: absolute; right: -30px; top: -30px;
        width: 120px; height: 120px; border-radius: 50%;
        background: radial-gradient(circle, #16945b1f, transparent 70%);
        pointer-events: none;
      }
      .cash-amount-box small {
        display: block; font-size: 10px; font-weight: 800;
        letter-spacing: 1.6px; text-transform: uppercase;
        color: #16945b; margin-bottom: 4px;
      }
      .cash-amount-box .amount {
        font-size: 36px; font-weight: 800; letter-spacing: -1.5px;
        color: #16945b; line-height: 1.1; font-variant-numeric: tabular-nums;
      }
      .cash-amount-box p {
        font-size: 12px; color: #4d7a63; margin: 6px 0 0;
        font-weight: 600; line-height: 1.5;
      }
      .cash-instructions {
        margin-top: 16px; padding: 14px 16px; border-radius: 14px;
        background: #fafbff; border: 1px dashed #dbe4f0;
        animation: paySlideUp .5s cubic-bezier(.2,.8,.3,1) .26s backwards;
      }
      .cash-instructions h4 {
        font-size: 12px; font-weight: 800; margin: 0 0 10px; color: var(--ink);
      }
      .cash-instructions ol {
        margin: 0; padding-left: 18px; font-size: 12px;
        color: #5a6b86; line-height: 1.7;
      }
      .cash-instructions li::marker { color: var(--blue); font-weight: 800; }

      /* Success screen */
      .success-hero { text-align: center; padding: 8px 0 0; }
      .success-icon {
        width: 74px; height: 74px; border-radius: 50%;
        background: linear-gradient(135deg, #e7f8ef, #c9efda);
        color: #18a362; display: grid; place-items: center;
        margin: 6px auto 16px;
        animation: successPop .6s cubic-bezier(.2,.8,.3,1.1),
                   successRing 1.6s ease-out .2s;
      }
      .success-icon svg { width: 36px; height: 36px; }
      @keyframes successPop {
        0%   { transform: scale(.4); opacity: 0; }
        60%  { transform: scale(1.08); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes successRing {
        0%   { box-shadow: 0 0 0 0 #18a36266; }
        100% { box-shadow: 0 0 0 26px #18a36200; }
      }
      .success-hero h2 {
        font-size: 22px; font-weight: 800; letter-spacing: -.6px;
        margin: 0 0 6px;
        animation: paySlideUp .5s cubic-bezier(.2,.8,.3,1) .1s backwards;
      }
      .success-hero .sub {
        margin: 0;
        animation: paySlideUp .5s cubic-bezier(.2,.8,.3,1) .16s backwards;
      }

      /* Ticket */
      .ticket {
        background: linear-gradient(135deg, #f7f9ff, #eef3ff);
        border: 1px dashed #bacaf2; border-radius: 20px;
        text-align: center; padding: 26px 18px; margin: 20px 0;
        position: relative; overflow: hidden;
        animation: ticketRise .55s cubic-bezier(.2,.8,.3,1) .22s backwards;
      }
      .ticket::before, .ticket::after {
        content: ""; position: absolute;
        width: 20px; height: 20px; border-radius: 50%;
        background: var(--bg); top: 50%; transform: translateY(-50%);
      }
      .ticket::before { left: -10px; }
      .ticket::after  { right: -10px; }
      @keyframes ticketRise {
        0%   { transform: translateY(20px) scale(.97); opacity: 0; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
      }
      .ticket small {
        font-size: 10px; color: var(--muted); font-weight: 800;
        text-transform: uppercase; letter-spacing: 2px;
      }
      .ticket .number {
        font-size: 46px; letter-spacing: -2px; font-weight: 800;
        margin: 4px 0; font-variant-numeric: tabular-nums;
        background: linear-gradient(135deg, #325cf4, #5a7bff);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: ticketNumber .8s cubic-bezier(.2,.8,.3,1) .3s backwards;
      }
      @keyframes ticketNumber {
        0%   { transform: translateY(10px); opacity: 0; letter-spacing: -6px; }
        100% { transform: translateY(0); opacity: 1; letter-spacing: -2px; }
      }

      /* Staggered success detail rows + actions */
      .success-rows .sum-row { animation: paySlideUp .4s cubic-bezier(.2,.8,.3,1) backwards; }
      .success-rows .sum-row:nth-child(1) { animation-delay: .3s; }
      .success-rows .sum-row:nth-child(2) { animation-delay: .35s; }
      .success-rows .sum-row:nth-child(3) { animation-delay: .4s; }
      .success-rows .sum-row:nth-child(4) { animation-delay: .45s; }
      .success-actions {
        display: flex; flex-direction: column; gap: 8px; margin-top: 22px;
        animation: paySlideUp .5s cubic-bezier(.2,.8,.3,1) .5s backwards;
      }

            /* ===================== Profile tab + details gate ===================== */
      .profile-card-lg { padding: 20px; }

      .profile-id {
        display: flex; align-items: center; gap: 14px;
        padding-bottom: 16px; border-bottom: 1px dashed #e4ecf8;
      }
      .profile-avatar {
        flex: none; width: 54px; height: 54px; border-radius: 17px;
        display: grid; place-items: center;
        font-size: 18px; font-weight: 800; letter-spacing: -.5px; color: #fff;
        background: linear-gradient(135deg, #325cf4, #6f8cff);
        box-shadow: 0 10px 22px #325cf436;
      }
      .profile-id-tx { min-width: 0; }
      .profile-id-tx strong {
        display: block; font-size: 15px; font-weight: 800; letter-spacing: -.3px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .profile-id-tx small {
        display: block; font-size: 11.5px; color: var(--muted); font-weight: 600;
        margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      .pf-grid { display: grid; gap: 14px; margin-top: 16px; }
      @media (min-width: 640px) {
        .pf-grid { grid-template-columns: 1fr 1fr; }
        .pf-grid .pf-row.wide { grid-column: 1 / -1; }
      }
      .pf-row { min-width: 0; }
      .pf-label {
        display: flex; align-items: center; gap: 6px;
        font-size: 10.5px; font-weight: 800; letter-spacing: 1px;
        text-transform: uppercase; color: #8a97ac; margin-bottom: 7px;
      }
      .pf-req { color: #e04c4c; }
      .pf-opt {
        font-size: 9px; font-weight: 800; letter-spacing: .7px;
        color: #94a0b2; background: #f1f5fc; border-radius: 100px; padding: 2px 7px;
      }
      .pf-row .field { margin-top: 0; }
      .pf-row .field.invalid { border-color: #e04c4c; box-shadow: 0 0 0 3px #e04c4c1a; }
      .pf-err {
        display: flex; align-items: center; gap: 5px;
        font-size: 11px; font-weight: 700; color: #d14848; margin: 7px 0 0;
      }
      .pf-err svg { width: 12px; height: 12px; flex: none; }
      .pf-err[hidden] { display: none; }

      /* Details-gate modal */
      .profile-gate {
        position: fixed; inset: 0; z-index: 56;
        background: #101b34a8; backdrop-filter: blur(5px);
        display: none; align-items: center; justify-content: center; padding: 18px;
      }
      .profile-gate.open { display: flex; animation: fadeIn .22s ease-out; }
      .profile-gate-card {
        width: 100%; max-width: 430px; max-height: 92vh; overflow: auto;
        background: #fff; border-radius: 24px; padding: 22px 22px 20px;
        box-shadow: 0 28px 70px #101c3555;
      }
      .profile-gate.open .profile-gate-card { animation: confirmPop .34s cubic-bezier(.2,.8,.3,1.1); }

      .pg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
      .pg-icon {
        width: 52px; height: 52px; border-radius: 16px;
        background: linear-gradient(135deg, #eef2ff, #dbe4ff);
        color: var(--blue); display: grid; place-items: center;
        box-shadow: 0 8px 20px #325cf41f;
      }
      .pg-icon svg { width: 24px; height: 24px; }
      .profile-gate-card h2 { font-size: 20px; font-weight: 800; letter-spacing: -.6px; margin: 0 0 8px; }
      .profile-gate-card .sub { margin: 0 0 18px; font-size: 12.5px; line-height: 1.6; }
      .pg-note {
        display: flex; gap: 8px; align-items: flex-start;
        margin-top: 16px; padding: 11px 13px; border-radius: 12px;
        background: #f5f8ff; border: 1px solid #e4ecf8;
        font-size: 11.5px; color: #5a6b86; font-weight: 600; line-height: 1.5;
      }
      .pg-note svg { width: 14px; height: 14px; color: var(--blue); flex: none; margin-top: 1px; }
      .pg-actions { display: flex; gap: 9px; margin-top: 18px; }
      .pg-actions .btn { flex: 1; }

      @media (max-width: 520px) {
        .profile-gate { align-items: flex-end; padding: 0; }
        .profile-gate-card {
          max-width: 100%; border-radius: 24px 24px 0 0; padding: 22px 20px 26px;
        }
        .profile-gate.open .profile-gate-card { animation: rise .3s ease-out; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          scroll-behavior: auto !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <aside class="side canva-sidebar">
        <div class="brand">
          <span class="mark"><i data-lucide="printer"></i></span>Smart Xerox
        </div>
        <nav class="side-nav canva-menu" aria-label="Desktop navigation">
          <button data-nav="home" class="active"><i data-lucide="house"></i> Home</button>
          <button data-nav="orders"><i data-lucide="package"></i> My Orders</button>
          <button data-nav="history"><i data-lucide="history"></i> History</button>
          <button data-nav="profile"><i data-lucide="user-round"></i> Profile</button>
        </nav>
        <p class="sub" style="margin:auto 10px 5px;font-size:11px">Print simply. Pick up confidently.</p>
      </aside>

      <div class="main-area">
        <main id="main" class="content canva-container">
          <header class="top canva-header">
            <div class="brand">
              <span class="mark"><i data-lucide="printer"></i></span>Smart Xerox
            </div>
            <span class="top-note">PRINT MADE EASY</span>
          </header>
          <div id="view"></div>
        </main>
      </div>
    </div>

    <div id="action-bar" class="action-bar canva-panel" hidden></div>

    <nav class="bottom canva-menu" aria-label="Mobile navigation">
      <button data-nav="home" class="nav-btn active"><i data-lucide="house"></i><span>Home</span></button>
      <button data-nav="orders" class="nav-btn"><i data-lucide="package"></i><span>My Orders</span></button>
      <button data-nav="history" class="nav-btn"><i data-lucide="history"></i><span>History</span></button>
      <button data-nav="profile" class="nav-btn"><i data-lucide="user-round"></i><span>Profile</span></button>
    </nav>

    <input id="files" class="canva-input" type="file"
           accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,application/pdf,image/*" multiple hidden
           aria-label="Upload documents">
    <input id="replace-file" class="canva-input" type="file"
           accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" hidden aria-label="Replace document">

    <div id="overlay" class="overlay" role="presentation">
      <div id="sheet" class="sheet canva-panel" role="dialog" aria-modal="true" aria-label="Order options"></div>
    </div>

    <div id="preview" class="preview canva-panel" role="dialog" aria-modal="true" aria-label="Document preview">
      <div class="preview-top">
        <strong id="preview-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></strong>
        <button id="close-preview" class="icon-btn canva-button" aria-label="Close preview"><i data-lucide="x"></i></button>
      </div>
      <div id="preview-main" class="preview-main"></div>
      <div class="preview-controls">
        <button id="prev-page" class="canva-button" aria-label="Previous page"><i data-lucide="chevron-left"></i></button>
        <span id="page-label"></span>
        <button id="next-page" class="canva-button" aria-label="Next page"><i data-lucide="chevron-right"></i></button>
        <button id="zoom-out" class="canva-button" aria-label="Zoom out">−</button>
        <button id="zoom-in" class="canva-button" aria-label="Zoom in">+</button>
      </div>
      <div id="thumbs" class="thumbs"></div>
    </div>

    <div id="confirm-overlay" class="confirm-overlay" role="presentation">
      <div id="confirm-card" class="confirm-card" role="dialog" aria-modal="true"></div>
    </div>

    <div id="profile-gate" class="profile-gate" role="presentation">
      <div id="profile-gate-card" class="profile-gate-card" role="dialog" aria-modal="true" aria-labelledby="pg-title"></div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      /* =====================================================================
       *  Smart Xerox — standalone, offline-tolerant SPA
       * ===================================================================== */

      /* -------------------- pdf.js worker (optional) -------------------- */
      if (window.pdfjsLib) {
        try {
          pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        } catch (_) { /* ignore */ }
      }

      /* -------------------- tiny helpers -------------------------------- */
      const $ = (sel) => document.querySelector(sel);
      const money = (n) => '₹' + Number(n || 0).toFixed(2);
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
      const clone = (o) => (typeof structuredClone === 'function'
        ? structuredClone(o)
        : JSON.parse(JSON.stringify(o)));

      const toast = (msg) => {
        const el = $('#toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => el.classList.remove('show'), 3500);
      };

      const uid = () => (crypto.randomUUID
        ? crypto.randomUUID()
        : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2));

      const fmt = (v) => new Date(v).toLocaleString('en-IN', {
        dateStyle: 'medium', timeStyle: 'short'
      });

      const icons = () => { try { if (window.lucide) lucide.createIcons(); } catch (_) {} };

      /* -------------------- app state ----------------------------------- */
      const state = {
        view: 'home',
        docs: [],
        orders: [],
        current: 0,
        detail: null,
        preview: null,
        previewPage: 1,
        zoom: 1,
        db: null,
        ready: false,
        submitting: false,
        _memDocs: {},   // in-memory fallback when IndexedDB is unavailable
        _memOrders: {},
        profile: { name: '', phone: '', email: '' }   // populated in init()
      };

      const defaultCfg = () => ({
        colour: 'Black & White',
        paper: 'A4',
        copies: 1,
